name: Deploy

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

env:
  IMAGE_NAME: tovarika-backend
  DEPLOY_DIR: /home/deploy/tovarika-backend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          path: Tovarika

      - name: Checkout API contract
        uses: actions/checkout@v4
        with:
          repository: Bla2Code/tovarika-api-contract
          path: tovarika-api-contract
          token: ${{ secrets.CONTRACTS_REPO_TOKEN || github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: tovarika-api-contract/package-lock.json

      - name: Build API contract
        working-directory: tovarika-api-contract
        run: |
          npm ci
          npm run build

      - name: Build image
        run: |
          docker build -f Tovarika/Dockerfile -t "$IMAGE_NAME:latest" -t "$IMAGE_NAME:${{ github.sha }}" .
          docker save "$IMAGE_NAME:latest" | gzip > "/tmp/${IMAGE_NAME}.tar.gz"

      - name: Prepare production env file
        env:
          JWT_SECRET_BASE64: ${{ secrets.JWT_SECRET_BASE64 }}
        run: |
          : "${JWT_SECRET_BASE64:?GitHub secret JWT_SECRET_BASE64 is required for production deploy}"
          printf 'JWT_SECRET_BASE64=%s\n' "$JWT_SECRET_BASE64" > "/tmp/${IMAGE_NAME}.env"
          chmod 600 "/tmp/${IMAGE_NAME}.env"

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Configure SSH known_hosts
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          : "${DEPLOY_HOST:?GitHub secret DEPLOY_HOST is required for deploy}"
          : "${DEPLOY_KNOWN_HOSTS:?GitHub secret DEPLOY_KNOWN_HOSTS is required for deploy}"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -F "$DEPLOY_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null

      - name: Copy deploy files
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          : "${DEPLOY_USER:?GitHub secret DEPLOY_USER is required for deploy}"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ConnectionAttempts=5 "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p $DEPLOY_DIR"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ConnectionAttempts=5 "/tmp/${IMAGE_NAME}.tar.gz" "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR/${IMAGE_NAME}.tar.gz"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ConnectionAttempts=5 "Tovarika/deploy/docker-compose.prod.yml" "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR/docker-compose.prod.yml"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ConnectionAttempts=5 "/tmp/${IMAGE_NAME}.env" "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR/.env"
          rm -f "/tmp/${IMAGE_NAME}.env"

      - name: Load image and restart stack
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ConnectionAttempts=5 "$DEPLOY_USER@$DEPLOY_HOST" <<'EOF'
          set -e
          cd /home/deploy/tovarika-backend
          gunzip -c tovarika-backend.tar.gz | docker load
          if ! docker network inspect tovarika-edge >/dev/null 2>&1; then
            docker network create tovarika-edge >/dev/null 2>&1 || docker network inspect tovarika-edge >/dev/null 2>&1
          fi
          docker compose --env-file .env -f docker-compose.prod.yml up -d --remove-orphans
          rm -f tovarika-backend.tar.gz
          docker image prune -f
          EOF
