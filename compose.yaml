services:
  app:
    image: tovarika-backend:local
    profiles: ["full"]
    build:
      context: ..
      dockerfile: Tovarika/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-tovarika}
      DB_USERNAME: ${POSTGRES_USER:-tovarika}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-tovarika}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-tovarika}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-tovarika-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-user-images}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:-}
      JWT_ISSUER: ${JWT_ISSUER:-http://localhost:8080}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-tovarika-ui}
      UI_ALLOWED_ORIGINS: ${UI_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:8081}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-tovarika_refresh}
      OAUTH_COOKIE_NAME: ${OAUTH_COOKIE_NAME:-tovarika_oauth}
      TRIAL_COOKIE_NAME: ${TRIAL_COOKIE_NAME:-tovarika_trial}
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
      YANDEX_REDIRECT_URI: ${YANDEX_REDIRECT_URI:-http://localhost:8080/api/v1/auth/oauth/yandex/callback}
      SMTP_HOST: ${SMTP_HOST:-host.docker.internal}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      AUTH_UI_BASE_URI: ${AUTH_UI_BASE_URI:-http://localhost:8081}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8080/openapi/tovarika-openapi.yaml"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tovarika}
      POSTGRES_USER: ${POSTGRES_USER:-tovarika}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tovarika}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tovarika} -d ${POSTGRES_DB:-tovarika}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-tovarika}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-tovarika-secret}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  minio-data:
