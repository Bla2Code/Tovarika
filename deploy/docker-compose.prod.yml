name: tovarika-backend

services:
  app:
    image: tovarika-backend:latest
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-tovarika}
      DB_USERNAME: ${POSTGRES_USER:-tovarika}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-tovarika}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-tovarika}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-tovarika-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-user-images}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:-}
      JWT_ISSUER: ${JWT_ISSUER:-https://api.tovarika.com}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-tovarika-ui}
      UI_ALLOWED_ORIGINS: ${UI_ALLOWED_ORIGINS:-https://tovarika.com}
      AUTH_COOKIE_SECURE: "true"
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
      YANDEX_REDIRECT_URI: ${YANDEX_REDIRECT_URI:-https://api.tovarika.com/api/v1/auth/oauth/yandex/callback}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      AUTH_MAIL_FROM: ${AUTH_MAIL_FROM:-no-reply@tovarika.com}
      AUTH_UI_BASE_URI: ${AUTH_UI_BASE_URI:-https://tovarika.com}
    expose:
      - "8080"
    networks:
      default:
      edge:
        aliases:
          - tovarika-backend
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8080/openapi/tovarika-openapi.yaml"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tovarika}
      POSTGRES_USER: ${POSTGRES_USER:-tovarika}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tovarika}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tovarika} -d ${POSTGRES_DB:-tovarika}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-tovarika}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-tovarika-secret}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  edge:
    name: tovarika-edge
    external: true

volumes:
  postgres-data:
  minio-data:
