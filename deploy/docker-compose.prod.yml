name: tovarika-backend

services:
  app:
    image: tovarika-backend:latest
    restart: unless-stopped
    user: "${APP_UID:?APP_UID is required}:${APP_GID:?APP_GID is required}"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-tovarika}
      DB_USERNAME: ${POSTGRES_USER:-tovarika}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-tovarika}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-tovarika}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-tovarika-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-user-images}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:?JWT_SECRET_BASE64 is required for production}
      JWT_ISSUER: ${JWT_ISSUER:-https://api.tovarika.com}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-tovarika-ui}
      UI_ALLOWED_ORIGINS: ${UI_ALLOWED_ORIGINS:-https://tovarika.com}
      AUTH_COOKIE_SECURE: "true"
      ASSET_PUBLIC_BASE_URL: ${ASSET_PUBLIC_BASE_URL:-https://tovarika.com}
      SPRING_CONFIG_IMPORT: "configtree:/run/secrets/yandex/,optional:configtree:/run/secrets/robokassa/"
      YANDEX_REDIRECT_URI: ${YANDEX_REDIRECT_URI:-https://tovarika.com/api/v1/auth/oauth/yandex/callback}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      AUTH_MAIL_FROM: ${AUTH_MAIL_FROM:-no-reply@tovarika.com}
      AUTH_UI_BASE_URI: ${AUTH_UI_BASE_URI:-https://tovarika.com}
      TOVARIKA_BILLING_AI_ADMISSION_ENABLED: ${TOVARIKA_BILLING_AI_ADMISSION_ENABLED:-true}
      OPENAI_MODE: ${OPENAI_MODE:-live}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
      OPENAI_VISION_MODEL: ${OPENAI_VISION_MODEL:-gpt-6-luna}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-2.5-sunburst}
      TOVARIKA_PAYMENTS_ROBOKASSA_MODE: ${ROBOKASSA_MODE:-test}
      TOVARIKA_PAYMENTS_ROBOKASSA_MERCHANTLOGIN: ${ROBOKASSA_MERCHANT_LOGIN:-tovarika}
      TOVARIKA_PAYMENTS_ROBOKASSA_TESTUSERIDS: ${ROBOKASSA_TEST_USER_IDS:-}
    secrets:
      - openai_api_key
      - source: yandex_client_id
        target: /run/secrets/yandex/tovarika.security.oauth.yandex.client-id
      - source: yandex_client_secret
        target: /run/secrets/yandex/tovarika.security.oauth.yandex.client-secret
      - source: robokassa_test_password1
        target: /run/secrets/robokassa/tovarika.payments.robokassa.test-password1
      - source: robokassa_test_password2
        target: /run/secrets/robokassa/tovarika.payments.robokassa.test-password2
    expose:
      - "8080"
    networks:
      default:
      edge:
        aliases:
          - tovarika-backend
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--output-document=/dev/null", "http://localhost:8080/openapi/tovarika-openapi.yaml" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tovarika}
      POSTGRES_USER: ${POSTGRES_USER:-tovarika}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tovarika}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tovarika} -d ${POSTGRES_DB:-tovarika}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-tovarika}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-tovarika-secret}
    volumes:
      - minio-data:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 5s
      timeout: 5s
      retries: 10

  template-assets-init:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: [ "template-sync" ]
    entrypoint: [ "/bin/sh", "/sync/sync-template-assets.sh" ]
    command: []
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-tovarika}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-tovarika-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-user-images}
    volumes:
      - ./template-assets:/template-assets:ro
      - ./sync-template-assets.sh:/sync/sync-template-assets.sh:ro
    depends_on:
      minio:
        condition: service_healthy

networks:
  edge:
    name: tovarika-edge
    external: true

volumes:
  postgres-data:
  minio-data:

secrets:
  openai_api_key:
    file: ./secrets/openai_api_key
  yandex_client_id:
    file: ${YANDEX_CLIENT_ID_SOURCE:-./secrets/yandex_client_id}
  yandex_client_secret:
    file: ${YANDEX_CLIENT_SECRET_SOURCE:-./secrets/yandex_client_secret}
  robokassa_test_password1:
    file: ${ROBOKASSA_TEST_PASSWORD1_SOURCE:-secrets/test_robokassa_pass1}
  robokassa_test_password2:
    file: ${ROBOKASSA_TEST_PASSWORD2_SOURCE:-secrets/test_robokassa_pass2}
