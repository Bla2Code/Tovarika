spring.application.name=tovarika

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tovarika}
spring.datasource.username=${DB_USERNAME:tovarika}
spring.datasource.password=${DB_PASSWORD:tovarika}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# Authentication secrets have no source-code defaults. Production and local runs must provide them explicitly.
tovarika.security.jwt.issuer=${JWT_ISSUER:https://api.tovarika.ru}
tovarika.security.jwt.audience=${JWT_AUDIENCE:tovarika-ui}
tovarika.security.jwt.access-token-ttl=10m
tovarika.security.jwt.secret-base64=${JWT_SECRET_BASE64:}
tovarika.security.refresh.absolute-ttl=30d
tovarika.security.refresh.inactivity-ttl=14d
tovarika.security.token.password-reset-ttl=20m
tovarika.security.cookie.refresh-name=${REFRESH_COOKIE_NAME:__Host-tovarika_refresh}
tovarika.security.cookie.oauth-name=${OAUTH_COOKIE_NAME:__Host-tovarika_oauth}
tovarika.security.cookie.trial-name=${TRIAL_COOKIE_NAME:__Host-tovarika_trial}
tovarika.security.cookie.secure=${AUTH_COOKIE_SECURE:true}
tovarika.security.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}
tovarika.security.cookie.path=/
tovarika.security.cors.allowed-origins=${UI_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8081}
tovarika.security.password.breached-check-enabled=${BREACHED_PASSWORD_CHECK_ENABLED:false}
tovarika.security.password.pwned-api-url=${PWNED_PASSWORD_API_URL:https://api.pwnedpasswords.com/range/}
tovarika.security.oauth.yandex.client-id=${YANDEX_CLIENT_ID:}
tovarika.security.oauth.yandex.client-secret=${YANDEX_CLIENT_SECRET:}
tovarika.security.oauth.yandex.authorization-uri=https://oauth.yandex.ru/authorize
tovarika.security.oauth.yandex.token-uri=https://oauth.yandex.ru/token
tovarika.security.oauth.yandex.user-info-uri=https://login.yandex.ru/info?format=json
tovarika.security.oauth.yandex.redirect-uri=${YANDEX_REDIRECT_URI:https://api.tovarika.ru/api/v1/auth/oauth/yandex/callback}
tovarika.security.oauth.yandex.attempt-ttl=10m
tovarika.security.oauth.yandex.allowed-return-path-prefixes=/editor,/projects,/account
tovarika.security.mail.from=${AUTH_MAIL_FROM:no-reply@tovarika.ru}
tovarika.security.mail.ui-base-uri=${AUTH_UI_BASE_URI:https://tovarika.ru}
tovarika.security.rate-limit.login.max-attempts=10
tovarika.security.rate-limit.login.window=1m
tovarika.security.rate-limit.register.max-attempts=5
tovarika.security.rate-limit.register.window=1h
tovarika.security.rate-limit.password-reset.max-attempts=5
tovarika.security.rate-limit.password-reset.window=1h
tovarika.security.rate-limit.oauth-start.max-attempts=20
tovarika.security.rate-limit.oauth-start.window=1m
tovarika.security.rate-limit.oauth-callback.max-attempts=30
tovarika.security.rate-limit.oauth-callback.window=1m
tovarika.security.rate-limit.refresh.max-attempts=60
tovarika.security.rate-limit.refresh.window=1m

spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:25}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}

spring.servlet.multipart.max-file-size=${MAX_IMAGE_SIZE:20MB}
spring.servlet.multipart.max-request-size=${MAX_IMAGE_SIZE:20MB}

tovarika.storage.minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
tovarika.storage.minio.access-key=${MINIO_ACCESS_KEY:tovarika}
tovarika.storage.minio.secret-key=${MINIO_SECRET_KEY:tovarika-secret}
tovarika.storage.minio.bucket=${MINIO_BUCKET:user-images}
tovarika.storage.minio.initialize-bucket=${MINIO_INITIALIZE_BUCKET:true}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.url=/openapi/tovarika-openapi.yaml
springdoc.swagger-ui.disable-swagger-default-url=true
