databaseChangeLog:
  - changeSet:
      id: 001-authentication
      author: tovarika
      comment: Authentication identities, rotating refresh families, one-time tokens, OAuth attempts and distributed rate limits.
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE TABLE users (
                  id varchar(40) PRIMARY KEY,
                  email varchar(320) NOT NULL,
                  email_verified boolean NOT NULL DEFAULT false,
                  display_name varchar(100),
                  avatar_url varchar(2048),
                  status varchar(40) NOT NULL,
                  created_at timestamptz NOT NULL,
                  updated_at timestamptz NOT NULL,
                  CONSTRAINT ck_users_status CHECK (status IN ('PENDING_EMAIL_VERIFICATION', 'ACTIVE', 'BLOCKED', 'DELETED')),
                  CONSTRAINT ck_users_display_name CHECK (display_name IS NULL OR char_length(display_name) BETWEEN 1 AND 100)
              );

              CREATE INDEX ix_users_email ON users (lower(email));
              CREATE INDEX ix_users_status ON users (status);

              CREATE TABLE auth_identities (
                  id varchar(40) PRIMARY KEY,
                  user_id varchar(40) NOT NULL REFERENCES users(id) ON DELETE CASCADE,
                  provider varchar(20) NOT NULL,
                  provider_user_id varchar(320) NOT NULL,
                  password_hash varchar(512),
                  created_at timestamptz NOT NULL,
                  updated_at timestamptz NOT NULL,
                  CONSTRAINT uq_auth_identities_provider_user UNIQUE (provider, provider_user_id),
                  CONSTRAINT ck_auth_identities_provider CHECK (provider IN ('EMAIL', 'YANDEX')),
                  CONSTRAINT ck_auth_identities_password CHECK (
                      (provider = 'EMAIL' AND password_hash IS NOT NULL)
                      OR (provider = 'YANDEX' AND password_hash IS NULL)
                  )
              );

              CREATE INDEX ix_auth_identities_user ON auth_identities (user_id);

              CREATE TABLE auth_sessions (
                  id varchar(40) PRIMARY KEY,
                  user_id varchar(40) NOT NULL REFERENCES users(id) ON DELETE CASCADE,
                  token_family_id varchar(40) NOT NULL UNIQUE,
                  created_at timestamptz NOT NULL,
                  last_activity_at timestamptz NOT NULL,
                  absolute_expires_at timestamptz NOT NULL,
                  revoked_at timestamptz,
                  device_name varchar(200),
                  approximate_ip varchar(64),
                  CONSTRAINT ck_auth_sessions_expiry CHECK (absolute_expires_at > created_at),
                  CONSTRAINT ck_auth_sessions_activity CHECK (last_activity_at >= created_at)
              );

              CREATE INDEX ix_auth_sessions_user ON auth_sessions (user_id);
              CREATE INDEX ix_auth_sessions_family ON auth_sessions (token_family_id);
              CREATE INDEX ix_auth_sessions_active ON auth_sessions (user_id, absolute_expires_at) WHERE revoked_at IS NULL;
              CREATE INDEX ix_auth_sessions_expiration ON auth_sessions (absolute_expires_at);

              CREATE TABLE refresh_tokens (
                  id varchar(40) PRIMARY KEY,
                  session_id varchar(40) NOT NULL REFERENCES auth_sessions(id) ON DELETE CASCADE,
                  token_hash char(64) NOT NULL UNIQUE,
                  created_at timestamptz NOT NULL,
                  consumed_at timestamptz,
                  rotated_at timestamptz,
                  replacement_token_id varchar(40),
                  CONSTRAINT fk_refresh_replacement FOREIGN KEY (replacement_token_id) REFERENCES refresh_tokens(id) DEFERRABLE INITIALLY DEFERRED,
                  CONSTRAINT ck_refresh_rotation CHECK (
                      (consumed_at IS NULL AND rotated_at IS NULL AND replacement_token_id IS NULL)
                      OR (consumed_at IS NOT NULL AND rotated_at IS NOT NULL AND replacement_token_id IS NOT NULL)
                  )
              );

              CREATE INDEX ix_refresh_tokens_session ON refresh_tokens (session_id);
              CREATE INDEX ix_refresh_tokens_cleanup ON refresh_tokens (created_at);
              CREATE UNIQUE INDEX uq_refresh_active_per_session ON refresh_tokens (session_id) WHERE consumed_at IS NULL;

              CREATE TABLE email_verification_tokens (
                  id varchar(40) PRIMARY KEY,
                  user_id varchar(40) NOT NULL REFERENCES users(id) ON DELETE CASCADE,
                  token_hash char(64) NOT NULL UNIQUE,
                  created_at timestamptz NOT NULL,
                  expires_at timestamptz NOT NULL,
                  consumed_at timestamptz,
                  CONSTRAINT ck_email_verification_expiry CHECK (expires_at > created_at)
              );

              CREATE INDEX ix_email_verification_user ON email_verification_tokens (user_id);
              CREATE INDEX ix_email_verification_expiration ON email_verification_tokens (expires_at) WHERE consumed_at IS NULL;
              CREATE UNIQUE INDEX uq_email_verification_active_user ON email_verification_tokens (user_id) WHERE consumed_at IS NULL;

              CREATE TABLE password_reset_tokens (
                  id varchar(40) PRIMARY KEY,
                  identity_id varchar(40) NOT NULL REFERENCES auth_identities(id) ON DELETE CASCADE,
                  user_id varchar(40) NOT NULL REFERENCES users(id) ON DELETE CASCADE,
                  token_hash char(64) NOT NULL UNIQUE,
                  created_at timestamptz NOT NULL,
                  expires_at timestamptz NOT NULL,
                  consumed_at timestamptz,
                  CONSTRAINT ck_password_reset_expiry CHECK (expires_at > created_at)
              );

              CREATE INDEX ix_password_reset_user ON password_reset_tokens (user_id);
              CREATE INDEX ix_password_reset_expiration ON password_reset_tokens (expires_at) WHERE consumed_at IS NULL;
              CREATE UNIQUE INDEX uq_password_reset_active_identity ON password_reset_tokens (identity_id) WHERE consumed_at IS NULL;

              CREATE TABLE oauth_attempts (
                  id varchar(40) PRIMARY KEY,
                  provider varchar(20) NOT NULL,
                  state_hash char(64) NOT NULL UNIQUE,
                  correlation_hash char(64) NOT NULL UNIQUE,
                  pkce_verifier varchar(128) NOT NULL,
                  return_path varchar(1000) NOT NULL,
                  created_at timestamptz NOT NULL,
                  expires_at timestamptz NOT NULL,
                  consumed_at timestamptz,
                  CONSTRAINT ck_oauth_attempt_provider CHECK (provider = 'YANDEX'),
                  CONSTRAINT ck_oauth_attempt_expiry CHECK (expires_at > created_at),
                  CONSTRAINT ck_oauth_return_path CHECK (
                      return_path LIKE '/%'
                      AND return_path NOT LIKE '//%'
                      AND return_path !~ '[^A-Za-z0-9/_?&=.%~-]'
                  )
              );

              CREATE INDEX ix_oauth_attempt_expiration ON oauth_attempts (expires_at) WHERE consumed_at IS NULL;

              CREATE TABLE trial_sessions (
                  id varchar(40) PRIMARY KEY,
                  token_hash char(64) NOT NULL UNIQUE,
                  created_at timestamptz NOT NULL,
                  expires_at timestamptz NOT NULL,
                  owner_user_id varchar(40) REFERENCES users(id),
                  converted_at timestamptz,
                  CONSTRAINT ck_trial_conversion CHECK (
                      (owner_user_id IS NULL AND converted_at IS NULL)
                      OR (owner_user_id IS NOT NULL AND converted_at IS NOT NULL)
                  )
              );

              CREATE INDEX ix_trial_sessions_expiration ON trial_sessions (expires_at) WHERE owner_user_id IS NULL;

              CREATE TABLE authentication_rate_limits (
                  scope varchar(40) NOT NULL,
                  subject_hash char(64) NOT NULL,
                  window_started_at timestamptz NOT NULL,
                  attempts integer NOT NULL,
                  expires_at timestamptz NOT NULL,
                  PRIMARY KEY (scope, subject_hash, window_started_at),
                  CONSTRAINT ck_auth_rate_attempts CHECK (attempts > 0)
              );

              CREATE INDEX ix_auth_rate_limits_cleanup ON authentication_rate_limits (expires_at);
