databaseChangeLog:
  - changeSet:
      id: 003-remove-email-verification
      author: tovarika
      comment: Remove email verification flow and activate legacy pending users.
      changes:
        - sql:
            splitStatements: false
            sql: |
              UPDATE users
              SET status = 'ACTIVE',
                  email_verified = true,
                  updated_at = now()
              WHERE status = 'PENDING_EMAIL_VERIFICATION';

              ALTER TABLE users ALTER COLUMN email_verified SET DEFAULT true;

              ALTER TABLE users DROP CONSTRAINT ck_users_status;
              ALTER TABLE users ADD CONSTRAINT ck_users_status CHECK (status IN ('ACTIVE', 'BLOCKED', 'DELETED'));

              DROP TABLE IF EXISTS email_verification_tokens CASCADE;
