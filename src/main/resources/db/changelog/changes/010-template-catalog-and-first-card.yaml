                  ('tpl_home_hero', 'Home clean', 'cat_home', 10,
                   '{"schemaVersion":1,"scene":"warm neutral interior studio","composition":"product centered and fully visible","lighting":"soft window-like light","style":"clean home-goods catalog","palette":["#F1E9DE","#C9B9A5"],"avoid":["clutter","extra products","text","brand changes"]}'),
                  ('tpl_home_accent', 'Home shapes', 'cat_home', 20,
                   '{"schemaVersion":1,"scene":"minimal interior with simple architectural shapes","composition":"product dominant with balanced negative space","lighting":"warm diffused studio light","style":"modern home marketplace card","palette":["#ECE3D7","#B98E6B"],"avoid":["clutter","extra products","text","brand changes"]}'),
                  ('tpl_home_lifestyle', 'Cozy interior', 'cat_home', 30,
                   '{"schemaVersion":1,"scene":"cozy realistic home environment","composition":"product naturally placed but remains the main subject","lighting":"warm natural daylight","style":"calm interior lifestyle","palette":["#E8DDCF","#8FA18A"],"avoid":["people","visual clutter","text","brand changes"]}'),

                  ('tpl_food_hero', 'Food clean', 'cat_food', 10,
                   '{"schemaVersion":1,"scene":"clean food studio backdrop","composition":"package or product centered and clearly visible","lighting":"fresh bright commercial light","style":"clean grocery marketplace card","palette":["#FFF5E8","#F0C77B"],"avoid":["extra food","invented ingredients","text","brand changes"]}'),
                  ('tpl_food_accent', 'Food color', 'cat_food', 20,
                   '{"schemaVersion":1,"scene":"bright studio with one appetizing color accent","composition":"product large in center with open space","lighting":"vivid but natural commercial light","style":"modern food advertising","palette":["#FFF2D8","#F29B62"],"avoid":["extra products","invented ingredients","text","brand changes"]}'),
