                  ('tpl_kids_hero', 'Kids clean', 'cat_kids', 10,
                   '{"schemaVersion":1,"scene":"bright safe studio with soft rounded shapes","composition":"single product centered and fully visible","lighting":"soft cheerful studio light","style":"clean children goods card","palette":["#F7F1E8","#9FCDE5"],"avoid":["children","extra toys","text","age claims"]}'),
