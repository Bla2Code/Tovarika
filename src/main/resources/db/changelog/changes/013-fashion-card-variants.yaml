databaseChangeLog:
  - changeSet:
      id: 013-fashion-card-variants
      author: codex
      runInTransaction: true
      changes:
        - sql:
            splitStatements: false
            sql: |
              SET LOCAL standard_conforming_strings = on;
              INSERT INTO template_card_variants(id,template_id,position,title,default_idea,generation_recipe) VALUES
              ('tpl_fashion_hero_v01', 'tpl_fashion_hero', 1, 'Обложка', 'Представить товар целиком: крупный заголовок сверху, товар слева, короткие подписи в плашках справа. Сохранить бежевый фон и оформление выбранного стиля. Использовать только подтверждённые сведения о товаре.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Сохранить композицию reference: крупный заголовок сверху, исходный товар целиком слева, вертикальные информационные блоки справа. Оставить поля минимум 5%.","conditions":["Показать только исходный товар и действительно присутствующие на исходном фото предметы","Опустить информационный блок, если для него нет подтверждённых сведений"],"fallbackComposition":"Товар целиком слева и нейтральный заголовок сверху; неподтверждённые информационные блоки опустить."}'::jsonb),
              ('tpl_fashion_hero_v02', 'tpl_fashion_hero', 2, 'Особенности', 'Показать подтверждённые особенности товара: разместить товар целиком справа, а короткие подписи в отдельных кремовых плашках слева. Сохранить бежевый фон, свет и типографику выбранного стиля.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком занимает правую часть; слева находятся до трёх вертикальных кремовых информационных блоков; компактный заголовок расположен над ними. Не переносить расположение блоков первой обложки.","conditions":["Количество блоков ограничивается количеством подтверждённых сведений","Нельзя превращать видимый признак в неподтверждённое рекламное преимущество"],"fallbackComposition":"Товар целиком справа, один краткий блок с подтверждённым описанием слева; остальные блоки опустить."}'::jsonb),
              ('tpl_fashion_hero_v03', 'tpl_fashion_hero', 3, 'Один главный акцент', 'Выделить одну подтверждённую особенность товара крупной надписью в кремовой плашке сверху справа. Товар показать целиком снизу слева, сохранив общий стиль серии. Если отдельной особенности нет, использовать краткое нейтральное описание товара.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Один крупный смысловой блок в верхней правой части и товар целиком в нижней левой части. Не заполнять карточку множеством характеристик. Уменьшить товар или перенести текст, если это нужно для безопасных полей.","conditions":["Выбранный акцент должен подтверждаться description или исходным изображением","Не использовать превосходные степени и обещания качества без подтверждения"],"fallbackComposition":"Нейтральное название товара в верхней правой плашке и товар целиком снизу слева; рекламные утверждения опустить."}'::jsonb),
              ('tpl_fashion_hero_v04', 'tpl_fashion_hero', 4, 'Видимая фактура', 'Показать крупно фактуру материала, если она различима на исходном фото, и добавить краткую подпись в нижней кремовой плашке. Сохранить реальные цвет и рисунок поверхности. Если фактура не различима, показать товар целиком по центру без выдуманных деталей.', '{"schemaVersion":1,"framingMode":"detail","composition":"Одна различимая область исходного товара занимает центральную часть; короткий заголовок сверху и широкая кремовая подпись снизу. Сохранять поля вокруг выбранной области и текста.","conditions":["Крупный план допустим только для фактуры, действительно различимой на исходном фото","Не придумывать волокна, переплетение, состав или свойства материала","Не называть материал натуральным, прочным, мягким или качественным без подтверждения"],"fallbackComposition":"Показать исходный товар целиком по центру и короткую нейтральную подпись в нижней кремовой плашке; не создавать крупный план неразличимой фактуры."}'::jsonb),
              ('tpl_fashion_hero_v05', 'tpl_fashion_hero', 5, 'Конструктивная деталь', 'Выделить один видимый элемент товара — шов, застёжку или карман — крупным планом слева, с короткой подписью справа. Использовать только различимые детали исходного фото. Если подходящей детали нет, показать товар целиком слева и его подтверждённое описание справа.', '{"schemaVersion":1,"framingMode":"detail","composition":"Различимая конструктивная деталь слева, один кремовый информационный блок справа. В фокусе ровно один реально видимый элемент, без дополнительных изображений товара.","conditions":["Шов, застёжка или карман должны существовать и быть различимыми на исходном фото","Не добавлять пуговицы, карманы, молнии и скрытые части изделия","Не делать вывод о долговечности, надёжности или качестве исполнения по одному виду детали"],"fallbackComposition":"Товар целиком слева, его краткое подтверждённое описание в одной кремовой плашке справа; крупный план опустить."}'::jsonb),
              ('tpl_fashion_hero_v06', 'tpl_fashion_hero', 6, 'Надпись или принт', 'Показать крупно различимый принт, надпись или маркировку исходного товара, сохранив их вид и расположение. Короткий заголовок разместить в кремовой плашке сверху. Если такой детали нет или её нельзя прочитать, показать товар целиком с нейтральным заголовком.', '{"schemaVersion":1,"framingMode":"detail","composition":"Различимая область с принтом или маркировкой в центре; кремовая плашка с коротким заголовком сверху. Не копировать демонстрационный логотип reference и не создавать дополнительные ракурсы.","conditions":["Использовать только реально присутствующий и различимый принт, надпись или маркировку","Не восстанавливать неразборчивые буквы и не придумывать название бренда","Не изменять видимые надписи и логотип на самом товаре"],"fallbackComposition":"Исходный товар целиком в центральной части, нейтральный заголовок в верхней кремовой плашке; неизвестный бренд и неразличимую маркировку не упоминать."}'::jsonb),
              ('tpl_fashion_hero_v07', 'tpl_fashion_hero', 7, 'Состав изображённого товара', 'Показать целиком товар и все действительно присутствующие на исходном фото предметы, с короткими подписями в нижних кремовых плашках. Если на фото одна вещь, сохранить одну вещь и описать её видимые элементы. Не добавлять части комплекта или новые ракурсы.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Сохранить все видимые исходные предметы в центральной и верхней области карточки; расположить короткие подписи в горизонтальном ряду снизу. Каждый предмет полностью видим, исходная идентичность и форма сохранены.","conditions":["Не объявлять предметы комплектом, если комплектность не подтверждена description","Не размножать товар и не добавлять вид сзади только потому, что он есть в reference","Число изображённых предметов не увеличивается относительно исходного фото"],"fallbackComposition":"Одна исходная вещь целиком в верхней центральной части и одна нижняя плашка с подтверждённым описанием; дополнительные части комплекта опустить."}'::jsonb),
              ('tpl_fashion_hero_v08', 'tpl_fashion_hero', 8, 'Цвет и отделка', 'Показать товар целиком на центральной кремовой панели и подчеркнуть его реальные цвет и видимую отделку короткими подписями по краям. Сохранить бежевый фон. Не перекрашивать товар и не изображать доступные цветовые варианты, которых нет в исходных данных.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Кремовая округлая панель по центру, на ней товар целиком; краткие подписи располагаются по бокам панели, заголовок снизу. Акцентные цвета используются только в декоре.","conditions":["Цвет и отделка относятся к исходному товару, а не к демонстрационному reference","Не создавать палитру доступных расцветок и не перекрашивать товар","Не делать вывод о технологии отделки, если она не подтверждена description"],"fallbackComposition":"Товар целиком на центральной кремовой панели с нейтральной подписью снизу; неподтверждённые сведения об отделке опустить."}'::jsonb),
              ('tpl_fashion_hero_v09', 'tpl_fashion_hero', 9, 'Подтверждённые характеристики', 'Разместить товар целиком в верхней части, а подтверждённые характеристики — в компактных кремовых блоках снизу. Размеры и состав указывать только при наличии в описании товара. Если характеристик недостаточно, оставить краткое описание без выдуманных чисел и свойств.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком занимает верхнюю область; нижняя часть содержит короткий заголовок и компактную сетку кремовых информационных блоков. Количество блоков зависит от числа подтверждённых сведений.","conditions":["Численные размеры, состав и характеристики берутся только из description","Не создавать размерную сетку и не выводить реальные размеры из пропорций фото","Не заполнять пустые блоки придуманными преимуществами"],"fallbackComposition":"Товар целиком сверху, один широкий блок с кратким подтверждённым описанием снизу; пустые ячейки и неподтверждённые характеристики опустить."}'::jsonb),
              ('tpl_fashion_hero_v10', 'tpl_fashion_hero', 10, 'Итоговая карточка', 'Завершить серию спокойной карточкой: товар целиком по центру, крупный заголовок сверху и краткое подтверждённое описание в широкой кремовой плашке снизу. Сохранить общий стиль. Можно повторить основные факты, не добавляя новые рекламные обещания.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком строго в центральной области, крупный заголовок сверху, одна широкая кремовая плашка снизу. Сохранить воздух между тремя зонами и поля минимум 5%.","conditions":["Итоговый текст использует только подтверждённое описание товара","Не добавлять скидки, рейтинги, призывы с обещаниями или новые свойства","Повтор основных фактов допустим, расположение блоков отличается от обложки"],"fallbackComposition":"Товар целиком по центру и нейтральный заголовок сверху; нижнюю плашку опустить, если для неё нет подтверждённого текста."}'::jsonb)
              ON CONFLICT (id) DO UPDATE SET title=EXCLUDED.title, default_idea=EXCLUDED.default_idea,
              generation_recipe=EXCLUDED.generation_recipe
              WHERE template_card_variants.template_id='tpl_fashion_hero'
              AND template_card_variants.position=EXCLUDED.position;
