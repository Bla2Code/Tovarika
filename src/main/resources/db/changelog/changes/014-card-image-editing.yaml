databaseChangeLog:
  - changeSet:
      id: 014-card-image-editing
      author: codex
      changes:
        - sql:
            splitStatements: false
            sql: |
              ALTER TABLE assets ADD COLUMN has_alpha boolean;
              CREATE TABLE card_image_versions (
                  id varchar(40) PRIMARY KEY,
                  card_id varchar(40) NOT NULL REFERENCES cards(id) ON DELETE CASCADE,
                  previous_version_id varchar(40),
                  image_asset_id varchar(40) NOT NULL REFERENCES assets(id),
                  aspect_ratio varchar(8) NOT NULL CHECK (aspect_ratio IN ('1:1','3:4','4:5','16:9')),
                  created_at timestamptz NOT NULL,
                  UNIQUE(card_id,id),
                  FOREIGN KEY(card_id,previous_version_id) REFERENCES card_image_versions(card_id,id)
                      DEFERRABLE INITIALLY DEFERRED
              );
              ALTER TABLE cards ADD COLUMN current_version_id varchar(40),
                  ADD COLUMN image_revision bigint NOT NULL DEFAULT 0 CHECK(image_revision >= 0),
                  ADD COLUMN last_image_job_id varchar(40) REFERENCES project_jobs(id) ON DELETE SET NULL,
                  ADD CONSTRAINT fk_card_current_version FOREIGN KEY(id,current_version_id)
                      REFERENCES card_image_versions(card_id,id) DEFERRABLE INITIALLY DEFERRED;
              INSERT INTO card_image_versions(id,card_id,image_asset_id,aspect_ratio,created_at)
                  SELECT 'ver_' || md5(id),id,image_asset_id,aspect_ratio,updated_at
                  FROM cards WHERE image_asset_id IS NOT NULL;
              UPDATE cards SET current_version_id='ver_' || md5(id),image_revision=1
                  WHERE image_asset_id IS NOT NULL;
              ALTER TABLE project_jobs DROP CONSTRAINT project_jobs_type_check;
              ALTER TABLE project_jobs ADD CONSTRAINT project_jobs_type_check CHECK(type IN (
                  'card_generation','card_regeneration','card_region_edit','card_image_edit','export'));
              ALTER TABLE project_jobs ADD COLUMN command_digest varchar(64),
                  ADD COLUMN image_edit_payload jsonb,
                  ADD COLUMN base_version_id varchar(40),
                  ADD COLUMN expected_image_revision bigint,
                  ADD COLUMN result_version_id varchar(40),
                  ADD COLUMN result_asset_id varchar(40) REFERENCES assets(id),
                  ADD COLUMN result_image_revision bigint;
              CREATE UNIQUE INDEX ux_project_image_operation ON project_jobs(project_id)
                  WHERE type IN ('card_generation','card_regeneration','card_region_edit','card_image_edit')
                      AND status IN ('queued','processing');
              CREATE TABLE card_image_undo_receipts (
                  owner_scope varchar(40) NOT NULL,
                  idempotency_key varchar(128) NOT NULL,
                  project_id varchar(40) NOT NULL REFERENCES projects(id) ON DELETE CASCADE,
                  card_id varchar(40) NOT NULL REFERENCES cards(id) ON DELETE CASCADE,
                  command_digest varchar(64) NOT NULL,
                  created_at timestamptz NOT NULL,
                  PRIMARY KEY(owner_scope,idempotency_key)
              );
