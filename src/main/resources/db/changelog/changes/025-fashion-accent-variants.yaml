databaseChangeLog:
  - changeSet:
      id: 025-fashion-accent-variants
      author: codex
      runInTransaction: true
      changes:
        - sql:
            splitStatements: false
            sql: |
              SET LOCAL standard_conforming_strings = on;
              INSERT INTO template_card_variants(id,template_id,position,title,default_idea,generation_recipe) VALUES
              ('tpl_fashion_accent_v01', 'tpl_fashion_accent', 1, 'Обложка', 'Показать исходный товар крупно справа на фоне тёмной округлой панели. Слева разместить крупное название и до двух коротких подтверждённых особенностей. Размерные плашки использовать только при наличии точных данных.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Крупный заголовок в верхней левой части, исходный товар целиком справа поверх тёмной округлой панели, до двух информационных блоков слева и небольшие подтверждённые плашки сверху справа.","conditions":["Товар, а не демонстрационная модель, остаётся главным объектом","Неподтверждённые особенности и размеры не выводить"],"fallbackComposition":"Исходный товар целиком справа, нейтральное название слева; пустые информационные и размерные блоки опустить."}'::jsonb),
              ('tpl_fashion_accent_v02', 'tpl_fashion_accent', 2, 'Особенности', 'Показать товар целиком слева, а справа на светлом фоне разместить короткий список подтверждённых особенностей с тонкими стрелками. Сохранить тёмную панель и розовые акценты оформления.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Исходный товар целиком слева на тёмной округлой панели; справа светлое поле с заголовком и вертикальным списком до трёх коротких фактических блоков с тонкими стрелками.","conditions":["Число блоков не превышает число подтверждённых сведений","Не превращать видимый признак в неподтверждённое обещание качества"],"fallbackComposition":"Товар слева и одна нейтральная подтверждённая подпись справа; остальные блоки опустить."}'::jsonb),
              ('tpl_fashion_accent_v03', 'tpl_fashion_accent', 3, 'Главный акцент', 'Выделить одну подтверждённую особенность крупным заголовком над товаром. Товар показать целиком по центру, а небольшую белую плашку поставить снизу. Если особенность не подтверждена, использовать нейтральное название.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Один крупный заголовок в верхней светлой зоне; товар целиком по центру на тёмной вертикальной панели; одна компактная белая подпись снизу сбоку, без списка характеристик.","conditions":["Акцент должен подтверждаться описанием или исходным фото","Не добавлять превосходные степени и рекламные обещания без доказательств"],"fallbackComposition":"Нейтральное название сверху и исходный товар целиком по центру; дополнительную подпись опустить."}'::jsonb),
              ('tpl_fashion_accent_v04', 'tpl_fashion_accent', 4, 'Видимая фактура', 'Если на исходном фото различима фактура товара, показать её крупнее в правой части и добавить короткую фактическую подпись слева. Сохранить настоящий цвет. Если фактура неразличима, показать товар целиком.', '{"schemaVersion":1,"framingMode":"detail","composition":"Крупный план действительно видимого участка исходного товара справа на тёмной панели, короткий заголовок и одна светлая подпись слева; композиция отличается от обложки.","conditions":["Крупный план допустим только при различимой фактуре на исходном фото","Не придумывать волокна, состав, переплетение и свойства материала"],"fallbackComposition":"Товар целиком справа и нейтральная подпись слева; крупный план неразличимой фактуры не создавать."}'::jsonb),
              ('tpl_fashion_accent_v05', 'tpl_fashion_accent', 5, 'Деталь конструкции', 'Выделить одну действительно видимую деталь товара, например шов, застёжку или край изделия, с краткой подписью. Если подходящей детали нет, показать товар целиком без выдуманного крупного плана.', '{"schemaVersion":1,"framingMode":"detail","composition":"Одна видимая конструктивная деталь крупно слева; справа тёмная округлая панель с коротким заголовком и одной белой информационной плашкой.","conditions":["Показывать только элемент, действительно различимый на исходном фото","Не добавлять скрытые застёжки, карманы, швы или обратный ракурс"],"fallbackComposition":"Исходный товар целиком слева, одна фактическая подпись на тёмной панели справа; крупный план опустить."}'::jsonb),
              ('tpl_fashion_accent_v06', 'tpl_fashion_accent', 6, 'Силуэт и форма', 'Показать целиком форму товара на светлом фоне и подчеркнуть только видимые особенности силуэта короткими подписями. Не добавлять человека, другие ракурсы или сведения о посадке без подтверждения.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Исходный товар целиком в центре светлой области; узкая тёмная округлая панель сбоку, крупный заголовок снизу и до двух коротких выносок возле реально видимых элементов.","conditions":["Сохранять исходные очертания и пропорции товара","Не делать вывод о посадке на человеке, если источник её не показывает"],"fallbackComposition":"Товар целиком по центру и нейтральное название снизу; выноски и заявления о посадке опустить."}'::jsonb),
              ('tpl_fashion_accent_v07', 'tpl_fashion_accent', 7, 'Цвет и отделка', 'Подчеркнуть реальный цвет и видимую отделку товара. Показать его целиком справа и разместить слева одну или две короткие подписи; розовый цвет использовать только в декоре, не перекрашивая товар.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком справа на светлом фоне; слева тёмная вертикальная панель с крупным заголовком и компактными светлыми подписями о подтверждённых цвете и видимой отделке.","conditions":["Цвет в подписях относится к исходному товару, а не к reference","Не показывать неподтверждённые доступные расцветки и технологии отделки"],"fallbackComposition":"Товар целиком справа и одно нейтральное описание слева; варианты цветов и отделку без подтверждения опустить."}'::jsonb),
              ('tpl_fashion_accent_v08', 'tpl_fashion_accent', 8, 'Принт или маркировка', 'Если на исходном товаре различимы принт, надпись или маркировка, показать этот участок крупно и сохранить его без изменений. Если таких деталей нет, показать товар целиком с нейтральным заголовком.', '{"schemaVersion":1,"framingMode":"detail","composition":"Реально видимый принт или маркировка крупно в центре на тёмной панели; короткий заголовок сверху на светлом поле и одна узкая фактическая подпись сбоку.","conditions":["Показывать крупно только различимую область исходного фото","Не восстанавливать неразборчивые буквы и не придумывать бренд"],"fallbackComposition":"Исходный товар целиком на панели и нейтральный заголовок сверху; крупный план неизвестной маркировки опустить."}'::jsonb),
              ('tpl_fashion_accent_v09', 'tpl_fashion_accent', 9, 'Подтверждённые характеристики', 'Показать товар целиком сверху, а в нижней части разместить компактные плашки только с подтверждёнными характеристиками. Размеры, состав и происхождение указывать лишь при наличии этих данных в описании.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком в верхней центральной области на тёмной панели; снизу светлая полоса с крупным заголовком и компактной сеткой белых плашек, число которых зависит от фактов.","conditions":["Численные размеры, состав и происхождение брать только из описания товара","Не оставлять плашки с выдуманными значениями для заполнения сетки"],"fallbackComposition":"Товар целиком сверху и одна широкая нейтральная подпись снизу; пустые плашки убрать."}'::jsonb),
              ('tpl_fashion_accent_v10', 'tpl_fashion_accent', 10, 'Итоговая карточка', 'Завершить серию спокойной карточкой: товар целиком по центру, крупное название сбоку и одна короткая подтверждённая подпись. Сохранить светлый фон, тёмную панель и сдержанные розовые акценты.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Исходный товар целиком по центру на светлом поле; высокая тёмная панель позади со смещением вправо, крупный заголовок слева и одна широкая белая подпись снизу.","conditions":["Итоговый текст содержит только подтверждённые сведения","Не добавлять скидки, рейтинги, обещания или новые свойства"],"fallbackComposition":"Товар целиком по центру и нейтральный заголовок слева; неподтверждённую нижнюю подпись опустить."}'::jsonb)
              ON CONFLICT (id) DO UPDATE SET title=EXCLUDED.title, default_idea=EXCLUDED.default_idea,
              generation_recipe=EXCLUDED.generation_recipe
              WHERE template_card_variants.template_id='tpl_fashion_accent'
              AND template_card_variants.position=EXCLUDED.position;
