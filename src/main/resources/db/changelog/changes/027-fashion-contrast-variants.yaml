databaseChangeLog:
  - changeSet:
      id: 027-fashion-contrast-variants
      author: codex
      runInTransaction: true
      changes:
        - sql:
            splitStatements: false
            sql: |
              SET LOCAL standard_conforming_strings = on;
              INSERT INTO template_card_variants(id,template_id,position,title,default_idea,generation_recipe) VALUES
              ('tpl_fashion_contrast_v01', 'tpl_fashion_contrast', 1, 'Обложка', 'Показать исходный товар крупно на границе белого и терракотового полей. Разместить название сверху слева, до трёх подтверждённых особенностей справа и размерный ряд снизу только при наличии точных данных.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Исходный товар целиком и крупно пересекает границу белого левого и терракотового правого полей; название сверху слева, вертикальные выноски справа, дополнительный факт снизу слева.","conditions":["Не переносить демонстрационную пару обуви или ноги, если их нет на исходном фото","Выноски и числовой блок показывать только при наличии подтверждённых сведений"],"fallbackComposition":"Товар целиком по центру на границе двух полей и нейтральное название сверху слева; пустые выноски и числовой блок убрать."}'::jsonb),
              ('tpl_fashion_contrast_v02', 'tpl_fashion_contrast', 2, 'Особенности', 'Расположить товар целиком на белой стороне, а на терракотовой стороне показать короткий список действительно подтверждённых особенностей с тонкими линиями и круглыми маркерами.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком слева на белом поле; справа терракотовая колонка с крупным заголовком и до трёх коротких выносок, отделённых тонкими светлыми линиями.","conditions":["Число выносок ограничено числом подтверждённых фактов","Не представлять видимые признаки как недоказанные преимущества"],"fallbackComposition":"Товар целиком слева и одна нейтральная подпись справа; остальные маркеры и линии опустить."}'::jsonb),
              ('tpl_fashion_contrast_v03', 'tpl_fashion_contrast', 3, 'Главный акцент', 'Выделить одну подтверждённую особенность крупной фразой на контрастном фоне, показав товар целиком ниже. Если подходящего факта нет, использовать нейтральное название товара.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком в нижней центральной части поверх границы двух полей; один очень крупный заголовок сверху и небольшой круглый декоративный маркер сбоку.","conditions":["Крупная фраза должна подтверждаться описанием или исходным фото","Не добавлять превосходные степени и обещания качества без основания"],"fallbackComposition":"Нейтральное название сверху, товар целиком снизу; дополнительную фактическую плашку убрать."}'::jsonb),
              ('tpl_fashion_contrast_v04', 'tpl_fashion_contrast', 4, 'Видимая фактура', 'При различимой на исходном фото фактуре показать её крупнее и подписать только видимое свойство. Если участок неразличим, показать весь товар без придуманного крупного плана.', '{"schemaVersion":1,"framingMode":"detail","composition":"Реально видимый участок фактуры крупно справа на терракотовом поле; слева на белом фоне короткий заголовок и одна тонкая направляющая линия.","conditions":["Крупный план допустим только для различимой области исходного фото","Не выводить состав, качество или свойства материала из одной лишь фактуры"],"fallbackComposition":"Исходный товар целиком справа, нейтральная подпись слева; крупный план фактуры опустить."}'::jsonb),
              ('tpl_fashion_contrast_v05', 'tpl_fashion_contrast', 5, 'Деталь конструкции', 'Выделить действительно различимую деталь товара, например шов, застёжку или край. Добавить короткую фактическую подпись; при отсутствии видимой детали показать товар целиком.', '{"schemaVersion":1,"framingMode":"detail","composition":"Одна видимая конструктивная деталь крупно слева на белом поле; справа терракотовая панель с заголовком и одной тонкой линией к подписи.","conditions":["Не создавать неизвестные швы, застёжки, подошвы и скрытые части","Сохранять реальную геометрию и цвет детали"],"fallbackComposition":"Товар целиком слева и одна нейтральная подпись справа; неизвестную деталь не изображать."}'::jsonb),
              ('tpl_fashion_contrast_v06', 'tpl_fashion_contrast', 6, 'Силуэт', 'Показать форму исходного товара целиком на двухцветном фоне и подписать только заметные особенности силуэта. Не добавлять примерку на человеке, если её нет на исходном фото.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком по центру на вертикальной границе полей; крупный заголовок в нижней терракотовой зоне, до двух коротких выносок на свободном белом участке.","conditions":["Сохранять исходные пропорции и видимый ракурс товара","Не делать выводов о посадке или удобстве по одному фото"],"fallbackComposition":"Товар целиком по центру и нейтральное название снизу; неподтверждённые выноски убрать."}'::jsonb),
              ('tpl_fashion_contrast_v07', 'tpl_fashion_contrast', 7, 'Цвет и отделка', 'Подчеркнуть реальный цвет и видимую отделку товара, сохранив его целиком. Терракотовый цвет оставить только в фоне и графике, не перекрашивая товар.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком справа на светлой части двухцветного поля; слева крупный заголовок и один или два небольших текстовых блока о подтверждённых цвете и видимой отделке.","conditions":["Не принимать цвета reference за доступные цвета товара","Не заявлять технологию отделки, если она не указана в описании"],"fallbackComposition":"Товар целиком справа и нейтральная подпись слева; блок о неподтверждённой отделке убрать."}'::jsonb),
              ('tpl_fashion_contrast_v08', 'tpl_fashion_contrast', 8, 'Маркировка или декор', 'Если на исходном товаре хорошо видны маркировка, принт или декор, показать этот участок крупнее без изменения надписей. Иначе показать товар целиком с простым заголовком.', '{"schemaVersion":1,"framingMode":"detail","composition":"Различимый участок маркировки или декора крупно на белом поле; справа узкая терракотовая колонка с коротким заголовком и круглым маркером.","conditions":["Не восстанавливать неразборчивые буквы и не придумывать бренд","Крупно показывать только различимый участок исходного фото"],"fallbackComposition":"Исходный товар целиком на двухцветном фоне и нейтральный заголовок справа; выдуманный крупный план убрать."}'::jsonb),
              ('tpl_fashion_contrast_v09', 'tpl_fashion_contrast', 9, 'Подтверждённые данные', 'Разместить товар целиком сверху, а снизу вынести только известные характеристики. Размерный ряд, состав и свойства указывать лишь тогда, когда они прямо подтверждены описанием товара.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком в верхней зоне на границе белого и терракотового полей; внизу крупное название и до трёх компактных фактических блоков с тонкими разделителями.","conditions":["Числовые значения и свойства брать только из подтверждённого описания","Не оставлять заполнители или выдуманные значения ради симметрии"],"fallbackComposition":"Товар целиком сверху и одна нейтральная подпись снизу; лишние фактические блоки опустить."}'::jsonb),
              ('tpl_fashion_contrast_v10', 'tpl_fashion_contrast', 10, 'Итоговая карточка', 'Завершить серию крупным изображением товара целиком, названием на контрастном поле и одной короткой подтверждённой подписью. Сохранить двухцветный фон и крупную типографику.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком по центру; широкое белое поле слева, терракотовая зона справа с мягким кругом, крупный заголовок на свободном участке и одна короткая подпись снизу.","conditions":["Итоговый текст содержит только подтверждённые сведения","Не добавлять скидки, цены, рейтинги или обещания без исходных данных"],"fallbackComposition":"Товар целиком по центру и нейтральное название на свободном поле; неподтверждённую подпись опустить."}'::jsonb)
              ON CONFLICT (id) DO UPDATE SET title=EXCLUDED.title, default_idea=EXCLUDED.default_idea,
              generation_recipe=EXCLUDED.generation_recipe
              WHERE template_card_variants.template_id='tpl_fashion_contrast'
              AND template_card_variants.position=EXCLUDED.position;
