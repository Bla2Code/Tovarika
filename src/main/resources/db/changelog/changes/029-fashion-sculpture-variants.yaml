databaseChangeLog:
  - changeSet:
      id: 029-fashion-sculpture-variants
      author: codex
      runInTransaction: true
      changes:
        - sql:
            splitStatements: false
            sql: |
              SET LOCAL standard_conforming_strings = on;
              INSERT INTO template_card_variants(id,template_id,position,title,default_idea,generation_recipe) VALUES
              ('tpl_fashion_sculpture_v01', 'tpl_fashion_sculpture', 1, 'Обложка', 'Показать исходный товар целиком и крупно над белым скульптурным подиумом. Слева разместить название и до трёх подтверждённых коротких сведений, справа — дополнительную подпись; круглый размерный медальон использовать только при точных данных.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Исходный товар целиком крупно в центре справа над белым фактурным подиумом; большой светлый заголовок сверху слева, короткие строки ниже, необязательный круглый фактический медальон справа внизу.","conditions":["Не добавлять руку, если её нет на исходном фото","Размерный медальон и свойства показывать только при подтверждённых данных"],"fallbackComposition":"Товар целиком над подиумом и нейтральное название слева; пустые строки и медальон убрать."}'::jsonb),
              ('tpl_fashion_sculpture_v02', 'tpl_fashion_sculpture', 2, 'Особенности', 'Разместить товар целиком справа, а слева на сером фоне перечислить до трёх подтверждённых особенностей короткими строками. Сохранить белые скульптурные формы и мягкий свет.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком справа на низком белом подиуме; слева крупный светлый заголовок и вертикальный список до трёх кратких фактических строк с тонкими разделителями.","conditions":["Число строк соответствует числу подтверждённых фактов","Не превращать видимый признак в неподтверждённое обещание"],"fallbackComposition":"Товар справа и одна нейтральная подпись слева; лишние строки убрать."}'::jsonb),
              ('tpl_fashion_sculpture_v03', 'tpl_fashion_sculpture', 3, 'Главный акцент', 'Выделить одну подтверждённую особенность крупным светлым заголовком над товаром. Если отдельного факта нет, использовать название товара без рекламного утверждения.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Один крупный светлый заголовок занимает верхнюю серую часть; товар целиком по центру на белом скульптурном основании, сбоку одна небольшая полупрозрачная плашка.","conditions":["Главный акцент подтверждён описанием или исходным фото","Не добавлять превосходные степени и обещания комфорта без основания"],"fallbackComposition":"Нейтральное название сверху и товар целиком на подиуме; плашку без сведений опустить."}'::jsonb),
              ('tpl_fashion_sculpture_v04', 'tpl_fashion_sculpture', 4, 'Видимая фактура', 'Если фактура исходного товара различима, показать этот участок крупнее на фоне гладкого серого поля и добавить точную короткую подпись. Иначе показать товар целиком.', '{"schemaVersion":1,"framingMode":"detail","composition":"Реально видимая фактура товара крупно справа на сером поле; слева белая скульптурная форма, короткий светлый заголовок и одна подпись.","conditions":["Крупный план допустим только для различимой области исходного фото","Не выводить состав и свойства материала из одной лишь фактуры"],"fallbackComposition":"Товар целиком справа над подиумом и нейтральная подпись слева; крупный план не создавать."}'::jsonb),
              ('tpl_fashion_sculpture_v05', 'tpl_fashion_sculpture', 5, 'Деталь формы', 'Выделить одну действительно видимую конструктивную деталь товара и подписать её без домыслов. Если деталь на исходном фото неразличима, оставить общий вид товара.', '{"schemaVersion":1,"framingMode":"detail","composition":"Одна видимая деталь товара крупно слева на светлом фактурном фоне; справа спокойное серое поле с заголовком и короткой белой подписью.","conditions":["Не добавлять скрытые швы, застёжки, каблук или другие отсутствующие элементы","Сохранять исходные форму, ракурс и цвет детали"],"fallbackComposition":"Товар целиком слева на подиуме и одна нейтральная подпись справа; выдуманный крупный план убрать."}'::jsonb),
              ('tpl_fashion_sculpture_v06', 'tpl_fashion_sculpture', 6, 'Силуэт', 'Показать товар целиком на простом белом подиуме, оставив вокруг достаточно свободного пространства. Подчеркнуть только видимые особенности силуэта, без предположений о посадке.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком по центру над геометричным белым подиумом; серый фон с крупным светлым названием сверху и одной короткой фактической строкой снизу.","conditions":["Сохранять реальные пропорции и видимый ракурс","Не добавлять примерку на человеке, если источник её не показывает"],"fallbackComposition":"Товар целиком по центру и нейтральное название сверху; дополнительную строку опустить."}'::jsonb),
              ('tpl_fashion_sculpture_v07', 'tpl_fashion_sculpture', 7, 'Цвет и отделка', 'Сохранить реальный цвет товара как главный визуальный акцент среди серых и белых форм. Подписать цвет или видимую отделку только при подтверждении исходным фото или описанием.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком слева на белом подиуме; справа ровное серое поле с крупным светлым названием и одной или двумя короткими фактическими подписями.","conditions":["Серое окружение не должно перекрашивать исходный товар","Не показывать неизвестные цветовые варианты и технологии отделки"],"fallbackComposition":"Товар целиком слева и нейтральное название справа; неподтверждённые подписи убрать."}'::jsonb),
              ('tpl_fashion_sculpture_v08', 'tpl_fashion_sculpture', 8, 'Принт или маркировка', 'Если на исходном товаре различимы принт, надпись или маркировка, показать их крупнее и сохранить без изменения. При отсутствии такой детали показать товар целиком.', '{"schemaVersion":1,"framingMode":"detail","composition":"Реально видимый принт или маркировка крупно в центре на сером поле; небольшая белая скульптурная форма внизу, светлый заголовок сверху.","conditions":["Не восстанавливать неразборчивые буквы и не придумывать бренд","Крупный план брать только из различимой области исходного фото"],"fallbackComposition":"Исходный товар целиком на белом подиуме и нейтральный заголовок сверху; крупный план убрать."}'::jsonb),
              ('tpl_fashion_sculpture_v09', 'tpl_fashion_sculpture', 9, 'Подтверждённые данные', 'Показать товар целиком над подиумом, а рядом разместить только известные характеристики. Числа, состав и размеры использовать лишь при прямом подтверждении.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком справа над фактурным белым подиумом; слева светлый заголовок, до трёх коротких фактических строк и необязательный круглый медальон для подтверждённого числового значения.","conditions":["Числа, размерный ряд и состав брать только из описания товара","Не оставлять пустые плашки или выдуманные значения"],"fallbackComposition":"Товар целиком справа и одна нейтральная подпись слева; числовой медальон и лишние строки убрать."}'::jsonb),
              ('tpl_fashion_sculpture_v10', 'tpl_fashion_sculpture', 10, 'Итоговая карточка', 'Завершить серию спокойной карточкой: товар целиком на белом скульптурном основании, крупное название и одна короткая подтверждённая подпись на сером фоне.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком по центру на белом скульптурном основании; ровный серый фон, крупный светлый заголовок слева вверху и одна короткая подпись в полупрозрачной плашке снизу.","conditions":["Итоговая подпись содержит только подтверждённые сведения","Не добавлять цены, рейтинги, коллекции и рекламные обещания без исходных данных"],"fallbackComposition":"Товар целиком по центру и нейтральное название сверху; неподтверждённую нижнюю плашку убрать."}'::jsonb)
              ON CONFLICT (id) DO UPDATE SET title=EXCLUDED.title, default_idea=EXCLUDED.default_idea,
              generation_recipe=EXCLUDED.generation_recipe
              WHERE template_card_variants.template_id='tpl_fashion_sculpture'
              AND template_card_variants.position=EXCLUDED.position;
