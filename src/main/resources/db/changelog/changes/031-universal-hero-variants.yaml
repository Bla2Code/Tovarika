databaseChangeLog:
  - changeSet:
      id: 031-universal-hero-variants
      author: codex
      runInTransaction: true
      changes:
        - sql:
            splitStatements: false
            sql: |
              SET LOCAL standard_conforming_strings = on;
              INSERT INTO template_card_variants(id,template_id,position,title,default_idea,generation_recipe) VALUES
              ('tpl_universal_hero_v01', 'tpl_universal_hero', 1, 'Обложка', 'Показать товар целиком по центру круглого светлого подиума. Сохранить чистое пространство над ним, мягкий оливковый фон и тени листвы по краям.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Один исходный товар целиком на круглом каменном подиуме в нижней половине кадра; чистая оливковая стена сверху, растения только у краёв.","conditions":["Товар остаётся главным объектом и не перекрывается листвой","Не добавлять демонстрационный товар или второй предмет"],"fallbackComposition":"Товар целиком по центру подиума, чистая стена и мягкая тень без дополнительных подписей."}'::jsonb),
              ('tpl_universal_hero_v02', 'tpl_universal_hero', 2, 'Форма товара', 'Выделить узнаваемую форму товара целиком на подиуме. Если название подтверждено, добавить короткую подпись в свободной верхней части кадра.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком немного ниже центра; свободная верхняя зона для короткого подтверждённого названия, боковые листья и тени вдали от контура.","conditions":["Сохранять пропорции и контур исходного товара","Надпись не должна перекрывать товар и используется только при подтверждённом названии"],"fallbackComposition":"Товар целиком в центре подиума; верхнюю зону оставить пустой."}'::jsonb),
              ('tpl_universal_hero_v03', 'tpl_universal_hero', 3, 'Главная особенность', 'Показать товар целиком и, если есть подтверждённая особенность, дать ей одну сдержанную подпись на свободном фоне. Без рекламных обещаний.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком справа на подиуме; слева на спокойной стене одна короткая строка о подтверждённой особенности, без плашек и выносок.","conditions":["Особенность должна прямо следовать из описания или быть видимой на исходном фото","Не добавлять недоказанные преимущества"],"fallbackComposition":"Товар целиком по центру на подиуме; текстовый блок убрать."}'::jsonb),
              ('tpl_universal_hero_v04', 'tpl_universal_hero', 4, 'Видимая фактура', 'Если фактура различима на исходном фото, показать один её крупный фрагмент на фоне светлого подиума. Иначе сохранить общий вид товара целиком.', '{"schemaVersion":1,"framingMode":"detail","composition":"Различимый участок поверхности исходного товара крупно в центре над подиумом, растения и оливковая стена остаются мягким окружением.","conditions":["Крупный план допустим только для реально различимой фактуры","Не придумывать материал, рисунок поверхности или скрытые элементы"],"fallbackComposition":"Показать исходный товар целиком на подиуме с чистой стеной сверху; вымышленную фактуру не создавать."}'::jsonb),
              ('tpl_universal_hero_v05', 'tpl_universal_hero', 5, 'Видимая деталь', 'Сфокусироваться на одной различимой детали изделия, сохраняя её настоящий вид. Если подходящей детали нет, показать товар целиком.', '{"schemaVersion":1,"framingMode":"detail","composition":"Крупный план одной действительно видимой конструктивной детали товара перед чистым оливковым фоном; край подиума заметен внизу.","conditions":["Использовать только деталь, ясно видимую на исходном фото","Не добавлять невидимые швы, крепления, кнопки или ракурсы"],"fallbackComposition":"Исходный товар целиком на подиуме; неподтверждённый крупный план опустить."}'::jsonb),
              ('tpl_universal_hero_v06', 'tpl_universal_hero', 6, 'Маркировка и надписи', 'Если на товаре видны логотип или маркировка, аккуратно подчеркнуть их без изменения. Если они неразличимы, оставить общий вид.', '{"schemaVersion":1,"framingMode":"detail","composition":"Видимый участок товара с настоящей маркировкой крупно в центре; зелёный фон и тень листвы остаются на периферии.","conditions":["Показывать только читаемую маркировку с исходного товара","Не восстанавливать неразборчивые символы и не придумывать бренд"],"fallbackComposition":"Показать товар целиком на светлом подиуме без дополнительного текста."}'::jsonb),
              ('tpl_universal_hero_v07', 'tpl_universal_hero', 7, 'Реальный цвет', 'Показать настоящий цвет товара в мягком дневном свете. Зелёную палитру использовать только для фона и окружения.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком на светлом подиуме на фоне оливковой ниши; тени листвы смещены на стену, чтобы не менять восприятие цвета товара.","conditions":["Не перекрашивать товар под палитру reference","Не показывать цветовые варианты, которых нет в подтверждённых данных"],"fallbackComposition":"Товар целиком на подиуме, нейтральный мягкий свет без подписи о цвете."}'::jsonb),
              ('tpl_universal_hero_v08', 'tpl_universal_hero', 8, 'Подтверждённые сведения', 'Разместить рядом с товаром до двух кратких подтверждённых фактов. Если сведений мало, оставить только товар и чистый фон.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком слева на подиуме; справа в свободной части стены до двух коротких строк без декоративных плашек.","conditions":["Факты брать только из описания и исходного фото","Не придумывать размеры, состав, происхождение, цену или обещания"],"fallbackComposition":"Товар целиком по центру; неподтверждённые текстовые строки убрать."}'::jsonb),
              ('tpl_universal_hero_v09', 'tpl_universal_hero', 9, 'Спокойный ракурс', 'Сохранить ракурс исходного фото и показать товар целиком чуть сбоку на светлом подиуме. Не создавать отсутствующие стороны предмета.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком слегка смещён влево на круглом подиуме; справа остаётся свободная оливковая стена с мягкими тенями ветвей.","conditions":["Сохранять только ракурс, подтверждённый исходным фото","Не дорисовывать невидимую заднюю сторону или комплект"],"fallbackComposition":"Товар целиком по центру подиума в исходном ракурсе."}'::jsonb),
              ('tpl_universal_hero_v10', 'tpl_universal_hero', 10, 'Итоговая карточка', 'Завершить серию чистой карточкой: товар целиком по центру подиума, мягкая зелёная ниша, свободный верх. При необходимости добавить только подтверждённое название.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком по центру круглого подиума; свободная верхняя часть для короткого подтверждённого названия, растения и камни у краёв.","conditions":["Название брать из описания товара","Не добавлять цену, рейтинг или призыв к действию без исходных данных"],"fallbackComposition":"Товар целиком на подиуме без текста, с чистой стеной и натуральными тенями."}'::jsonb)
              ON CONFLICT (id) DO UPDATE SET title=EXCLUDED.title, default_idea=EXCLUDED.default_idea,
              generation_recipe=EXCLUDED.generation_recipe
              WHERE template_card_variants.template_id='tpl_universal_hero'
              AND template_card_variants.position=EXCLUDED.position;
