databaseChangeLog:
  - changeSet:
      id: 033-universal-accent-variants
      author: codex
      runInTransaction: true
      changes:
        - sql:
            splitStatements: false
            sql: |
              SET LOCAL standard_conforming_strings = on;
              INSERT INTO template_card_variants(id,template_id,position,title,default_idea,generation_recipe) VALUES
              ('tpl_universal_accent_v01', 'tpl_universal_accent', 1, 'Обложка', 'Поставить исходный товар целиком на передний круглый подиум. Сохранить фиолетовый градиент, много свободного пространства сверху и короткое подтверждённое название, если оно известно.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Исходный товар целиком по центру на переднем круглом каменном подиуме; другие подиумы позади; свободная верхняя область для короткого названия.","conditions":["Товар должен оставаться главным объектом и не сливаться с каменной фактурой","Название и любая подпись должны опираться на описание товара"],"fallbackComposition":"Товар целиком по центру на подиуме без текстовых блоков, если подтверждённого названия нет."}'::jsonb),
              ('tpl_universal_accent_v02', 'tpl_universal_accent', 2, 'Ключевая особенность', 'Разместить товар целиком справа на круглом подиуме, а слева оставить место для одной подтверждённой особенности. Если факта нет, показать только товар и название.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком справа на переднем подиуме; слева в свободном фиолетовом поле крупный короткий заголовок и одна компактная фактическая подпись.","conditions":["Особенность должна быть подтверждена описанием или исходным фото","Не делать рекламных обещаний и выводов о качестве без подтверждения"],"fallbackComposition":"Товар целиком справа, слева только нейтральное название; неподтверждённую подпись опустить."}'::jsonb),
              ('tpl_universal_accent_v03', 'tpl_universal_accent', 3, 'Форма', 'Показать товар целиком на высоком заднем подиуме и подчеркнуть его видимую форму без изменения пропорций. Короткую подпись о форме добавить только при наличии подтверждения.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Высокий круглый подиум по центру; товар целиком на его верхней плоскости; низкий передний подиум добавляет глубину, короткая подпись находится сверху сбоку.","conditions":["Сохранять реальные очертания и пропорции исходного товара","Не показывать новый ракурс или скрытые части товара"],"fallbackComposition":"Товар целиком на центральном подиуме; фактическую подпись заменить нейтральным названием или опустить."}'::jsonb),
              ('tpl_universal_accent_v04', 'tpl_universal_accent', 4, 'Видимая фактура', 'Если на исходном фото отчётливо видна фактура товара, выделить её крупно над низким каменным подиумом. Если фактура неразличима, показать товар целиком без вымышленной детали.', '{"schemaVersion":1,"framingMode":"detail","composition":"Крупный план действительно различимого участка товара слева над низким подиумом; справа оставить фиолетовое поле для короткой фактической подписи.","conditions":["Крупный план допустим только для действительно видимой области исходного фото","Не придумывать материал, структуру поверхности и свойства по освещению reference"],"fallbackComposition":"Товар целиком слева на низком подиуме, справа нейтральное название; вымышленный крупный план не создавать."}'::jsonb),
              ('tpl_universal_accent_v05', 'tpl_universal_accent', 5, 'Деталь товара', 'Выделить действительно видимую деталь товара, например форму края, элемент управления или маркировку. Если такой детали на исходном фото нет, показать весь товар на подиуме.', '{"schemaVersion":1,"framingMode":"detail","composition":"Одна реально видимая деталь товара крупно справа; слева низкий круглый подиум и компактный заголовок в свободном поле без перекрытия детали.","conditions":["Крупный план строить только из различимого участка исходного фото","Не дорисовывать скрытые кнопки, крепления, логотипы или маркировку"],"fallbackComposition":"Товар целиком справа на переднем подиуме; слева нейтральное название без заявления о детали."}'::jsonb),
              ('tpl_universal_accent_v06', 'tpl_universal_accent', 6, 'Реальный цвет', 'Показать товар целиком на светлом переднем подиуме так, чтобы его настоящий цвет оставался читаемым на фиолетовом фоне. Указать цвет словами только при подтверждении исходным фото или описанием.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком на светлом круглом переднем подиуме; затемнённый фиолетовый фон усиливает отделение силуэта, вверху одна компактная подпись о подтверждённом цвете.","conditions":["Сохранять исходный цвет товара, не окрашивать его сиреневым светом","Не показывать несуществующие варианты расцветки"],"fallbackComposition":"Товар целиком на светлом подиуме без цветовой подписи или с нейтральным названием."}'::jsonb),
              ('tpl_universal_accent_v07', 'tpl_universal_accent', 7, 'Маркировка', 'Если на исходном товаре есть читаемая маркировка или надпись, показать её без изменений. Если маркировки нет или она неразличима, оставить полный вид товара.', '{"schemaVersion":1,"framingMode":"detail","composition":"Читаемая маркировка товара крупно по центру над каменным подиумом; сверху короткий нейтральный заголовок, фиолетовый фон без других графических элементов.","conditions":["Показывать крупно только различимую область исходного фото","Не восстанавливать нечитаемые буквы и не придумывать бренд"],"fallbackComposition":"Товар целиком по центру на подиуме; маркировку крупным планом и связанную подпись опустить."}'::jsonb),
              ('tpl_universal_accent_v08', 'tpl_universal_accent', 8, 'Подтверждённые факты', 'Поставить товар целиком слева на каменный подиум, а справа разместить до трёх коротких подтверждённых характеристик. Пустые пункты не заполнять выдуманными фактами.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком слева на круглом подиуме; справа свободное фиолетовое поле с коротким заголовком и вертикальным списком до трёх фактических строк.","conditions":["Каждая строка должна подтверждаться описанием или исходным фото","Не придумывать численные размеры, материал, срок службы, цену или преимущества"],"fallbackComposition":"Товар целиком слева, справа одно нейтральное название; неподтверждённые строки опустить."}'::jsonb),
              ('tpl_universal_accent_v09', 'tpl_universal_accent', 9, 'Предметный ракурс', 'Оставить исходный товар целиком и показать его в глубокой студийной сцене с несколькими каменными уровнями. Сохранить только тот ракурс, который действительно виден на исходном фото.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком на смещённом вправо высоком круглом подиуме; низкий подиум на переднем плане, слева большое чистое поле для компактного названия.","conditions":["Не менять видимый исходный ракурс товара ради композиции","Подиумы остаются декоративной сценой, а не дополнительными товарами"],"fallbackComposition":"Товар целиком по центру на одном широком подиуме; лишние уровни и неподтверждённый текст убрать."}'::jsonb),
              ('tpl_universal_accent_v10', 'tpl_universal_accent', 10, 'Итоговая карточка', 'Завершить серию лаконичной карточкой: товар целиком по центру на переднем каменном подиуме, короткое название в верхнем свободном поле и одна подтверждённая подпись при наличии фактов.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком по центру на широком круглом подиуме; мягкий фиолетовый градиент и слабые каменные уровни на заднем плане; короткое название сверху, одна подпись снизу сбоку.","conditions":["Итоговый текст содержит только подтверждённые сведения","Не добавлять цены, скидки, рейтинги или рекламные обещания"],"fallbackComposition":"Товар целиком по центру на одном подиуме и нейтральное название сверху; дополнительную подпись опустить."}'::jsonb)
              ON CONFLICT (id) DO UPDATE SET title=EXCLUDED.title, default_idea=EXCLUDED.default_idea,
              generation_recipe=EXCLUDED.generation_recipe
              WHERE template_card_variants.template_id='tpl_universal_accent'
              AND template_card_variants.position=EXCLUDED.position;
