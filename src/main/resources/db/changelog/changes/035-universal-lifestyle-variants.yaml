databaseChangeLog:
  - changeSet:
      id: 035-universal-lifestyle-variants
      author: codex
      runInTransaction: true
      changes:
        - sql:
            splitStatements: false
            sql: |
              SET LOCAL standard_conforming_strings = on;
              INSERT INTO template_card_variants(id,template_id,position,title,default_idea,generation_recipe) VALUES
              ('tpl_universal_lifestyle_v01', 'tpl_universal_lifestyle', 1, 'Обложка', 'Показать исходный товар целиком на деревянном подиуме, сохранив мягко размытый зелёный дворик. Добавить короткое название в свободной верхней зоне, если оно известно.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком крупно по центру деревянного подиума; над ним свободная зона с коротким подтверждённым названием, зелёный дворик остаётся размытым фоном.","conditions":["Товар визуально доминирует над фоновыми предметами","Не добавлять свойства или обещания без подтверждения"],"fallbackComposition":"Товар целиком по центру подиума на фоне дворика; неподтверждённый текст опустить."}'::jsonb),
              ('tpl_universal_lifestyle_v02', 'tpl_universal_lifestyle', 2, 'В окружении', 'Показать товар на деревянном подиуме с чуть более широким видом дворика. Использовать окружение только как атмосферный фон, не утверждая неподтверждённый способ применения.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком на подиуме в нижней средней части; вокруг больше размытых зелёных и каменных элементов дворика, одна короткая подпись в свободном углу при наличии факта.","conditions":["Не ставить товар в контакт с водой, пищей или другими предметами без основания","Фон не должен заслонять товар"],"fallbackComposition":"Товар целиком на чистом подиуме и мягко размытый дворик без дополнительных утверждений."}'::jsonb),
              ('tpl_universal_lifestyle_v03', 'tpl_universal_lifestyle', 3, 'Главная особенность', 'Выделить одну подтверждённую особенность короткой подписью рядом с товаром. Если отдельного факта нет, оставить только видимый товар и нейтральное название.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком на подиуме со смещением вправо; слева в размытой верхней части короткий заголовок с одной подтверждённой особенностью.","conditions":["Особенность должна следовать из описания или быть очевидной на фото","Не добавлять превосходные степени и обещания качества"],"fallbackComposition":"Товар целиком на подиуме и нейтральное название слева; неподтверждённую особенность убрать."}'::jsonb),
              ('tpl_universal_lifestyle_v04', 'tpl_universal_lifestyle', 4, 'Видимая фактура', 'Если поверхность товара хорошо различима на исходном фото, показать её ближе на фоне тёплого дерева. Иначе показать товар целиком, не создавая выдуманный крупный план.', '{"schemaVersion":1,"framingMode":"detail","composition":"Крупный план действительно видимой поверхности товара в передней части подиума; дворик мягко размыт, сбоку одна краткая фактическая подпись.","conditions":["Фактура должна быть различима на исходном фото","Не выводить состав и свойства материала только по внешнему виду"],"fallbackComposition":"Товар целиком на подиуме, одна нейтральная подпись сбоку; крупный план опустить."}'::jsonb),
              ('tpl_universal_lifestyle_v05', 'tpl_universal_lifestyle', 5, 'Видимая деталь', 'Показать одну реально видимую деталь формы или отделки товара с короткой точной подписью. Если такой детали нет, вернуться к общему виду.', '{"schemaVersion":1,"framingMode":"detail","composition":"Различимая деталь товара крупно слева на переднем плане, справа тёплое дерево и размытый зелёный фон с одной короткой подписью.","conditions":["Не добавлять скрытые элементы, новый ракурс или неразличимые надписи","Сохранять реальные цвет и форму детали"],"fallbackComposition":"Товар целиком слева на подиуме, нейтральная подпись справа; выдуманный крупный план убрать."}'::jsonb),
              ('tpl_universal_lifestyle_v06', 'tpl_universal_lifestyle', 6, 'Форма и пропорции', 'Показать товар целиком на низком деревянном подиуме и подчеркнуть его реальный силуэт. Размеры подписывать лишь при точных данных пользователя.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком по центру подиума с заметным свободным контуром; короткое название в верхней части и необязательная строка с подтверждёнными размерами внизу.","conditions":["Не менять пропорции исходного товара","Не оценивать размер численно по одному фото"],"fallbackComposition":"Товар целиком на подиуме и нейтральное название; строку с размерами опустить."}'::jsonb),
              ('tpl_universal_lifestyle_v07', 'tpl_universal_lifestyle', 7, 'Цвет и отделка', 'Сохранить настоящий цвет товара на фоне тёплого дерева и зелени. Подписать цвет или отделку только при подтверждении исходным фото или описанием.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком на подиуме со смещением влево; справа на спокойном размытом фоне одна-две короткие подписи о подтверждённом цвете или видимой отделке.","conditions":["Не перекрашивать товар под палитру дворика","Не показывать неподтверждённые варианты цвета или технологию отделки"],"fallbackComposition":"Товар целиком слева на подиуме; справа нейтральное название без вариантов цвета."}'::jsonb),
              ('tpl_universal_lifestyle_v08', 'tpl_universal_lifestyle', 8, 'Маркировка', 'Если на товаре ясно виден логотип, принт или маркировка, показать этот участок ближе, сохранив его без изменений. Иначе показать товар целиком.', '{"schemaVersion":1,"framingMode":"detail","composition":"Ясно различимая маркировка или принт исходного товара крупно в центре над деревянной поверхностью; зелёный фон размыт, подпись минимальна.","conditions":["Не восстанавливать неразборчивые символы","Не придумывать бренд или новый принт"],"fallbackComposition":"Товар целиком на подиуме и нейтральное название; крупный план маркировки опустить."}'::jsonb),
              ('tpl_universal_lifestyle_v09', 'tpl_universal_lifestyle', 9, 'Подтверждённые факты', 'Показать товар целиком и рядом до трёх коротких подтверждённых фактов. Если сведений мало, сохранить свободное место вместо пустых плашек.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком справа на деревянном подиуме; слева поверх размытого дворика компактный вертикальный список из одного-трёх фактических блоков.","conditions":["Характеристики и численные значения брать только из подтверждённого описания","Не заполнять список предположениями ради композиции"],"fallbackComposition":"Товар целиком справа и одно нейтральное название слева; пустые фактические блоки убрать."}'::jsonb),
              ('tpl_universal_lifestyle_v10', 'tpl_universal_lifestyle', 10, 'Итоговая карточка', 'Завершить серию спокойной карточкой: товар целиком на подиуме, мягкий зелёный дворик и одно короткое подтверждённое описание рядом.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком крупно в центре подиума; мягко размытый зелёный дворик сзади, короткое название наверху и одна необязательная фактическая строка сбоку.","conditions":["Итоговый текст содержит только подтверждённые сведения","Не добавлять скидки, рейтинги, людей или чужие товары"],"fallbackComposition":"Товар целиком в центре деревянного подиума и нейтральное название; неподтверждённую строку опустить."}'::jsonb)
              ON CONFLICT (id) DO UPDATE SET title=EXCLUDED.title, default_idea=EXCLUDED.default_idea,
              generation_recipe=EXCLUDED.generation_recipe
              WHERE template_card_variants.template_id='tpl_universal_lifestyle'
              AND template_card_variants.position=EXCLUDED.position;
