databaseChangeLog:
  - changeSet:
      id: 037-beauty-clean-variants
      author: codex
      runInTransaction: true
      changes:
        - sql:
            splitStatements: false
            sql: |
              SET LOCAL standard_conforming_strings = on;
              INSERT INTO template_card_variants(id,template_id,position,title,default_idea,generation_recipe) VALUES
              ('tpl_beauty_hero_v01', 'tpl_beauty_hero', 1, 'Обложка', 'Показать средство целиком справа на чистом зелёном фоне. Слева разместить подтверждённое название или оставить пространство свободным.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Исходный товар целиком справа; слева крупный заголовок по подтверждённому названию, листья и влажные камни только у краёв.","conditions":["Сохранить форму, упаковку и читаемые надписи исходного товара","Не переносить текст или бренд демонстрационного флакона"],"fallbackComposition":"Товар целиком в центре на чистом светло-зелёном фоне без заголовка."}'::jsonb),
              ('tpl_beauty_hero_v02', 'tpl_beauty_hero', 2, 'Тип средства', 'Если тип средства подтверждён описанием или читаемой этикеткой, показать его коротким подзаголовком слева от товара.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком справа; короткий подзаголовок о подтверждённом типе средства под крупным названием слева.","conditions":["Тип средства брать только из описания или читаемой исходной этикетки","Не называть иной товар тоником по референсу"],"fallbackComposition":"Товар целиком справа без подзаголовка; сохранить воздух слева."}'::jsonb),
              ('tpl_beauty_hero_v03', 'tpl_beauty_hero', 3, 'Упаковка', 'Показать настоящую упаковку целиком, сохранив форму, крышку, пропорции и реальный цвет.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Флакон, туба, баночка или другая исходная упаковка целиком в правой части на спокойном зеленоватом фоне.","conditions":["Не заменять тип упаковки демонстрационным флаконом","Не менять цвет или материал товара под палитру фона"],"fallbackComposition":"Исходная упаковка целиком по центру без дополнительного текста."}'::jsonb),
              ('tpl_beauty_hero_v04', 'tpl_beauty_hero', 4, 'Видимая текстура', 'Показать различимую фактуру упаковки или средства крупно, только если она действительно видна на исходном фото.', '{"schemaVersion":1,"framingMode":"detail","composition":"Крупный фрагмент реально видимой поверхности товара на мягком фоне с каплями и зеленью по краям.","conditions":["Не создавать неразличимую текстуру средства","Не добавлять капли на сам товар, если они меняют его вид"],"fallbackComposition":"Товар целиком справа на светло-зелёном фоне без крупного плана."}'::jsonb),
              ('tpl_beauty_hero_v05', 'tpl_beauty_hero', 5, 'Деталь упаковки', 'Выделить одну различимую деталь упаковки: крышку, дозатор или форму корпуса. Если деталь не видна, показать общий вид.', '{"schemaVersion":1,"framingMode":"detail","composition":"Одна видимая деталь исходной упаковки крупно справа; слева спокойное поле без неподтверждённых подписей.","conditions":["Выбирать только действительно видимую деталь","Не дорисовывать дозатор, крышку или оборотную сторону"],"fallbackComposition":"Товар целиком в исходном ракурсе на чистом фоне."}'::jsonb),
              ('tpl_beauty_hero_v06', 'tpl_beauty_hero', 6, 'Маркировка', 'Если этикетка читается, показать настоящую маркировку крупнее без изменения. Нечитаемые буквы не восстанавливать.', '{"schemaVersion":1,"framingMode":"detail","composition":"Крупный план участка с реально читаемой маркировкой; ботаническое окружение остаётся на периферии.","conditions":["Сохранять только маркировку исходного товара","Не подменять бренд и не дописывать неразборчивый состав"],"fallbackComposition":"Показать товар целиком без увеличенной маркировки и без нового текста."}'::jsonb),
              ('tpl_beauty_hero_v07', 'tpl_beauty_hero', 7, 'Состав по фактам', 'При наличии подтверждённого состава дать до двух коротких строк слева. Если состава нет, оставить чистый фон.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком справа; слева компактный блок до двух подтверждённых ингредиентов или характеристик.","conditions":["Ингредиенты указывать только из описания или читаемой исходной этикетки","Не переносить зелёный чай, гиалуроновую кислоту или процент из reference"],"fallbackComposition":"Товар целиком справа, слева только фон без списка состава."}'::jsonb),
              ('tpl_beauty_hero_v08', 'tpl_beauty_hero', 8, 'Заявленное действие', 'Разместить короткое заявленное действие только при наличии точной формулировки от пользователя. Не добавлять обещаний по изображению.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком справа; слева одна лаконичная подтверждённая фраза ниже названия.","conditions":["Формулировку действия брать только из данных пользователя","Не выводить медицинские или косметические обещания из окружения"],"fallbackComposition":"Товар целиком справа без блока действия."}'::jsonb),
              ('tpl_beauty_hero_v09', 'tpl_beauty_hero', 9, 'Натуральная палитра', 'Сохранить реальный цвет товара в мягком дневном свете; зелёные листья и камни оставить фоном.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком справа при ровном мягком освещении; листва и влажные камни обрамляют низ и края.","conditions":["Не перекрашивать исходный товар в зелёный","Не добавлять значки натуральности или проценты без подтверждения"],"fallbackComposition":"Товар целиком на нейтральном светлом фоне без цветовых заявлений."}'::jsonb),
              ('tpl_beauty_hero_v10', 'tpl_beauty_hero', 10, 'Итоговая карточка', 'Собрать чистую карточку с товаром справа, подтверждённым названием слева и не более двух фактов при наличии данных.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Исходный товар целиком справа; слева заголовок и до двух коротких подтверждённых строк с широкими интервалами; зелень не перекрывает текст.","conditions":["Все подписи брать из исходного товара и описания пользователя","Не копировать название, бренд, состав, 99% или обещания reference"],"fallbackComposition":"Товар целиком справа на ботаническом фоне без неподтверждённых надписей."}'::jsonb)
              ON CONFLICT (id) DO UPDATE SET title=EXCLUDED.title, default_idea=EXCLUDED.default_idea,
              generation_recipe=EXCLUDED.generation_recipe
              WHERE template_card_variants.template_id='tpl_beauty_hero'
              AND template_card_variants.position=EXCLUDED.position;
