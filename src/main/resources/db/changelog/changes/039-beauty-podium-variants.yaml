databaseChangeLog:
  - changeSet:
      id: 039-beauty-podium-variants
      author: codex
      runInTransaction: true
      changes:
        - sql:
            splitStatements: false
            sql: |
              SET LOCAL standard_conforming_strings = on;
              INSERT INTO template_card_variants(id,template_id,position,title,default_idea,generation_recipe) VALUES
              ('tpl_beauty_accent_v01', 'tpl_beauty_accent', 1, 'Обложка', 'Показать исходный товар целиком на светлом каменном подиуме справа. Слева — короткое подтверждённое название, при отсутствии названия оставить чистое поле.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком справа на низком подиуме; слева крупная тонкая типографика для короткого названия, ниже место для нейтральной подписи.","conditions":["Не переносить слоган и бренд reference","Сохранять реальную форму упаковки и читаемую маркировку"],"fallbackComposition":"Товар целиком справа на подиуме; левое поле оставить пустым при отсутствии подтверждённого названия."}'::jsonb),
              ('tpl_beauty_accent_v02', 'tpl_beauty_accent', 2, 'Название и тип', 'Разместить товар целиком справа, а слева название и тип средства только при наличии этих данных в описании или на исходной упаковке.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Крупный товар справа; двухуровневый заголовок слева на фоне тёплой тени, под ним короткая строка с подтверждённым типом средства.","conditions":["Тип средства должен быть явно подтверждён","Не превращать декоративный заголовок reference в обещание результата"],"fallbackComposition":"Товар целиком справа; слева одно подтверждённое название либо чистое поле."}'::jsonb),
              ('tpl_beauty_accent_v03', 'tpl_beauty_accent', 3, 'Подтверждённое свойство', 'Выделить одно подтверждённое свойство короткой подписью слева от товара; не повторять обещания об увлажнении или сиянии с демонстрационного фото.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком на подиуме справа; слева один аккуратный информационный блок под крупным названием.","conditions":["Свойство должно следовать из описания пользователя или читаемой упаковки","Не добавлять медицинские или косметические обещания без подтверждения"],"fallbackComposition":"Товар целиком на подиуме; информационный блок опустить, оставить только подтверждённое название."}'::jsonb),
              ('tpl_beauty_accent_v04', 'tpl_beauty_accent', 4, 'Форма упаковки', 'Показать реальную форму и пропорции упаковки в полный рост на каменном подиуме. Подпись о форме использовать лишь если она подтверждена.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Упаковка целиком в центре подиума; тёплый боковой свет подчёркивает видимый контур, короткая подпись вынесена влево.","conditions":["Не менять силуэт, крышку, дозатор или пропорции исходной упаковки","Не дорисовывать скрытую сторону упаковки"],"fallbackComposition":"Товар целиком по центру на подиуме без подписи о форме."}'::jsonb),
              ('tpl_beauty_accent_v05', 'tpl_beauty_accent', 5, 'Видимая деталь', 'Увеличить действительно различимую деталь упаковки, например крышку или дозатор. Если исходное фото не даёт чёткой детали, показать товар целиком.', '{"schemaVersion":1,"framingMode":"detail","composition":"Крупный план одной видимой детали товара справа над подиумом; слева сдержанный заголовок и одна подтверждённая строка.","conditions":["Выбирать только чётко видимый участок исходного фото","Не копировать форму пипетки или золотого кольца reference на другой товар"],"fallbackComposition":"Товар целиком справа на подиуме; блок о детали и крупный план опустить."}'::jsonb),
              ('tpl_beauty_accent_v06', 'tpl_beauty_accent', 6, 'Маркировка', 'Если надписи на исходной упаковке читаемы, показать их без изменений в тёплом свете. Нечитаемые буквы и бренд не восстанавливать по догадке.', '{"schemaVersion":1,"framingMode":"detail","composition":"Различимая область этикетки крупно справа; слева свободное поле с нейтральным названием без дополнительных заявлений.","conditions":["Точно сохранять видимый бренд и надписи пользователя","Не переносить бренд, объём и состав с reference"],"fallbackComposition":"Показать упаковку целиком на каменном подиуме, без увеличенной этикетки и текстовой расшифровки."}'::jsonb),
              ('tpl_beauty_accent_v07', 'tpl_beauty_accent', 7, 'Материал и фактура', 'Показать различимую фактуру упаковки под боковым светом. Если материал или фактура не видны, сохранить целый вид товара без догадок.', '{"schemaVersion":1,"framingMode":"detail","composition":"Крупная видимая поверхность упаковки справа, мягкая тень на бежевой стене и край каменного подиума внизу.","conditions":["Не выводить материал упаковки только из бликов reference","Не создавать капли, текстуру или прозрачность, которых нет на исходном товаре"],"fallbackComposition":"Товар целиком справа на подиуме, без подписи о материале и без крупного плана."}'::jsonb),
              ('tpl_beauty_accent_v08', 'tpl_beauty_accent', 8, 'Состав или объём', 'Разместить рядом с товаром до двух подтверждённых строк о составе или объёме. Если таких данных нет, оставить минимальную предметную карточку.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком справа; слева два небольших текстовых ряда под коротким заголовком, тонкие декоративные разделители без пиктограмм-обещаний.","conditions":["Каждая цифра и ингредиент должны быть подтверждены","Не копировать peptide complex, 30 ml и другие факты демонстрационной сыворотки"],"fallbackComposition":"Товар целиком справа на подиуме; неподтверждённые строки и разделители удалить."}'::jsonb),
              ('tpl_beauty_accent_v09', 'tpl_beauty_accent', 9, 'Цвет и свет', 'Показать подлинный цвет товара на светлом фоне с солнечной тенью. Не окрашивать упаковку золотым или бежевым оттенком reference.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком по центру на светлом каменном подиуме; боковой солнечный луч и мягкая тень ветвей создают глубину.","conditions":["Сохранять исходный цвет упаковки и этикетки","Не обещать сияние кожи на основании светового оформления"],"fallbackComposition":"Товар целиком на нейтральном светлом подиуме без цветовой подписи."}'::jsonb),
              ('tpl_beauty_accent_v10', 'tpl_beauty_accent', 10, 'Итоговая карточка', 'Завершить серию крупной карточкой с товаром целиком на каменном подиуме, названием и одной подтверждённой подписью при наличии данных.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком справа на светлом подиуме; слева короткий крупный заголовок и до одной фактической подписи, внизу широкое чистое поле.","conditions":["Использовать лишь достоверные сведения пользователя","Не добавлять цены, рейтинги, слоганы или обещания результата без подтверждения"],"fallbackComposition":"Товар целиком на подиуме, слева только подтверждённое название либо чистое поле."}'::jsonb)
              ON CONFLICT (id) DO UPDATE SET title=EXCLUDED.title, default_idea=EXCLUDED.default_idea,
              generation_recipe=EXCLUDED.generation_recipe
              WHERE template_card_variants.template_id='tpl_beauty_accent'
              AND template_card_variants.position=EXCLUDED.position;
