databaseChangeLog:
  - changeSet:
      id: 041-beauty-lifestyle-variants
      author: codex
      runInTransaction: true
      changes:
        - sql:
            splitStatements: false
            sql: |
              SET LOCAL standard_conforming_strings = on;
              INSERT INTO template_card_variants(id,template_id,position,title,default_idea,generation_recipe) VALUES
              ('tpl_beauty_lifestyle_v01', 'tpl_beauty_lifestyle', 1, 'Обложка', 'Показать beauty-товар целиком на нежно-зелёном фоне среди листьев. Если подтверждено название, дать ему короткую строку в свободной зоне.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Исходный товар целиком по центру; листья по краям кадра, мягкая зелёная поверхность и свободная зона для одного подтверждённого заголовка.","conditions":["Сохранять форму, цвет, бренд и читаемые надписи исходного товара","Не переносить название и заявления с демонстрационной упаковки"],"fallbackComposition":"Товар целиком по центру на зелёной поверхности, листья остаются по краям; неподтверждённый текст убрать."}'::jsonb),
              ('tpl_beauty_lifestyle_v02', 'tpl_beauty_lifestyle', 2, 'Свежая зелень', 'Показать товар в более широком кадре с зелёными листьями и мягким дневным светом. Листья остаются декором, без намёка на состав.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком в центре, крупные листья в углах и спокойное зелёное поле вокруг; краткое подтверждённое название сверху.","conditions":["Не выдавать листья за ингредиенты","Растения не заслоняют этикетку и силуэт товара"],"fallbackComposition":"Товар целиком на чистом зелёном фоне с несколькими листьями по краям, без заявлений о составе."}'::jsonb),
              ('tpl_beauty_lifestyle_v03', 'tpl_beauty_lifestyle', 3, 'Влажный акцент', 'Добавить капли на поверхность рядом с товаром для ощущения свежести, не утверждая влагостойкость упаковки или увлажняющее действие.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком со смещением вправо; слева отдельные капли на зелёном фоне и короткая подтверждённая подпись при наличии факта.","conditions":["Капли относятся к фону и не меняют свойства товара","Не добавлять на упаковку неподтверждённую влагу или конденсат"],"fallbackComposition":"Товар целиком справа на чистой поверхности, слева только фактическое название без дополнительных свойств."}'::jsonb),
              ('tpl_beauty_lifestyle_v04', 'tpl_beauty_lifestyle', 4, 'Видимая текстура', 'Показать различимую на исходном фото текстуру упаковки или самого продукта. Если текстура неизвестна, оставить общий вид товара.', '{"schemaVersion":1,"framingMode":"detail","composition":"Крупный план действительно видимой поверхности исходного товара на шалфейном фоне; листья и капли удалены от детали, сбоку краткая фактическая подпись.","conditions":["Текстура должна быть ясно видна на исходном фото","Не создавать несуществующую консистенцию косметического средства"],"fallbackComposition":"Товар целиком на зелёной поверхности с нейтральной подписью; выдуманный крупный план исключить."}'::jsonb),
              ('tpl_beauty_lifestyle_v05', 'tpl_beauty_lifestyle', 5, 'Форма упаковки', 'Выделить реальный силуэт упаковки и хорошо видимую крышку или дозатор. Невидимую конструкцию не дорисовывать.', '{"schemaVersion":1,"framingMode":"detail","composition":"Крупнее показать ясно видимую верхнюю часть упаковки, оставив вокруг светло-зелёное поле и листья вдали от детали.","conditions":["Ракурс и механизм крышки должны следовать из исходного фото","Не придумывать объём, герметичность и способ открытия"],"fallbackComposition":"Упаковка целиком с видимым силуэтом на зелёном фоне; детальный ракурс не создавать."}'::jsonb),
              ('tpl_beauty_lifestyle_v06', 'tpl_beauty_lifestyle', 6, 'Маркировка', 'Если маркировка исходного товара разборчива, показать её ближе без замены бренда. Нечитаемый текст не восстанавливать.', '{"schemaVersion":1,"framingMode":"detail","composition":"Крупный план отчётливо видимой маркировки исходного товара, мягкий зелёный фон и минимум декора; короткая подпись только по подтверждённым данным.","conditions":["Сохранять только реально различимые буквы и знаки","Не копировать бренд и надписи демонстрационного тюбика"],"fallbackComposition":"Товар целиком на зелёном фоне с нейтральным названием, без выдуманного текста на упаковке."}'::jsonb),
              ('tpl_beauty_lifestyle_v07', 'tpl_beauty_lifestyle', 7, 'Цвет товара', 'Подчеркнуть настоящий цвет товара на спокойном шалфейном фоне. Палитра окружения не меняет цвет упаковки.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком по центру, вокруг светло-зелёный фон с мягким градиентом и немного листьев; при наличии факта одна подпись о цвете.","conditions":["Не перекрашивать товар под зелёную палитру reference","Не показывать неподтверждённые варианты оттенков"],"fallbackComposition":"Товар целиком со своим реальным цветом на спокойном зелёном фоне, без подписи об оттенках."}'::jsonb),
              ('tpl_beauty_lifestyle_v08', 'tpl_beauty_lifestyle', 8, 'Главный факт', 'Поставить рядом с товаром одну проверенную характеристику из описания пользователя. Если данных нет, сохранить свободное место.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком справа, слева на ровном зелёном поле крупный короткий заголовок и одна фактическая строка; листья у внешней кромки.","conditions":["Не переносить с reference проценты, состав, ретинол, объём или обещания результата","Характеристика должна быть подтверждена описанием пользователя"],"fallbackComposition":"Товар целиком справа и подтверждённое название слева; строку характеристики опустить."}'::jsonb),
              ('tpl_beauty_lifestyle_v09', 'tpl_beauty_lifestyle', 9, 'Контекст ухода', 'Показать продукт в спокойном beauty-окружении с зеленью. Пену оставлять только для подтверждённого очищающего средства.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком на переднем плане; листья и светлые капли на фоне, при подтверждённом очищающем назначении немного пены сбоку.","conditions":["Не подразумевать способ применения или эффект без факта","Пена не должна закрывать исходный товар и этикетку"],"fallbackComposition":"Товар целиком на светлой зелёной поверхности с листьями по краям и без пены."}'::jsonb),
              ('tpl_beauty_lifestyle_v10', 'tpl_beauty_lifestyle', 10, 'Итоговая карточка', 'Завершить серию товаром целиком, свежей зеленью и одним-двумя короткими подтверждёнными фактами без демонстрационных заявлений.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком крупно по центру, листья и капли обрамляют края; свободная зона для названия и до двух проверенных строк.","conditions":["Не добавлять характеристики, численные значения и бренд с reference","Не занимать свободное место неподтверждённым текстом"],"fallbackComposition":"Товар целиком на мягком зелёном фоне и одно подтверждённое название; дополнительные строки убрать."}'::jsonb)
              ON CONFLICT (id) DO UPDATE SET title=EXCLUDED.title, default_idea=EXCLUDED.default_idea,
              generation_recipe=EXCLUDED.generation_recipe
              WHERE template_card_variants.template_id='tpl_beauty_lifestyle'
              AND template_card_variants.position=EXCLUDED.position;
