databaseChangeLog:
  - changeSet:
      id: 043-tech-studio-variants
      author: codex
      runInTransaction: true
      changes:
        - sql:
            splitStatements: false
            sql: |
              SET LOCAL standard_conforming_strings = on;
              INSERT INTO template_card_variants(id,template_id,position,title,default_idea,generation_recipe) VALUES
              ('tpl_electronics_hero_v01', 'tpl_electronics_hero', 1, 'Обложка', 'Показать устройство крупно на светлом фоне с подтверждённым названием в верхней части карточки.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком по диагонали в центре; сверху крупный заголовок из данных пользователя, по краям много светлого пространства.","conditions":["Не переносить название и бренд демонстрационного геймпада","Сохранить реальную форму и видимую маркировку исходного устройства"],"fallbackComposition":"Товар целиком по центру на белом фоне без заголовка."}'::jsonb),
              ('tpl_electronics_hero_v02', 'tpl_electronics_hero', 2, 'Тип устройства', 'Если тип устройства известен, дать короткий подзаголовок под крупным названием.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Крупный товар в центре; подтверждённый тип устройства как короткий подзаголовок под заголовком в верхней зоне.","conditions":["Тип устройства брать только из описания или различимой маркировки","Не называть иной товар геймпадом по reference"],"fallbackComposition":"Товар целиком с одним подтверждённым заголовком или без текста."}'::jsonb),
              ('tpl_electronics_hero_v03', 'tpl_electronics_hero', 3, 'Ключевой факт', 'Вынести одну подтверждённую характеристику в тёмную прямоугольную плашку слева.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком крупно; слева тёмная плашка с одним коротким проверенным фактом и крупным числом только при наличии точного значения.","conditions":["Не использовать 6 часов работы из reference без подтверждения","Не придумывать числа, единицы измерения или ресурс"],"fallbackComposition":"Товар целиком на светлом фоне без числовой плашки."}'::jsonb),
              ('tpl_electronics_hero_v04', 'tpl_electronics_hero', 4, 'Форма корпуса', 'Подчеркнуть узнаваемую форму устройства и сохранить его полный контур.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком в крупном диагональном ракурсе на бело-сером фоне; декоративные металлические формы остаются у краёв.","conditions":["Не менять геометрию корпуса под форму геймпада","Не перекрывать товар декоративными элементами"],"fallbackComposition":"Товар целиком в исходном ракурсе на простом светлом фоне."}'::jsonb),
              ('tpl_electronics_hero_v05', 'tpl_electronics_hero', 5, 'Видимые органы управления', 'Показать крупно реально различимые кнопки, разъёмы или переключатели, если они есть на фото.', '{"schemaVersion":1,"framingMode":"detail","composition":"Крупный фрагмент видимых органов управления исходного устройства на нейтральном светлом фоне.","conditions":["Не дорисовывать невидимые кнопки и порты","Не копировать кнопки демонстрационного геймпада"],"fallbackComposition":"Товар целиком в известном ракурсе без вымышленного крупного плана."}'::jsonb),
              ('tpl_electronics_hero_v06', 'tpl_electronics_hero', 6, 'Материал и отделка', 'Показать реальную фактуру и цвет корпуса, если они видны на исходном изображении.', '{"schemaVersion":1,"framingMode":"detail","composition":"Крупный фрагмент различимой поверхности корпуса при ровном студийном свете; подписи только по подтверждённым данным.","conditions":["Не приписывать устройству материал по виду reference","Не перекрашивать товар в белый или синий"],"fallbackComposition":"Товар целиком на светлом фоне с точным исходным цветом."}'::jsonb),
              ('tpl_electronics_hero_v07', 'tpl_electronics_hero', 7, 'Маркировка', 'При читаемой маркировке выделить её без замены и без восстановления неразборчивых символов.', '{"schemaVersion":1,"framingMode":"detail","composition":"Показать крупно видимую маркировку исходного устройства; вокруг сохранить чистую студийную подачу.","conditions":["Сохранять только реальный логотип и надписи исходного товара","Не переносить PS5 и символы демонстрационного устройства"],"fallbackComposition":"Товар целиком без увеличенной маркировки и без дополнительного бренда."}'::jsonb),
              ('tpl_electronics_hero_v08', 'tpl_electronics_hero', 8, 'Подтверждённые функции', 'Разместить справа до двух функций с лаконичными значками лишь при наличии достоверных сведений.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком по диагонали; справа две короткие строки подтверждённых функций с аккуратными пиктограммами.","conditions":["Не копировать виброотклик, динамик и беспроводное подключение из reference","Не создавать значки для неподтверждённых функций"],"fallbackComposition":"Товар целиком, справа оставить свободное светлое поле."}'::jsonb),
              ('tpl_electronics_hero_v09', 'tpl_electronics_hero', 9, 'Свет и детали', 'Показать изделие в мягком свете так, чтобы различались контур, элементы управления и реальный цвет.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком крупно в центре на нейтральном светлом фоне; мягкие тени подчёркивают реальные детали.","conditions":["Не усиливать отражения до потери маркировки","Не добавлять кабели, аксессуары или другие товары"],"fallbackComposition":"Товар целиком при ровном рассеянном свете без декоративных вставок."}'::jsonb),
              ('tpl_electronics_hero_v10', 'tpl_electronics_hero', 10, 'Итоговая карточка', 'Собрать светлую карточку с крупным товаром, названием и максимум двумя подтверждёнными характеристиками.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком по диагонали; сверху крупное подтверждённое название, сбоку одна плашка и до двух коротких фактов при наличии данных.","conditions":["Все надписи брать из сведений о товаре пользователя","Не переносить PS5, 6 часов, виброотклик, динамик, подключение или подарок из reference"],"fallbackComposition":"Товар целиком на чистом светлом фоне, без неподтверждённых надписей и плашек."}'::jsonb)
              ON CONFLICT (id) DO UPDATE SET title=EXCLUDED.title, default_idea=EXCLUDED.default_idea,
              generation_recipe=EXCLUDED.generation_recipe
              WHERE template_card_variants.template_id='tpl_electronics_hero'
              AND template_card_variants.position=EXCLUDED.position;
