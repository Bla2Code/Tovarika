databaseChangeLog:
  - changeSet:
      id: 045-tech-neon-variants
      author: codex
      runInTransaction: true
      changes:
        - sql:
            splitStatements: false
            sql: |
              SET LOCAL standard_conforming_strings = on;
              INSERT INTO template_card_variants(id,template_id,position,title,default_idea,generation_recipe) VALUES
              ('tpl_electronics_accent_v01', 'tpl_electronics_accent', 1, 'Обложка', 'Показать исходный товар целиком в центре на неоновом градиенте. Крупное название и маленький бренд добавить лишь если они подтверждены.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком по центру, большая полупрозрачная надпись позади него; снизу короткий подтверждённый заголовок.","conditions":["Не переносить бренд и модель демонстрационного товара","Не скрывать важные части товара буквами"],"fallbackComposition":"Товар целиком в центре на градиенте без фоновых букв и нижнего заголовка."}'::jsonb),
              ('tpl_electronics_accent_v02', 'tpl_electronics_accent', 2, 'Название и модель', 'Выделить название и модель пользователя над или под товаром, если они указаны в описании либо читаются на фото.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком в центре; сверху компактный бренд, снизу крупная модель и тонкая декоративная рамка.","conditions":["Бренд и модель должны быть подтверждены","Не использовать JETE X или TG101"],"fallbackComposition":"Товар целиком на неоновом фоне с нейтральной подписью о типе товара, если она подтверждена."}'::jsonb),
              ('tpl_electronics_accent_v03', 'tpl_electronics_accent', 3, 'Главная характеристика', 'Показать одну действительно подтверждённую характеристику в крупном нижнем блоке, сохраняя товар целиком.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком над светлой плоскостью; внизу крупное значение и короткое пояснение с высоким контрастом.","conditions":["Цифра, единица измерения и формулировка должны быть подтверждены","Не заимствовать задержку, время работы или версию Bluetooth из reference"],"fallbackComposition":"Товар целиком с кратким подтверждённым названием; числовой блок опустить."}'::jsonb),
              ('tpl_electronics_accent_v04', 'tpl_electronics_accent', 4, 'Способ подключения', 'Указать способ подключения только при наличии достоверных данных о товаре пользователя.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком в центре; справа или внизу одна аккуратная подпись со способом подключения и простой пиктограммой при необходимости.","conditions":["Не предполагать беспроводное подключение по внешнему виду","Не переносить Bluetooth 5.4 или dual mode из reference"],"fallbackComposition":"Товар целиком на неоновом фоне без значка и подписи подключения."}'::jsonb),
              ('tpl_electronics_accent_v05', 'tpl_electronics_accent', 5, 'Видимая деталь', 'Крупно показать различимую деталь конструкции товара. Если исходный ракурс не позволяет, показать весь товар.', '{"schemaVersion":1,"framingMode":"detail","composition":"Различимая деталь в центре кадра под красно-оранжевым контровым светом; небольшая фактическая подпись внизу.","conditions":["Увеличивать только реально видимый участок исходного фото","Не дорисовывать несуществующие индикаторы, кнопки и порты"],"fallbackComposition":"Товар целиком на градиенте, без подписи о детали."}'::jsonb),
              ('tpl_electronics_accent_v06', 'tpl_electronics_accent', 6, 'Маркировка и корпус', 'Подчеркнуть читаемую маркировку и видимую фактуру корпуса без восстановления нечётких надписей.', '{"schemaVersion":1,"framingMode":"detail","composition":"Крупный план читаемой маркировки или поверхности корпуса; тёмный фон и узкий тёплый световой акцент.","conditions":["Сохранять буквы и логотип только если они видны на исходном товаре","Не вставлять логотипы и геометрию демонстрационных наушников"],"fallbackComposition":"Товар целиком в центре; убрать увеличенную маркировку и пояснение."}'::jsonb),
              ('tpl_electronics_accent_v07', 'tpl_electronics_accent', 7, 'Подтверждённые параметры', 'Разместить до трёх коротких подтверждённых параметров в нижнем ряду, сохраняя главный акцент на товаре.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком сверху; снизу ряд из одной–трёх лаконичных подписей с деликатными иконками.","conditions":["Каждую цифру и стандарт брать только из данных пользователя","Не переносить 45 ms, 20 hours, Bluetooth 5.4 или IPX5"],"fallbackComposition":"Товар целиком на красно-оранжевом градиенте без ряда параметров."}'::jsonb),
              ('tpl_electronics_accent_v08', 'tpl_electronics_accent', 8, 'Комплектация', 'Показать комплект только если его состав подтверждён и предметы видны либо описаны пользователем.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Главный товар крупно по центру; компактный список подтверждённых предметов комплекта внизу на тёмной полосе.","conditions":["Не добавлять зарядный кейс, кабель и другие предметы по аналогии с reference","Не выводить комплект из формы товара"],"fallbackComposition":"Один исходный товар целиком на светлом основании; список комплекта опустить."}'::jsonb),
              ('tpl_electronics_accent_v09', 'tpl_electronics_accent', 9, 'Цвет и подсветка', 'Показать реальный цвет товара на контрастном фоне с неоновой подсветкой, не меняя его материал и покрытие.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком на границе фиолетового и оранжевого света; крупная мягкая тень на светлом основании.","conditions":["Подсветка относится к сцене, а не к функции товара","Не добавлять RGB-подсветку или доступные цвета без подтверждения"],"fallbackComposition":"Товар целиком на спокойном красно-фиолетовом градиенте без подписи о цвете."}'::jsonb),
              ('tpl_electronics_accent_v10', 'tpl_electronics_accent', 10, 'Итоговая карточка', 'Собрать выразительную финальную карточку с товаром, подтверждённым названием и максимум двумя фактами.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Крупный товар целиком по центру, неоновый градиент и широкий нижний блок для названия и двух коротких фактов.","conditions":["Оставлять только подтверждённые сведения","Не добавлять обещания, цену или рейтинг без данных пользователя"],"fallbackComposition":"Товар целиком в центре, подтверждённое название снизу либо только чистая композиция."}'::jsonb)
              ON CONFLICT (id) DO UPDATE SET title=EXCLUDED.title, default_idea=EXCLUDED.default_idea,
              generation_recipe=EXCLUDED.generation_recipe
              WHERE template_card_variants.template_id='tpl_electronics_accent'
              AND template_card_variants.position=EXCLUDED.position;
