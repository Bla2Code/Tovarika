databaseChangeLog:
  - changeSet:
      id: 047-tech-workspace-variants
      author: codex
      runInTransaction: true
      changes:
        - sql:
            splitStatements: false
            sql: |
              SET LOCAL standard_conforming_strings = on;
              INSERT INTO template_card_variants(id,template_id,position,title,default_idea,generation_recipe) VALUES
              ('tpl_electronics_lifestyle_v01', 'tpl_electronics_lifestyle', 1, 'Обложка', 'Показать электронный товар крупно на тёмно-синей поверхности. Над ним — подтверждённое название, рядом — до двух проверенных фактов.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком крупно в центре на синем предметном фоне; сверху широкий заголовок, по краю короткие фактические строки.","conditions":["Сохранять реальный цвет, геометрию и бренд исходного товара","Не копировать название и цифры с демонстрационной мыши"],"fallbackComposition":"Товар целиком на синем фоне и одно подтверждённое название; неподтверждённые строки убрать."}'::jsonb),
              ('tpl_electronics_lifestyle_v02', 'tpl_electronics_lifestyle', 2, 'Крупный силуэт', 'Подчеркнуть узнаваемый силуэт товара на синем фоне без дополнительных устройств и аксессуаров.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком слегка по диагонали, с мягкой тенью на минимальной рабочей поверхности; заголовок в свободной верхней зоне.","conditions":["Не менять форму корпуса или ориентацию вопреки исходному фото","Не добавлять сторонние устройства"],"fallbackComposition":"Товар целиком в исходном доступном ракурсе на чистом синем фоне."}'::jsonb),
              ('tpl_electronics_lifestyle_v03', 'tpl_electronics_lifestyle', 3, 'Главная характеристика', 'Выделить одну характеристику, которая прямо подтверждена описанием пользователя; без данных оставить только название.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком справа, слева крупная проверенная характеристика и короткая подпись; мягкий синий свет обводит силуэт.","conditions":["Не переносить 50000 dpi, 8000 Гц или сенсор PAW3955 из reference","Числа и единицы измерения использовать только при подтверждении"],"fallbackComposition":"Товар целиком справа, слева только подтверждённое название без чисел."}'::jsonb),
              ('tpl_electronics_lifestyle_v04', 'tpl_electronics_lifestyle', 4, 'Материал и фактура', 'Показать видимую фактуру корпуса или поверхности товара; если она неразличима, использовать общий план.', '{"schemaVersion":1,"framingMode":"detail","composition":"Крупный план действительно видимой поверхности товара, с синим градиентом и короткой фактической подписью сбоку.","conditions":["Деталь должна ясно различаться на исходном фото","Не приписывать материал или покрытие по одному блику"],"fallbackComposition":"Товар целиком на тёмно-синей поверхности, без крупного плана и заявления о материале."}'::jsonb),
              ('tpl_electronics_lifestyle_v05', 'tpl_electronics_lifestyle', 5, 'Видимое управление', 'Выделить реально видимые кнопки или элементы управления, не выдумывая их функции.', '{"schemaVersion":1,"framingMode":"detail","composition":"Крупный план различимых элементов управления с боковым светом; вокруг свободное тёмно-синее поле для подтверждённой подписи.","conditions":["Показывать только элементы, видимые на фото пользователя","Назначение кнопок не угадывать по форме"],"fallbackComposition":"Товар целиком в исходном ракурсе; при отсутствии подтверждения функциональные подписи убрать."}'::jsonb),
              ('tpl_electronics_lifestyle_v06', 'tpl_electronics_lifestyle', 6, 'Маркировка', 'Сохранить разборчивые надписи и логотип исходного товара. Нечитаемую маркировку не восстанавливать.', '{"schemaVersion":1,"framingMode":"detail","composition":"Ближе показать различимую маркировку исходного товара на синем студийном фоне; графика вторична и не перекрывает буквы.","conditions":["Копировать только видимую маркировку товара пользователя","Не переносить ATK и A9 Air с демонстрационного изображения"],"fallbackComposition":"Товар целиком без выдуманного логотипа или текста на корпусе."}'::jsonb),
              ('tpl_electronics_lifestyle_v07', 'tpl_electronics_lifestyle', 7, 'Цвет и свет', 'Показать настоящий цвет товара в холодном студийном свете, не объявляя неподтверждённые цветовые варианты.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком по центру; синий фон переходит от тёмного к светлому, а блики помогают читать реальные контуры.","conditions":["Не перекрашивать товар под палитру reference","Не создавать другие варианты расцветки"],"fallbackComposition":"Товар целиком со своим исходным цветом на ровном тёмно-синем фоне."}'::jsonb),
              ('tpl_electronics_lifestyle_v08', 'tpl_electronics_lifestyle', 8, 'Подключение', 'Если тип подключения подтверждён, показать его короткой подписью; иначе оставить композицию без иконок связи.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком крупно; сбоку одна лаконичная плашка с подтверждённым типом подключения на синем поле.","conditions":["USB, 2.4 G и Bluetooth не брать из reference","Не рисовать кабель, приёмник или порт, если они не видны на исходном фото"],"fallbackComposition":"Товар целиком на синем фоне без плашки и иконок подключения."}'::jsonb),
              ('tpl_electronics_lifestyle_v09', 'tpl_electronics_lifestyle', 9, 'На рабочей поверхности', 'Поместить товар на простую тёмно-синюю рабочую поверхность без вымышленных предметов вокруг.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком на пустой матовой синей поверхности с мягкой тенью и геометрическим фоном; сверху короткий подтверждённый заголовок.","conditions":["Не добавлять монитор, клавиатуру, руки и другие аксессуары","Не подразумевать совместимость или сценарий использования без факта"],"fallbackComposition":"Товар целиком на чистой тёмно-синей студийной плоскости."}'::jsonb),
              ('tpl_electronics_lifestyle_v10', 'tpl_electronics_lifestyle', 10, 'Итоговая карточка', 'Завершить серию крупным товаром, названием и максимум двумя подтверждёнными фактами в чистой синей композиции.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком в центре на синей поверхности; большой заголовок сверху и до двух коротких фактических строк по краям.","conditions":["Не копировать ATK, сенсор, dpi, частоту и значки подключения с reference","Пустые блоки не заменять выдуманными характеристиками"],"fallbackComposition":"Товар целиком на синем фоне с одним подтверждённым названием; дополнительные блоки убрать."}'::jsonb)
              ON CONFLICT (id) DO UPDATE SET title=EXCLUDED.title, default_idea=EXCLUDED.default_idea,
              generation_recipe=EXCLUDED.generation_recipe
              WHERE template_card_variants.template_id='tpl_electronics_lifestyle'
              AND template_card_variants.position=EXCLUDED.position;
