databaseChangeLog:
  - changeSet:
      id: 049-home-clean-variants
      author: codex
      runInTransaction: true
      changes:
        - sql:
            splitStatements: false
            sql: |
              SET LOCAL standard_conforming_strings = on;
              INSERT INTO template_card_variants(id,template_id,position,title,default_idea,generation_recipe) VALUES
              ('tpl_home_hero_v01', 'tpl_home_hero', 1, 'Обложка', 'Показать товар для дома крупно по центру на фоне светлой кухни с зелёным акцентом.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком в центре; сверху крупное подтверждённое название, позади диагональное деление тёмной и светлой кухонных зон без заявления о результате.","conditions":["Не превращать декоративное деление в сравнение до и после","Не менять товар на бутылку из reference"],"fallbackComposition":"Товар целиком по центру на светлом кухонном фоне с коротким подтверждённым названием или без текста."}'::jsonb),
              ('tpl_home_hero_v02', 'tpl_home_hero', 2, 'Название и тип', 'Выделить название и подтверждённый тип товара в верхней части карточки.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком по центру; крупный заголовок сверху, короткий подзаголовок под ним, зелёная линия как декоративный разделитель.","conditions":["Тип и название брать только из данных пользователя и читаемой маркировки","Не копировать слоган и английские подписи reference"],"fallbackComposition":"Товар целиком на чистой кухне; оставить только достоверное название либо убрать надписи."}'::jsonb),
              ('tpl_home_hero_v03', 'tpl_home_hero', 3, 'До и после', 'Показать реальное сравнение только при наличии сопоставимых исходных снимков и подтверждённого результата.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Центральный товар поверх диагональной границы; две стороны кухни подписать «До» и «После» только по реальным сопоставимым материалам пользователя.","conditions":["Нужны два сопоставимых изображения одного места и подтверждённый результат","Не генерировать загрязнение, очистку или иной эффект по одному фото"],"fallbackComposition":"Товар целиком на единой чистой кухне; убрать деление и все подписи о сравнении."}'::jsonb),
              ('tpl_home_hero_v04', 'tpl_home_hero', 4, 'Форма товара', 'Подчеркнуть реальный контур и пропорции товара на домашнем фоне.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком на переднем плане, небольшой отступ от краёв; размытые детали кухни не перекрывают его силуэт.","conditions":["Не копировать форму распылителя или бутылки с reference","Не дорисовывать скрытые части корпуса"],"fallbackComposition":"Товар целиком в известном ракурсе на нейтральном светлом фоне."}'::jsonb),
              ('tpl_home_hero_v05', 'tpl_home_hero', 5, 'Видимая деталь', 'Показать крупно одну отчётливо различимую конструктивную деталь товара.', '{"schemaVersion":1,"framingMode":"detail","composition":"Крупный план реально видимой детали на фоне светлой кухонной зоны; тонкий зелёный разделитель и короткая подпись при наличии данных.","conditions":["Не придумывать насадку, крышку или механизм","Подписывать функцию детали только при подтверждении"],"fallbackComposition":"Показать товар целиком на кухонном фоне без увеличения неразличимой детали."}'::jsonb),
              ('tpl_home_hero_v06', 'tpl_home_hero', 6, 'Материал и отделка', 'Передать видимую фактуру и отделку товара без догадок о составе.', '{"schemaVersion":1,"framingMode":"detail","composition":"Различимая поверхность товара крупно при мягком дневном свете; зелёный акцент остаётся только в фоне или графике.","conditions":["Материал и покрытие указывать лишь из подтверждённого описания","Не менять реальный цвет товара под зелёную палитру"],"fallbackComposition":"Товар целиком на нейтральной кухне, без подписи о материале."}'::jsonb),
              ('tpl_home_hero_v07', 'tpl_home_hero', 7, 'Маркировка', 'Сохранить реальные видимые надписи и бренд на товаре.', '{"schemaVersion":1,"framingMode":"detail","composition":"Увеличить читаемую область этикетки или маркировки исходного товара; кухня остаётся мягким фоном.","conditions":["Не переносить надписи демонстрационного средства","Не восстанавливать нечитаемые символы и не придумывать состав"],"fallbackComposition":"Показать товар целиком без увеличенной маркировки и без расшифровки неясного текста."}'::jsonb),
              ('tpl_home_hero_v08', 'tpl_home_hero', 8, 'Подтверждённые свойства', 'Разместить до трёх коротких подтверждённых сведений о товаре справа в зелёных плашках.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком по центру; справа вертикальный ряд зелёных круглых маркеров с краткими подтверждёнными фактами.","conditions":["Не копировать обещания блеска, удаления жира и свежести из reference","Не использовать чисел, сертификатов или иконок эффекта без данных"],"fallbackComposition":"Товар целиком на светлой кухне; справа оставить чистое поле без фактических плашек."}'::jsonb),
              ('tpl_home_hero_v09', 'tpl_home_hero', 9, 'В домашней среде', 'Показать товар в уместной домашней обстановке без демонстрации неподтверждённого действия.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком на переднем плане подходящей домашней зоны; свет из окна, мягкий зелёный текстиль или растение сбоку.","conditions":["Окружение должно подходить типу исходного товара","Не показывать применение или результат, которых нет в материалах пользователя"],"fallbackComposition":"Товар целиком на нейтральном домашнем фоне без сцены применения."}'::jsonb),
              ('tpl_home_hero_v10', 'tpl_home_hero', 10, 'Итоговая карточка', 'Собрать карточку с крупным товаром, названием и лишь подтверждёнными фактами.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком по центру, крупное название сверху, светлая кухня с зелёными акцентами; сбоку до двух достоверных кратких подписей.","conditions":["Не переносить демонстрационные рекламные заявления","Подписи «До» и «После» использовать лишь при наличии реального сравнения"],"fallbackComposition":"Товар целиком на едином светлом кухонном фоне, только подтверждённое название или вовсе без текста."}'::jsonb)
              ON CONFLICT (id) DO UPDATE SET title=EXCLUDED.title, default_idea=EXCLUDED.default_idea,
              generation_recipe=EXCLUDED.generation_recipe
              WHERE template_card_variants.template_id='tpl_home_hero'
              AND template_card_variants.position=EXCLUDED.position;
