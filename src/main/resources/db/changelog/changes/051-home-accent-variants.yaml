databaseChangeLog:
  - changeSet:
      id: 051-home-accent-variants
      author: codex
      runInTransaction: true
      changes:
        - sql:
            splitStatements: false
            sql: |
              SET LOCAL standard_conforming_strings = on;
              INSERT INTO template_card_variants(id,template_id,position,title,default_idea,generation_recipe) VALUES
              ('tpl_home_accent_v01', 'tpl_home_accent', 1, 'Обложка', 'Показать исходный предмет целиком на тёплом терракотовом фоне с арочной нишей. Слева оставить место для короткого подтверждённого названия.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком по центру или чуть правее; крупный светлый заголовок слева сверху, ниша и растение остаются фоном.","conditions":["Не переносить название и бренд демонстрационного дивана","Сохранять фактические пропорции и видимые детали исходного товара"],"fallbackComposition":"Товар целиком на терракотовом фоне; при отсутствии названия оставить левое поле чистым."}'::jsonb),
              ('tpl_home_accent_v02', 'tpl_home_accent', 2, 'Название и тип', 'Выделить подтверждённые название и тип предмета в двухуровневом заголовке, сохранив товар главным объектом.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Крупный товар справа; слева выразительный светлый заголовок и короткая строка с типом товара на матовой стене.","conditions":["Тип товара брать из описания или различимого исходного фото","Не заменять тип товара словом «диван» по reference"],"fallbackComposition":"Товар целиком справа; слева только подтверждённое название или чистое поле."}'::jsonb),
              ('tpl_home_accent_v03', 'tpl_home_accent', 3, 'Силуэт', 'Подчеркнуть подлинный силуэт предмета на фоне простой арки, без изменения ножек, ручек и других деталей.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком перед арочной нишей; мягкая тень отделяет его контур от стены, текст минимален и вынесен влево.","conditions":["Сохранять форму и число видимых частей товара","Не добавлять подушки, ножки или опоры с демонстрационного дивана"],"fallbackComposition":"Товар целиком на ровном терракотовом фоне без подписи о конструкции."}'::jsonb),
              ('tpl_home_accent_v04', 'tpl_home_accent', 4, 'Подтверждённое свойство', 'Добавить одну краткую подпись о свойстве, которое подтверждено описанием пользователя или видно на исходном фото.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком в центре; слева небольшой информационный блок под заголовком, свободные поля сохраняют интерьерный воздух.","conditions":["Не заимствовать свойства ткани, наполнителя, каркаса и ухода из reference","Не заявлять свойство по одному лишь декоративному свету"],"fallbackComposition":"Товар целиком; информационный блок опустить, оставить заголовок или чистый фон."}'::jsonb),
              ('tpl_home_accent_v05', 'tpl_home_accent', 5, 'Видимая деталь', 'Показать крупнее реально различимую деталь исходного предмета. Если участок неразличим, оставить товар целиком.', '{"schemaVersion":1,"framingMode":"detail","composition":"Одна видимая деталь справа крупным планом на фоне терракотовой стены; слева сдержанная подпись при наличии фактов.","conditions":["Не достраивать скрытую сторону или внутреннее устройство товара","Не переносить швы и ножки демонстрационного дивана на другой предмет"],"fallbackComposition":"Товар целиком в интерьере; крупный план и подпись о детали опустить."}'::jsonb),
              ('tpl_home_accent_v06', 'tpl_home_accent', 6, 'Материал и фактура', 'Показать фактуру исходного предмета, если её можно различить; материал подписывать только при подтверждении.', '{"schemaVersion":1,"framingMode":"detail","composition":"Крупный план видимой поверхности товара справа, тёплый свет подчёркивает реальную фактуру; подпись слева не перекрывает предмет.","conditions":["Не выводить состав материала только из внешнего вида или текстуры reference","Не превращать иной материал в обивочную ткань демонстрационного дивана"],"fallbackComposition":"Товар целиком на терракотовом фоне без заявления о материале."}'::jsonb),
              ('tpl_home_accent_v07', 'tpl_home_accent', 7, 'Цвет в интерьере', 'Показать реальный цвет товара рядом с тёплой стеной; терракотовая палитра действует только на окружение.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком на однотонном полу, арка позади; светлый заголовок занимает свободное поле слева.","conditions":["Не перекрашивать исходный товар под цвет дивана reference","Не объявлять терракотовый цвет доступным вариантом товара без подтверждения"],"fallbackComposition":"Товар целиком на спокойном фоне без цветовой подписи."}'::jsonb),
              ('tpl_home_accent_v08', 'tpl_home_accent', 8, 'Размер или конструкция', 'Разместить до двух подтверждённых сведений о размере или конструкции в нижнем ряду, если они известны.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком над нижним рядом из двух компактных подписей; крупный заголовок слева, арка остаётся ненавязчивым фоном.","conditions":["Каждую цифру и конструктивное свойство брать только из данных пользователя","Не копировать сведения о наполнителе и каркасе reference"],"fallbackComposition":"Товар целиком без нижних подписей и выдуманных пиктограмм."}'::jsonb),
              ('tpl_home_accent_v09', 'tpl_home_accent', 9, 'Маркировка', 'Сохранить видимый бренд и маркировку исходного предмета, если они читаемы; не восстанавливать скрытые или размытые символы.', '{"schemaVersion":1,"framingMode":"detail","composition":"Различимая маркировка товара показана крупнее справа, слева только подтверждённый заголовок на терракотовом фоне.","conditions":["Не подменять бренд пользователя демонстрационным логотипом","Не придумывать маркировку, которой не видно на исходном фото"],"fallbackComposition":"Товар целиком без увеличенной маркировки и без брендовой подписи."}'::jsonb),
              ('tpl_home_accent_v10', 'tpl_home_accent', 10, 'Итоговая карточка', 'Завершить серию цельной интерьерной карточкой с товаром, коротким названием и одним подтверждённым фактом при наличии данных.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком справа перед арочной нишей; слева крупное название, снизу один компактный фактический блок и широкие безопасные поля.","conditions":["Оставлять только достоверный текст о товаре пользователя","Не переносить слоган, бренд, свойства и пиктограммы с демонстрационной карточки"],"fallbackComposition":"Товар целиком в терракотовом интерьере; слева только подтверждённое название либо чистое поле."}'::jsonb)
              ON CONFLICT (id) DO UPDATE SET title=EXCLUDED.title, default_idea=EXCLUDED.default_idea,
              generation_recipe=EXCLUDED.generation_recipe
              WHERE template_card_variants.template_id='tpl_home_accent'
              AND template_card_variants.position=EXCLUDED.position;
