databaseChangeLog:
  - changeSet:
      id: 053-home-lifestyle-variants
      author: codex
      runInTransaction: true
      changes:
        - sql:
            splitStatements: false
            sql: |
              SET LOCAL standard_conforming_strings = on;
              INSERT INTO template_card_variants(id,template_id,position,title,default_idea,generation_recipe) VALUES
              ('tpl_home_lifestyle_v01', 'tpl_home_lifestyle', 1, 'Обложка', 'Показать товар для дома крупно на тёмной фактурной поверхности, с подтверждённым названием и короткими фактами.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком крупно по диагонали или в естественном ракурсе; светлый заголовок сверху, до двух коротких подтверждённых тезисов справа.","conditions":["Сохранить исходный ракурс, цвет и видимую маркировку товара","Не переносить демонстрационные утверждения и число 1 шт"],"fallbackComposition":"Товар целиком на тёмной домашней поверхности; только подтверждённое название без тезисов."}'::jsonb),
              ('tpl_home_lifestyle_v02', 'tpl_home_lifestyle', 2, 'Форма товара', 'Сделать узнаваемый силуэт товара главным элементом на тёмном фоне, оставив свободное место для названия.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком в центре с контрастным контуром на тёмной плоскости; название в свободной верхней зоне.","conditions":["Не растягивать и не перестраивать форму товара","Кухонный реквизит использовать только если он уместен для исходного товара"],"fallbackComposition":"Товар целиком на нейтральной тёмной поверхности, без декора и неподтверждённых надписей."}'::jsonb),
              ('tpl_home_lifestyle_v03', 'tpl_home_lifestyle', 3, 'Видимая деталь', 'Выделить деталь, которая хорошо видна на исходном фото; при недостатке данных показать товар целиком.', '{"schemaVersion":1,"framingMode":"detail","composition":"Крупный план ясно видимой детали товара на тёмном фактурном фоне; короткая подпись только при подтверждении.","conditions":["Деталь должна различаться на фото пользователя","Не выдумывать устройство или назначение детали"],"fallbackComposition":"Товар целиком в исходном ракурсе на тёмной поверхности, без подписи о детали."}'::jsonb),
              ('tpl_home_lifestyle_v04', 'tpl_home_lifestyle', 4, 'Фактура и материал', 'Показать действительно различимую фактуру товара; материал называть только при подтверждении.', '{"schemaVersion":1,"framingMode":"detail","composition":"Различимая поверхность товара крупно при мягком боковом свете, с тёмной фактурной плоскостью позади.","conditions":["Не угадывать материал или покрытие по блику","Не копировать металлический блеск демонстрационного ножа на другой товар"],"fallbackComposition":"Товар целиком на тёмной домашней поверхности; без утверждения о материале."}'::jsonb),
              ('tpl_home_lifestyle_v05', 'tpl_home_lifestyle', 5, 'Акцентный факт', 'Поместить один подтверждённый факт в контрастную плашку рядом с товаром; без факта убрать плашку.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком слева или по центру; сбоку небольшая красная плашка с одним проверенным фактом, над ней короткий заголовок.","conditions":["Количество 1 шт и свойства ножа из reference не переносить","Не добавлять цену, размер или комплект без данных пользователя"],"fallbackComposition":"Товар целиком на тёмной поверхности с одним подтверждённым названием, без плашки."}'::jsonb),
              ('tpl_home_lifestyle_v06', 'tpl_home_lifestyle', 6, 'Домашняя сцена', 'Показать товар в спокойной домашней среде; кухня и еда допустимы лишь когда они подходят товару.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком на тёмной домашней поверхности, с разреженным подходящим декором по краям и свободным полем для названия.","conditions":["Не помещать некухонный товар в пищевой контекст","Декор не должен восприниматься как часть комплекта"],"fallbackComposition":"Товар целиком на нейтральной тёмной домашней поверхности без салата, ножа и специй."}'::jsonb),
              ('tpl_home_lifestyle_v07', 'tpl_home_lifestyle', 7, 'Контраст и цвет', 'Подчеркнуть подлинный цвет товара на глубоком тёмном фоне без выдуманных вариантов расцветки.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком в центре на тёмной поверхности; мягкий свет отделяет его от фона, а зелёный декор остаётся вторичным.","conditions":["Не перекрашивать исходный товар под палитру reference","Не объявлять другие цвета товара доступными"],"fallbackComposition":"Товар целиком в своём исходном цвете на простой тёмной поверхности."}'::jsonb),
              ('tpl_home_lifestyle_v08', 'tpl_home_lifestyle', 8, 'Маркировка', 'Аккуратно показать видимую маркировку товара; если она неразборчива, оставить общий план без выдуманного текста.', '{"schemaVersion":1,"framingMode":"detail","composition":"Различимая надпись или логотип на исходном товаре крупно, с мягким светом и простым тёмным окружением.","conditions":["Воспроизводить только читаемую маркировку исходного фото","Не переносить надписи и символы демонстрационной карточки"],"fallbackComposition":"Товар целиком без добавленной маркировки на корпусе или упаковке."}'::jsonb),
              ('tpl_home_lifestyle_v09', 'tpl_home_lifestyle', 9, 'Простая композиция', 'Свести оформление к товару, тёмной поверхности и одному проверенному заголовку.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком крупно на тёмной фактурной плоскости; сверху короткий светлый заголовок, декор сведён к минимуму.","conditions":["Не добавлять посторонние товары ради заполнения кадра","Сохранить поля вокруг товара и текста"],"fallbackComposition":"Товар целиком на ровном тёмном фоне, без декоративных предметов и текста без подтверждения."}'::jsonb),
              ('tpl_home_lifestyle_v10', 'tpl_home_lifestyle', 10, 'Итоговая карточка', 'Завершить серию товаром крупно, названием и максимум двумя подтверждёнными тезисами в тёмной домашней композиции.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком в центре или по диагонали; сверху крупное светлое название, справа до двух коротких проверенных тезисов.","conditions":["Не переносить остроту, удобство ручки или количество с демонстрационного ножа","Если фактов нет, не заменять их общими обещаниями"],"fallbackComposition":"Товар целиком на тёмной поверхности с подтверждённым названием; остальные блоки убрать."}'::jsonb)
              ON CONFLICT (id) DO UPDATE SET title=EXCLUDED.title, default_idea=EXCLUDED.default_idea,
              generation_recipe=EXCLUDED.generation_recipe
              WHERE template_card_variants.template_id='tpl_home_lifestyle'
              AND template_card_variants.position=EXCLUDED.position;
