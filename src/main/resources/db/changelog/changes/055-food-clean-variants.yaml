databaseChangeLog:
  - changeSet:
      id: 055-food-clean-variants
      author: codex
      runInTransaction: true
      changes:
        - sql:
            splitStatements: false
            sql: |
              SET LOCAL standard_conforming_strings = on;
              INSERT INTO template_card_variants(id,template_id,position,title,default_idea,generation_recipe) VALUES
              ('tpl_food_hero_v01', 'tpl_food_hero', 1, 'Обложка', 'Показать исходный продукт крупно на трёх пастельных диагональных полях. Несколько разных упаковок размещать только при подтверждённых вариантах товара.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Исходный продукт целиком под лёгким наклоном в центре; три широкие диагональные зоны кремового, голубого и пудрового цвета, свободные края и короткое достоверное название.","conditions":["Показывать разные варианты лишь при подтверждённом ассортименте и материалах для каждого","Не копировать демонстрационные батончики и их надписи"],"fallbackComposition":"Один исходный продукт целиком по центру на пастельном диагональном фоне; неподтверждённые варианты и подписи опустить."}'::jsonb),
              ('tpl_food_hero_v02', 'tpl_food_hero', 2, 'Название продукта', 'Выделить подтверждённое название продукта и показать упаковку целиком на светлом фоне с одним цветовым акцентом.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Продукт целиком диагонально в нижних двух третях; сверху свободное кремовое поле с названием, голубая узкая зона отделяет текст от предмета.","conditions":["Название брать из описания или читаемой упаковки","Не заменять реальную маркировку выдуманным брендом"],"fallbackComposition":"Продукт целиком на чистом кремовом фоне; без отдельного заголовка, если название не подтверждено."}'::jsonb),
              ('tpl_food_hero_v03', 'tpl_food_hero', 3, 'Форма и упаковка', 'Показать реальную форму и тип упаковки, сохраняя её пропорции, цвет и видимую этикетку.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Один продукт целиком крупно по диагонали на голубом поле; кремовый и пудровый углы дают чистый контраст, короткая подпись сбоку описывает только видимую форму.","conditions":["Не менять геометрию и материал видимой упаковки","Не добавлять вторую упаковку или открытое содержимое без исходных данных"],"fallbackComposition":"Продукт целиком на светлом фоне без подписи о форме, если она неоднозначна."}'::jsonb),
              ('tpl_food_hero_v04', 'tpl_food_hero', 4, 'Читаемая этикетка', 'При читаемой этикетке показать её действительный фрагмент крупнее и сохранить оригинальные буквы. Иначе использовать общий вид упаковки.', '{"schemaVersion":1,"framingMode":"detail","composition":"Различимая область этикетки крупно в центральной кремовой зоне; мягкая диагональная голубая кромка и спокойное свободное поле для короткого подтверждённого заголовка.","conditions":["Увеличивать только участок с читаемой маркировкой на исходном фото","Не достраивать мелкий текст, бренд, состав или знаки сертификации"],"fallbackComposition":"Показать упаковку целиком по центру; нечитаемую этикетку не увеличивать и не расшифровывать."}'::jsonb),
              ('tpl_food_hero_v05', 'tpl_food_hero', 5, 'Видимая фактура', 'Если продукт открыт и его фактура отчётливо видна на исходном фото, показать её в мягком крупном плане. Закрытую упаковку не вскрывать в изображении.', '{"schemaVersion":1,"framingMode":"detail","composition":"Реально видимая фактура еды крупно справа на кремово-пудровом фоне; слева короткая подпись и много воздуха, без выдуманного разреза упаковки.","conditions":["Фактура должна быть различима на исходном снимке","Не создавать отсутствующий разрез, начинку или сервировку"],"fallbackComposition":"Закрытый продукт целиком на пастельном фоне без утверждений о внутренней фактуре."}'::jsonb),
              ('tpl_food_hero_v06', 'tpl_food_hero', 6, 'Состав и ингредиент', 'Подчеркнуть один подтверждённый ингредиент, если он указан в описании или читаемой маркировке. Не переносить ягоды и орехи из образца.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Продукт целиком на переднем плане кремовой зоны; один небольшой подтверждённый пищевой акцент и короткая подпись сбоку, голубая и пудровая диагонали остаются фоном.","conditions":["Ингредиент и его связь с продуктом должны быть подтверждены","Не выводить полный состав по одному декоративному ингредиенту"],"fallbackComposition":"Один продукт целиком на чистом пастельном фоне, без пищевого реквизита и подписи о составе."}'::jsonb),
              ('tpl_food_hero_v07', 'tpl_food_hero', 7, 'Вкус или вариант', 'Показать подтверждённый вкус или реальный вариант продукта. Несколько вкусов размещать вместе только при наличии сведений о каждом.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Подтверждённые варианты в отдельных пастельных диагональных полосах, с читаемой собственной упаковкой и коротким точным названием каждого; при одном варианте оставить одну крупную упаковку.","conditions":["Не менять цвет и текст упаковки ради имитации другого вкуса","Несколько вариантов допустимы только при подтверждённых фото и описании каждого"],"fallbackComposition":"Один исходный продукт целиком на трёх декоративных диагоналях без списка вкусов."}'::jsonb),
              ('tpl_food_hero_v08', 'tpl_food_hero', 8, 'Формат и количество', 'Показать формат упаковки и подтверждённый вес или объём, если они известны. Не превращать повторение предмета в недостоверную комплектацию.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Один продукт целиком в центре голубого поля; узкая кремовая плашка с подтверждённым весом, объёмом или количеством и пудровый угол без дополнительных предметов.","conditions":["Число, единицу и комплектацию брать только из подтверждённого описания или этикетки","Не добавлять цену, калорийность или размер порции без данных"],"fallbackComposition":"Продукт целиком на голубом и кремовом фоне; числовую плашку опустить."}'::jsonb),
              ('tpl_food_hero_v09', 'tpl_food_hero', 9, 'Подача', 'Добавить минимальную предметную подачу, если вид продукта и подтверждённый способ использования это позволяют. Сохранять сам товар главным объектом.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Исходный продукт целиком на пастельной поверхности; один уместный нейтральный предмет для масштаба или подачи у края, короткая фактическая подпись в свободной зоне.","conditions":["Не показывать готовое блюдо, смешивание или способ употребления без оснований","Реквизит не должен казаться частью комплекта"],"fallbackComposition":"Товар целиком на чистом пастельном фоне без сервировки и без неподтверждённой подписи."}'::jsonb),
              ('tpl_food_hero_v10', 'tpl_food_hero', 10, 'Итоговая карточка', 'Завершить серию светлой карточкой с продуктом целиком, достоверным названием и одной короткой подтверждённой особенностью.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Один продукт целиком под лёгким наклоном по центру; три спокойные диагональные пастельные зоны, название сверху и одна компактная фактическая подпись снизу с полями от краёв.","conditions":["Особенность писать только по подтверждённому описанию или читаемой маркировке","Не переносить обещания пользы, отсутствия сахара или выдуманные вкусы"],"fallbackComposition":"Один продукт целиком на пастельных диагоналях и нейтральное достоверное название; дополнительную подпись опустить."}'::jsonb)
              ON CONFLICT (id) DO UPDATE SET title=EXCLUDED.title, default_idea=EXCLUDED.default_idea,
              generation_recipe=EXCLUDED.generation_recipe
              WHERE template_card_variants.template_id='tpl_food_hero'
              AND template_card_variants.position=EXCLUDED.position;
