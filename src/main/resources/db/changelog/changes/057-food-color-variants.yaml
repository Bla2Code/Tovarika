databaseChangeLog:
  - changeSet:
      id: 057-food-color-variants
      author: codex
      runInTransaction: true
      changes:
        - sql:
            splitStatements: false
            sql: |
              SET LOCAL standard_conforming_strings = on;
              INSERT INTO template_card_variants(id,template_id,position,title,default_idea,generation_recipe) VALUES
              ('tpl_food_accent_v01', 'tpl_food_accent', 1, 'Обложка', 'Показать товар целиком по центру на ярком красном фоне. Наверху разместить короткое подтверждённое название крупным белым шрифтом.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком по центру на красном фоне; крупный белый заголовок в верхней трети, небольшие капли обрамляют упаковку, не перекрывая этикетку.","conditions":["Название брать только из описания или читаемой упаковки","Не повторять название и бренд демонстрационного джема"],"fallbackComposition":"Товар целиком по центру на красном фоне; верхнее поле оставить пустым, если название не подтверждено."}'::jsonb),
              ('tpl_food_accent_v02', 'tpl_food_accent', 2, 'Название и категория', 'Крупно показать подтверждённое название и тип товара в верхнем блоке, упаковку оставить целиком видимой ниже.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Двухуровневый белый заголовок над центральной упаковкой: название крупно, тип продукта меньшей строкой; динамичные капли только по краям.","conditions":["Тип продукта должен следовать из описания или этикетки","Не подменять категорию товара словом «джем» из reference"],"fallbackComposition":"Упаковка целиком в центре; оставить только подтверждённое название либо чистое верхнее поле."}'::jsonb),
              ('tpl_food_accent_v03', 'tpl_food_accent', 3, 'Упаковка и маркировка', 'Показать реальную упаковку и читаемую маркировку исходного товара крупно, не меняя форму и цвет этикетки.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Упаковка целиком крупно в центре, этикетка обращена к зрителю как на исходном фото; короткий заголовок сверху не перекрывает маркировку.","conditions":["Сохранять только действительно видимую маркировку","Не дорисовывать невидимую сторону банки, пакета или бутылки"],"fallbackComposition":"Товар целиком в исходном доступном ракурсе на красном фоне; нечитаемую маркировку не восстанавливать."}'::jsonb),
              ('tpl_food_accent_v04', 'tpl_food_accent', 4, 'Подтверждённое свойство', 'Выделить одно доказанное свойство продукта белой подписью возле упаковки. Если данных нет, оставить чистую композицию.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Упаковка целиком в центре; одна небольшая белая подпись с подтверждённым свойством в свободном нижнем поле.","conditions":["Не копировать обещание «без сахара» и калорийность reference","Не выводить свойства состава по одному цвету продукта или фона"],"fallbackComposition":"Товар целиком на красном фоне без блока свойства."}'::jsonb),
              ('tpl_food_accent_v05', 'tpl_food_accent', 5, 'Видимая деталь', 'Показать крупнее действительно различимую деталь упаковки или продукта. При недостаточной чёткости оставить товар целиком.', '{"schemaVersion":1,"framingMode":"detail","composition":"Крупный план одной видимой детали исходного товара в центре; красные капли и короткая белая подпись остаются по краям.","conditions":["Выбирать только чётко видимый участок исходного фото","Не копировать крышку, ягоды или этикетку демонстрационного джема"],"fallbackComposition":"Товар целиком по центру без крупного плана и подписи о детали."}'::jsonb),
              ('tpl_food_accent_v06', 'tpl_food_accent', 6, 'Вкус или ингредиент', 'Показать подтверждённый вкус или ингредиент рядом с товаром; при отсутствии сведений использовать лишь абстрактные цветовые акценты.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком по центру; один подтверждённый ингредиент или вкус представлен небольшим визуальным акцентом сбоку и короткой подписью.","conditions":["Пищевой элемент должен быть явно указан на товаре или в описании","Не добавлять клубнику только потому, что она есть в reference"],"fallbackComposition":"Товар целиком на насыщенном фоне с абстрактными каплями, без ингредиентов и подписи о вкусе."}'::jsonb),
              ('tpl_food_accent_v07', 'tpl_food_accent', 7, 'Количество или объём', 'Вынести подтверждённую массу, объём или количество в компактную плашку; не добавлять цифры, которых нет в данных.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком в центре; небольшая контрастная плашка с подтверждённой величиной в нижнем углу, крупный заголовок сверху.","conditions":["Число и единицу измерения брать только из описания или читаемой упаковки","Не переносить «250 г» или «20 kcal» из reference"],"fallbackComposition":"Товар целиком на красном фоне без числовой плашки."}'::jsonb),
              ('tpl_food_accent_v08', 'tpl_food_accent', 8, 'Фактура содержимого', 'Показать фактуру продукта, только если содержимое действительно видно на исходном фото; иначе показать упаковку целиком.', '{"schemaVersion":1,"framingMode":"detail","composition":"Видимое содержимое или поверхность продукта крупным планом на красном фоне; короткая подпись в безопасном свободном поле.","conditions":["Не придумывать цвет и консистенцию скрытого содержимого","Не заимствовать фактуру клубничного джема из reference"],"fallbackComposition":"Исходная упаковка целиком на красном фоне без вида содержимого и без фактурного описания."}'::jsonb),
              ('tpl_food_accent_v09', 'tpl_food_accent', 9, 'Короткая инфографика', 'Собрать до двух подтверждённых фактов о товаре в короткие белые подписи вокруг центральной упаковки.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком по центру; сверху крупное название, по бокам не более двух маленьких белых фактических подписей с широкими полями.","conditions":["Каждая подпись должна иметь опору в описании или читаемой этикетке","Не использовать демонстрационные заявления о сахаре, калориях и массе"],"fallbackComposition":"Товар целиком на красном фоне; оставить только подтверждённое название или вовсе убрать подписи."}'::jsonb),
              ('tpl_food_accent_v10', 'tpl_food_accent', 10, 'Итоговая карточка', 'Завершить серию яркой карточкой с товаром целиком, подтверждённым названием и одним достоверным фактом, если он известен.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком в центре красной студийной сцены; сверху крупный белый заголовок, снизу одна короткая фактическая строка, по краям декоративные капли.","conditions":["Надписи переписывать только по данным пользователя","Не переносить демонстрационный бренд, клубнику, цифры и рекламные обещания"],"fallbackComposition":"Товар целиком на ярком фоне; оставить лишь подтверждённое название либо чистые поля."}'::jsonb)
              ON CONFLICT (id) DO UPDATE SET title=EXCLUDED.title, default_idea=EXCLUDED.default_idea,
              generation_recipe=EXCLUDED.generation_recipe
              WHERE template_card_variants.template_id='tpl_food_accent'
              AND template_card_variants.position=EXCLUDED.position;
