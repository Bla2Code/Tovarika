databaseChangeLog:
  - changeSet:
      id: 059-kitchen-scene-variants
      author: codex
      runInTransaction: true
      changes:
        - sql:
            splitStatements: false
            sql: |
              SET LOCAL standard_conforming_strings = on;
              INSERT INTO template_card_variants(id,template_id,position,title,default_idea,generation_recipe) VALUES
              ('tpl_food_lifestyle_v01', 'tpl_food_lifestyle', 1, 'Обложка', 'Показать продукт целиком на тёплом деревянном столе с крупным названием и одной подтверждённой особенностью.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком крупно в нижней половине кадра; сверху широкий кремовый заголовок, сбоку компактная жёлтая плашка с проверенным фактом.","conditions":["Сохранить реальную упаковку и маркировку исходного товара","Не использовать сосиски и свойства решётки как сведения о товаре"],"fallbackComposition":"Товар целиком на древесной плоскости; только подтверждённое название, без плашки."}'::jsonb),
              ('tpl_food_lifestyle_v02', 'tpl_food_lifestyle', 2, 'Форма и упаковка', 'Сделать узнаваемый силуэт и настоящую упаковку продукта главным элементом сцены.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком по диагонали или в исходном ракурсе на тёмной древесине; свободная верхняя зона для короткого названия.","conditions":["Не менять геометрию, цвет и тип упаковки","Не добавлять решётку или инвентарь как часть товара"],"fallbackComposition":"Товар целиком в исходном виде на ровной тёмной кухонной поверхности."}'::jsonb),
              ('tpl_food_lifestyle_v03', 'tpl_food_lifestyle', 3, 'Видимая фактура', 'Показать различимую на исходном фото фактуру продукта; при её отсутствии оставить общий план.', '{"schemaVersion":1,"framingMode":"detail","composition":"Крупный план видимой поверхности продукта с тёплым боковым светом; краткая подпись только при подтверждении.","conditions":["Использовать только различимую фактуру исходного фото","Не выдумывать состав, вкус или способ приготовления по внешнему виду"],"fallbackComposition":"Товар целиком на тёмном деревянном столе без утверждения о фактуре."}'::jsonb),
              ('tpl_food_lifestyle_v04', 'tpl_food_lifestyle', 4, 'Маркировка', 'Подчеркнуть читаемое название или маркировку на упаковке без добавления чужих надписей.', '{"schemaVersion":1,"framingMode":"detail","composition":"Крупно показать видимую этикетку или надпись на исходном товаре; вокруг тёплая древесная фактура и мягкая тень.","conditions":["Воспроизводить только читаемые знаки с фотографии пользователя","Не копировать текст, пиктограммы и слоганы референса"],"fallbackComposition":"Товар целиком с неизменённой упаковкой; без придуманной маркировки."}'::jsonb),
              ('tpl_food_lifestyle_v05', 'tpl_food_lifestyle', 5, 'Подача', 'Показать продукт в уместной пищевой подаче, если его вид и описание дают для этого основание.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком на деревянном столе; по краям немного уместной посуды или зелени, затемнённый фон и свободное поле для названия.","conditions":["Не превращать упакованный товар в новый неподтверждённый вид блюда","Реквизит не должен выглядеть вложением в товар"],"fallbackComposition":"Товар целиком на чистом деревянном столе без сервировки."}'::jsonb),
              ('tpl_food_lifestyle_v06', 'tpl_food_lifestyle', 6, 'Кухонная атмосфера', 'Создать тёплую кухонную сцену вокруг товара без навязанного гриля или способа приготовления.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком впереди на грубой деревянной плоскости; дальний план мягко затемнён, тёплый свет добавляет глубину.","conditions":["Огонь и мангал допустимы только при подтверждённой связи товара с грилем","Не добавлять еду или инвентарь как часть комплекта"],"fallbackComposition":"Товар целиком на тёмном кухонном столе с тёплым светом без огня и дополнительных продуктов."}'::jsonb),
              ('tpl_food_lifestyle_v07', 'tpl_food_lifestyle', 7, 'Проверенный факт', 'Выделить один достоверный факт о продукте в жёлтой плашке; без факта оставить плашку пустой от обещаний.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком по центру; сверху кремовый заголовок, справа жёлтая плашка с одним коротким подтверждённым фактом.","conditions":["Не переносить антипригарность, фиксацию и назначение решётки","Не добавлять цену, массу или пищевую ценность без данных"],"fallbackComposition":"Товар целиком и проверенное название на древесном фоне; плашку убрать."}'::jsonb),
              ('tpl_food_lifestyle_v08', 'tpl_food_lifestyle', 8, 'Два тезиса', 'Разместить до двух подтверждённых свойств в полупрозрачном тёмном блоке рядом с продуктом.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком слева или по центру; справа компактная тёмная полупрозрачная карточка с максимум двумя короткими фактами.","conditions":["Каждый тезис должен подтверждаться описанием или исходной упаковкой","Не использовать значки огня и цепи как доказательство свойств"],"fallbackComposition":"Товар целиком на деревянной поверхности с одним подтверждённым заголовком, без блока фактов."}'::jsonb),
              ('tpl_food_lifestyle_v09', 'tpl_food_lifestyle', 9, 'Чистый кадр', 'Оставить товар, древесную фактуру и свет без лишнего реквизита, сохранив узнаваемое настроение сцены.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком крупно на деревянном столе; тёплое пятно света, тёмный фон и короткий светлый заголовок.","conditions":["Не перекрашивать продукт под тёплую палитру","Не заполнять пустоты выдуманными ингредиентами или продуктами"],"fallbackComposition":"Товар целиком на нейтральной тёмной плоскости без декоративных элементов и неподтверждённого текста."}'::jsonb),
              ('tpl_food_lifestyle_v10', 'tpl_food_lifestyle', 10, 'Итоговая карточка', 'Завершить серию крупным продуктом, названием и только подтверждёнными короткими тезисами.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком в центре или по диагонали на тёмной древесине; крупный кремовый заголовок сверху и до двух фактов сбоку.","conditions":["Сохранить исходный цвет, упаковку и читаемую маркировку","Не переносить текст и назначение демонстрационной решётки"],"fallbackComposition":"Товар целиком в тёплой кухонной сцене с проверенным названием; остальные текстовые блоки убрать."}'::jsonb)
              ON CONFLICT (id) DO UPDATE SET title=EXCLUDED.title, default_idea=EXCLUDED.default_idea,
              generation_recipe=EXCLUDED.generation_recipe
              WHERE template_card_variants.template_id='tpl_food_lifestyle'
              AND template_card_variants.position=EXCLUDED.position;
