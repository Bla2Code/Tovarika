databaseChangeLog:
  - changeSet:
      id: 061-kids-clean-variants
      author: codex
      runInTransaction: true
      changes:
        - sql:
            splitStatements: false
            sql: |
              SET LOCAL standard_conforming_strings = on;
              INSERT INTO template_card_variants(id,template_id,position,title,default_idea,generation_recipe) VALUES
              ('tpl_kids_hero_v01', 'tpl_kids_hero', 1, 'Обложка', 'Показать исходный детский товар целиком на тёплом бежевом фоне. Сохранить спокойную предметную композицию и свободное поле.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Один исходный товар целиком по центру или слегка ниже центра на однотонной бежевой поверхности; сверху много воздуха для короткого подтверждённого названия.","conditions":["Не подменять товар демонстрационными флаконами или игрушкой","Дополнительный предмет допустим только как явно отделённый нейтральный реквизит"],"fallbackComposition":"Один исходный товар целиком на чистом бежевом фоне без реквизита и неподтверждённых надписей."}'::jsonb),
              ('tpl_kids_hero_v02', 'tpl_kids_hero', 2, 'Название товара', 'Выделить подтверждённое название товара, оставив сам товар главным объектом карточки.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком в нижних двух третях кадра; в чистой верхней зоне небольшое хорошо читаемое название, мягкая тень под предметом.","conditions":["Название брать только из описания или читаемой маркировки","Не переносить бренд и слова с демонстрационной упаковки"],"fallbackComposition":"Товар целиком по центру на светлом фоне без отдельного заголовка."}'::jsonb),
              ('tpl_kids_hero_v03', 'tpl_kids_hero', 3, 'Форма и вид', 'Показать реальную форму и внешний вид товара без изменения его деталей и пропорций.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Один товар целиком крупно в центре на ровном кремово-бежевом фоне; сбоку свободное место для короткой подписи о видимой особенности.","conditions":["Не менять геометрию, материал и цвета исходного товара","Подпись должна описывать только видимый или подтверждённый признак"],"fallbackComposition":"Товар целиком на бежевом фоне без подписи о спорной детали."}'::jsonb),
              ('tpl_kids_hero_v04', 'tpl_kids_hero', 4, 'Видимая деталь', 'Показать действительно различимую деталь исходного товара крупнее. Если детали не видно, сохранить общий план.', '{"schemaVersion":1,"framingMode":"detail","composition":"Различимый участок товара крупно в центральной зоне; светлый бежевый фон и короткая фактическая подпись в свободной верхней части.","conditions":["Увеличивать только существующий различимый участок исходного фото","Не дорисовывать текстуру, крепления, швы или маркировку"],"fallbackComposition":"Показать товар целиком с мягкой тенью; не имитировать невидимую деталь."}'::jsonb),
              ('tpl_kids_hero_v05', 'tpl_kids_hero', 5, 'Маркировка', 'Если маркировка читаема, показать её без искажений; иначе сосредоточиться на общем виде товара.', '{"schemaVersion":1,"framingMode":"detail","composition":"Читаемая часть реальной этикетки или маркировки крупно на фоне с тёплым светом; оставить поля вокруг текста и один спокойный заголовок при наличии данных.","conditions":["Не восстанавливать нечитаемые мелкие буквы","Не добавлять возрастную отметку, состав или знак безопасности без подтверждения"],"fallbackComposition":"Один товар целиком без увеличения этикетки и без расшифровки нечитаемого текста."}'::jsonb),
              ('tpl_kids_hero_v06', 'tpl_kids_hero', 6, 'Комплектация', 'Показать подтверждённый набор предметов, если товар продаётся комплектом. Иначе показать один исходный товар.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Подтверждённые части комплекта разложены с равными интервалами на бежевой поверхности; короткие фактические подписи рядом, много воздуха вокруг.","conditions":["Каждая часть должна подтверждаться исходными материалами","Не включать демонстрационные флаконы, полотенце или зайца как часть комплекта"],"fallbackComposition":"Один исходный товар целиком в центре без списка комплектации."}'::jsonb),
              ('tpl_kids_hero_v07', 'tpl_kids_hero', 7, 'Материал или состав', 'Добавить краткую подпись о материале или составе лишь при прямом подтверждении в данных товара.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком в центре на светлом фоне; одна маленькая кремовая плашка сбоку для подтверждённого материала или состава.","conditions":["Не выводить состав по виду или цвету изделия","Не заимствовать характеристики демонстрационных флаконов"],"fallbackComposition":"Товар целиком без плашки о составе или материале."}'::jsonb),
              ('tpl_kids_hero_v08', 'tpl_kids_hero', 8, 'Размер или возраст', 'Показать подтверждённый размер или возрастное назначение, если эти данные указаны пользователем или на товаре.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком на мягком бежевом фоне; небольшая округлая текстовая плашка в свободной зоне без перекрытия товара.","conditions":["Числа и возрастные границы брать только из подтверждённых данных","Не делать вывод о безопасности или пригодности для младенцев по стилю reference"],"fallbackComposition":"Товар целиком на светлом фоне без числовой или возрастной плашки."}'::jsonb),
              ('tpl_kids_hero_v09', 'tpl_kids_hero', 9, 'Спокойная сцена', 'Показать товар в мягкой детской атмосфере с нейтральным реквизитом, только если он не создаёт ложного впечатления о комплекте.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком на тёплой бежевой поверхности; сзади размытый нейтральный мягкий предмет, заметно отделённый от товара, и много свободного фона.","conditions":["Реквизит не должен скрывать товар или выглядеть частью продажи","Не показывать ребёнка или сценарий использования без исходных материалов"],"fallbackComposition":"Один товар целиком на чистом бежевом фоне без дополнительного реквизита."}'::jsonb),
              ('tpl_kids_hero_v10', 'tpl_kids_hero', 10, 'Итоговая карточка', 'Завершить серию чистой карточкой с исходным товаром, достоверным названием и одной подтверждённой особенностью.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Один товар целиком по центру на тёплом бежевом фоне; короткое название сверху и одна лаконичная фактическая подпись сбоку или снизу.","conditions":["Название и особенность подтверждены описанием или читаемой маркировкой","Не добавлять выдуманные обещания, возраст, состав или назначение"],"fallbackComposition":"Один исходный товар целиком с достоверным названием при его наличии; неподтверждённую подпись опустить."}'::jsonb)
              ON CONFLICT (id) DO UPDATE SET title=EXCLUDED.title, default_idea=EXCLUDED.default_idea,
              generation_recipe=EXCLUDED.generation_recipe
              WHERE template_card_variants.template_id='tpl_kids_hero'
              AND template_card_variants.position=EXCLUDED.position;
