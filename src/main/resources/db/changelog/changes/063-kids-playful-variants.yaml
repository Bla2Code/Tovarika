databaseChangeLog:
  - changeSet:
      id: 063-kids-playful-variants
      author: codex
      runInTransaction: true
      changes:
        - sql:
            splitStatements: false
            sql: |
              SET LOCAL standard_conforming_strings = on;
              INSERT INTO template_card_variants(id,template_id,position,title,default_idea,generation_recipe) VALUES
              ('tpl_kids_accent_v01', 'tpl_kids_accent', 1, 'Обложка', 'Показать товар целиком в центре бирюзовой сцены. Крупным округлым шрифтом написать только подтверждённое название.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком в центре; за ним свободный бирюзовый фон, сверху и по бокам крупный бело-жёлтый заголовок, облака далеко от контура товара.","conditions":["Название брать только из описания или читаемой маркировки","Ребёнка, телефон и другие игрушки не переносить из reference"],"fallbackComposition":"Товар целиком по центру на бирюзовом фоне; при отсутствии названия оставить верхнее поле чистым."}'::jsonb),
              ('tpl_kids_accent_v02', 'tpl_kids_accent', 2, 'Название и категория', 'Крупно показать подтверждённое название и тип товара, оставив сам товар целиком видимым.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком в нижних двух третях; сверху две строки округлой типографики: крупное название и меньшая категория, если она известна.","conditions":["Тип товара должен следовать из фото или описания","Не подменять его демонстрационной игрушкой из reference"],"fallbackComposition":"Товар целиком на бирюзовом фоне; оставить подтверждённое название либо чистую верхнюю область."}'::jsonb),
              ('tpl_kids_accent_v03', 'tpl_kids_accent', 3, 'Форма товара', 'Показать форму и реальные цвета товара целиком, добавив лишь лёгкие оранжевые и облачные акценты.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Один исходный товар крупно и целиком по центру; небольшие белые облака и оранжевые штрихи обрамляют его, не закрывая детали.","conditions":["Не менять геометрию или окраску товара ради палитры reference","Не добавлять второй экземпляр или несуществующие аксессуары"],"fallbackComposition":"Товар целиком на чистом бирюзовом фоне без дополнительных предметов."}'::jsonb),
              ('tpl_kids_accent_v04', 'tpl_kids_accent', 4, 'Подтверждённое свойство', 'Выделить одно подтверждённое свойство короткой белой подписью. Если сведения отсутствуют, оставить композицию без плашки.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком по центру; в свободном углу округлая оранжевая плашка с одним подтверждённым свойством.","conditions":["Свойство брать только из описания или видимой маркировки","Не выдумывать пользу, безопасность или особенности использования"],"fallbackComposition":"Товар целиком в яркой сцене без фактической плашки."}'::jsonb),
              ('tpl_kids_accent_v05', 'tpl_kids_accent', 5, 'Видимая деталь', 'Крупно показать различимую деталь исходного товара; если фото не позволяет, сохранить общий вид целиком.', '{"schemaVersion":1,"framingMode":"detail","composition":"Различимый участок исходного товара крупным планом по центру; короткий заголовок в свободной верхней области, облака по краям.","conditions":["Показывать только действительно видимую деталь","Не дорисовывать механизм, фактуру, маркировку или невидимый ракурс"],"fallbackComposition":"Товар целиком по центру на бирюзовом фоне без утверждения о детали."}'::jsonb),
              ('tpl_kids_accent_v06', 'tpl_kids_accent', 6, 'Возрастная маркировка', 'Показать возрастную маркировку в компактной плашке только при точном подтверждении; иначе оставить декоративный акцент без цифр.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком по центру; небольшой оранжевый круг с подтверждённой возрастной маркировкой сбоку, белый заголовок сверху.","conditions":["Возраст указывать лишь если он явно дан в описании или виден на товаре","Не выводить возраст по внешнему виду ребёнка на reference"],"fallbackComposition":"Товар целиком на бирюзовом фоне с абстрактным оранжевым кругом без цифр и возрастных слов."}'::jsonb),
              ('tpl_kids_accent_v07', 'tpl_kids_accent', 7, 'Комплектация', 'Коротко перечислить подтверждённую комплектацию, не добавляя предметы, которых нет в данных.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Исходный товар целиком в центре; внизу округлая белая плашка с кратким подтверждённым составом комплекта.","conditions":["Состав комплекта должен быть явно указан или видим","Не заимствовать телефон, кубики, мяч и собаку из reference"],"fallbackComposition":"Товар целиком по центру; нижнюю плашку опустить, не добавляя других предметов."}'::jsonb),
              ('tpl_kids_accent_v08', 'tpl_kids_accent', 8, 'Видимая маркировка', 'Сделать видимую этикетку или логотип исходного товара заметнее, сохранив реальные буквы и цвета.', '{"schemaVersion":1,"framingMode":"detail","composition":"Чётко различимая маркировка исходного товара в центре крупного плана; мягкие облака и короткая подтверждённая подпись по свободным краям.","conditions":["Показывать только читаемую на исходном фото маркировку","Не переносить надписи или язык демонстрационного reference"],"fallbackComposition":"Товар целиком в исходном ракурсе, без восстановления нечитаемых букв и без подписи о маркировке."}'::jsonb),
              ('tpl_kids_accent_v09', 'tpl_kids_accent', 9, 'Два факта', 'Разместить до двух коротких подтверждённых фактов рядом с товаром; при нехватке данных использовать меньше подписей.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком в центре; две небольшие белые и оранжевые округлые плашки по сторонам, облака остаются на заднем плане.","conditions":["Каждая подпись опирается на описание или видимый текст товара","Не придумывать размеры, материалы, сертификаты или преимущества"],"fallbackComposition":"Товар целиком на бирюзовом фоне с одной подтверждённой подписью или без подписей."}'::jsonb),
              ('tpl_kids_accent_v10', 'tpl_kids_accent', 10, 'Итоговая карточка', 'Завершить серию яркой карточкой с товаром целиком, достоверным названием и одним фактом при наличии данных.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком в центре бирюзовой сцены; крупный округлый заголовок сверху, короткая фактическая плашка снизу, белые облака по углам.","conditions":["Заголовок и плашку переписывать на языке описания товара","Не переносить португальский текст, ребёнка или дополнительные игрушки из reference"],"fallbackComposition":"Товар целиком на бирюзовом фоне; оставить только подтверждённое название либо чистые поля."}'::jsonb)
              ON CONFLICT (id) DO UPDATE SET title=EXCLUDED.title, default_idea=EXCLUDED.default_idea,
              generation_recipe=EXCLUDED.generation_recipe
              WHERE template_card_variants.template_id='tpl_kids_accent'
              AND template_card_variants.position=EXCLUDED.position;
