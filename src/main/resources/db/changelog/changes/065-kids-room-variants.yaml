databaseChangeLog:
  - changeSet:
      id: 065-kids-room-variants
      author: codex
      runInTransaction: true
      changes:
        - sql:
            splitStatements: false
            sql: |
              SET LOCAL standard_conforming_strings = on;
              INSERT INTO template_card_variants(id,template_id,position,title,default_idea,generation_recipe) VALUES
              ('tpl_kids_lifestyle_v01', 'tpl_kids_lifestyle', 1, 'Обложка', 'Показать детский товар целиком в светлой комнате с крупным названием и одним подтверждённым фактом.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком крупно в центре светлой комнаты; большой голубой заголовок позади и округлая плашка с проверенным фактом сбоку.","conditions":["Не скрывать товар ребёнком или декором","Не переносить свойства и возраст демонстрационного стула"],"fallbackComposition":"Товар целиком на светлом домашнем фоне с подтверждённым названием, без плашки."}'::jsonb),
              ('tpl_kids_lifestyle_v02', 'tpl_kids_lifestyle', 2, 'Форма товара', 'Сделать настоящую форму и цвет товара главными в спокойной комнатной сцене.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком в исходном ракурсе на чистом светлом фоне комнаты; короткий заголовок сверху, мягкие тени снизу.","conditions":["Сохранить конструкцию, цвет и пропорции исходного товара","Не превращать товар в растущий стул"],"fallbackComposition":"Товар целиком на нейтральном светлом фоне без дополнительных утверждений."}'::jsonb),
              ('tpl_kids_lifestyle_v03', 'tpl_kids_lifestyle', 3, 'Различимая деталь', 'Показать крупно только деталь, которая действительно видна на исходном фото.', '{"schemaVersion":1,"framingMode":"detail","composition":"Крупный план видимой детали товара; мягкий дневной свет, спокойный комнатный фон и короткая проверенная подпись.","conditions":["Использовать только различимую часть исходного товара","Не выдумывать материалы, конструкцию, крепления или безопасность"],"fallbackComposition":"Товар целиком на светлом комнатном фоне без утверждения о детали."}'::jsonb),
              ('tpl_kids_lifestyle_v04', 'tpl_kids_lifestyle', 4, 'Маркировка и упаковка', 'Подчеркнуть читаемую маркировку или упаковку товара, если они показаны пользователем.', '{"schemaVersion":1,"framingMode":"detail","composition":"Крупно показать видимую этикетку либо упаковку; рядом оставить светлое поле и минимальный заголовок.","conditions":["Сохранять только читаемые надписи и настоящий бренд исходного товара","Не переносить плашки и текст демонстрационного стула как факты"],"fallbackComposition":"Товар целиком в исходной упаковке, без придуманной маркировки."}'::jsonb),
              ('tpl_kids_lifestyle_v05', 'tpl_kids_lifestyle', 5, 'Домашний контекст', 'Показать товар в уместной детской комнате без выдуманного способа использования.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком на переднем плане; светлая мебель и нейтральные мягкие предметы размыты вдали, сбоку короткая плашка.","conditions":["Не добавлять ребёнка, если он делает применение товара неоднозначным","Реквизит не должен выглядеть вложением в комплект"],"fallbackComposition":"Товар целиком на чистой светлой поверхности без сцены использования."}'::jsonb),
              ('tpl_kids_lifestyle_v06', 'tpl_kids_lifestyle', 6, 'Масштаб и окружение', 'Передать комнатный масштаб товара лишь настолько, насколько он ясен из исходного фото и описания.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком на полу или поверхности согласно исходному виду; фоном служит мягко освещённая детская комната.","conditions":["Не выдумывать размеры и возрастные ограничения","Не добавлять ребёнка как доказательство масштаба без основания"],"fallbackComposition":"Товар целиком на нейтральной плоскости с мягким светом без визуального сравнения размеров."}'::jsonb),
              ('tpl_kids_lifestyle_v07', 'tpl_kids_lifestyle', 7, 'Проверенный факт', 'Выделить один достоверный факт о товаре в округлой боковой плашке.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком по центру; сбоку округлая голубая плашка с одним коротким подтверждённым фактом.","conditions":["Не переносить возраст до 11 лет и подушки в комплекте","Не создавать иконки, обещающие свойства без подтверждения"],"fallbackComposition":"Товар целиком и только проверенное название; плашку убрать."}'::jsonb),
              ('tpl_kids_lifestyle_v08', 'tpl_kids_lifestyle', 8, 'Два тезиса', 'Разместить до двух подтверждённых характеристик в мягких боковых блоках.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком в центре; по бокам до двух округлых плашек с короткими проверенными фактами, свободные поля вокруг.","conditions":["Каждый тезис должен следовать из описания или читаемой маркировки","Не изображать игрушки и подушки как принадлежности товара"],"fallbackComposition":"Товар целиком на светлом фоне с одним проверенным заголовком без боковых блоков."}'::jsonb),
              ('tpl_kids_lifestyle_v09', 'tpl_kids_lifestyle', 9, 'Спокойный кадр', 'Оставить товар главным элементом светлой домашней сцены без лишних деталей.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком крупно на светлом комнатном фоне; мягкий дневной свет и один короткий голубой заголовок.","conditions":["Не перекрашивать товар в цвета референса","Не заполнять пустоты новыми товарами или ребёнком без основания"],"fallbackComposition":"Товар целиком на чистом нейтральном фоне без неподтверждённого текста."}'::jsonb),
              ('tpl_kids_lifestyle_v10', 'tpl_kids_lifestyle', 10, 'Итоговая карточка', 'Завершить серию крупным товаром, названием и только подтверждёнными короткими тезисами.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком в светлой комнате; крупный голубой заголовок сверху и до двух проверенных коротких фактов сбоку.","conditions":["Сохранить исходные форму, цвет, бренд и видимую маркировку","Не воспроизводить возраст, комплект, свойства стула и нумерацию референса"],"fallbackComposition":"Товар целиком в светлой домашней сцене с проверенным названием; остальные блоки убрать."}'::jsonb)
              ON CONFLICT (id) DO UPDATE SET title=EXCLUDED.title, default_idea=EXCLUDED.default_idea,
              generation_recipe=EXCLUDED.generation_recipe
              WHERE template_card_variants.template_id='tpl_kids_lifestyle'
              AND template_card_variants.position=EXCLUDED.position;
