databaseChangeLog:
  - changeSet:
      id: 071-fashion-lifestyle-variants
      author: codex
      runInTransaction: true
      changes:
        - sql:
            splitStatements: false
            sql: |
              SET LOCAL standard_conforming_strings = on;
              INSERT INTO template_card_variants(id,template_id,position,title,default_idea,generation_recipe) VALUES
              ('tpl_fashion_lifestyle_v01', 'tpl_fashion_lifestyle', 1, 'Обложка', 'Показать исходный товар крупно в спокойной интерьерной сцене. Оставить свободное поле для названия и две стеклянные плашки только с подтверждёнными сведениями.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком в центре на фоне нейтральной стены; крупное название в свободной верхней зоне; две полупрозрачные округлые плашки в нижних углах.","conditions":["Человек присутствует только если он есть на исходном фото","Плашки не закрывают товар и не содержат неподтверждённых фактов"],"fallbackComposition":"Товар целиком по центру и нейтральное название сверху; пустые плашки опустить."}'::jsonb),
              ('tpl_fashion_lifestyle_v02', 'tpl_fashion_lifestyle', 2, 'Образ в интерьере', 'Показать товар целиком в естественной интерьерной обстановке и добавить короткую фактическую подпись на свободном участке стены.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком чуть правее центра, слева свободная стена с крупным названием и одной компактной стеклянной плашкой снизу.","conditions":["Не создавать модель или постановку на человеке, если исходный товар снят без человека","Фактическую подпись брать из описания товара"],"fallbackComposition":"Товар целиком справа и нейтральное название слева; информационную плашку убрать."}'::jsonb),
              ('tpl_fashion_lifestyle_v03', 'tpl_fashion_lifestyle', 3, 'Силуэт', 'Подчеркнуть реальную форму товара: показать его целиком на нейтральном фоне с деликатной боковой подписью о видимой особенности.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком в центральной вертикали; спокойная студийная стена позади; узкая полупрозрачная плашка сбоку у действительно видимого элемента.","conditions":["Сохранять пропорции и очертания исходного товара","Не утверждать особенности посадки, если источник их не показывает"],"fallbackComposition":"Товар целиком по центру и только нейтральное название; боковую выноску опустить."}'::jsonb),
              ('tpl_fashion_lifestyle_v04', 'tpl_fashion_lifestyle', 4, 'Фактура', 'Если на фото различима фактура, показать её в небольшом увеличенном фрагменте внутри стеклянной плашки. Иначе оставить товар целиком.', '{"schemaVersion":1,"framingMode":"detail","composition":"Товар целиком справа; слева округлая стеклянная плашка с увеличенным фрагментом действительно видимой фактуры и короткой фактической подписью.","conditions":["Увеличивать только различимую фактуру исходного фото","Не придумывать состав, переплетение или тактильные свойства"],"fallbackComposition":"Товар целиком справа; слева нейтральная текстовая плашка без выдуманного крупного плана."}'::jsonb),
              ('tpl_fashion_lifestyle_v05', 'tpl_fashion_lifestyle', 5, 'Деталь изделия', 'Выделить на исходном фото различимую деталь кроя, застёжку или отделку и подписать её одним подтверждённым фактом.', '{"schemaVersion":1,"framingMode":"detail","composition":"Крупный, но не обрезанный произвольно фрагмент видимой детали слева; справа свободная нейтральная стена с тонким заголовком и одной стеклянной плашкой.","conditions":["Деталь должна быть действительно видна на исходном фото","Не дорисовывать скрытые швы, карманы или застёжки"],"fallbackComposition":"Товар целиком слева и нейтральное название справа; детальный фрагмент опустить."}'::jsonb),
              ('tpl_fashion_lifestyle_v06', 'tpl_fashion_lifestyle', 6, 'Цвет и отделка', 'Показать подлинный цвет и видимую отделку товара на мягком серо-бежевом фоне. Подпись использовать лишь при точном описании цвета.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком слева на фоне нейтральной интерьерной стены; справа свободное поле для названия и одной полупрозрачной подписи.","conditions":["Не перекрашивать исходный товар в цвета reference","Не показывать неподтверждённые цветовые варианты"],"fallbackComposition":"Товар целиком слева и нейтральное название справа без цветовой плашки."}'::jsonb),
              ('tpl_fashion_lifestyle_v07', 'tpl_fashion_lifestyle', 7, 'Видимая маркировка', 'При наличии разборчивого принта или маркировки показать их так, как они видны на исходном товаре; иначе сделать спокойный общий кадр.', '{"schemaVersion":1,"framingMode":"detail","composition":"Товар целиком в нижней части; небольшая стеклянная плашка сбоку с крупным планом разборчивой маркировки и коротким заголовком сверху.","conditions":["Сохранять настоящие буквы и знак только если они различимы на исходном фото","Не восстанавливать неразборчивые надписи и не придумывать бренд"],"fallbackComposition":"Товар целиком в спокойной студии и нейтральное название сверху; крупный план маркировки опустить."}'::jsonb),
              ('tpl_fashion_lifestyle_v08', 'tpl_fashion_lifestyle', 8, 'Подтверждённые характеристики', 'Показать товар целиком и до двух стеклянных плашек с точными сведениями из описания. Если таких сведений нет, оставить композицию чистой.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком по центру; две небольшие полупрозрачные плашки по сторонам в нижней половине кадра; тонкий крупный заголовок на стене сверху.","conditions":["Размеры, состав и свойства указывать только при прямом подтверждении","Пустые плашки не заполнять вымышленными значениями"],"fallbackComposition":"Товар целиком по центру с нейтральным названием; неподтверждённые плашки убрать."}'::jsonb),
              ('tpl_fashion_lifestyle_v09', 'tpl_fashion_lifestyle', 9, 'Лаконичная редакционная карточка', 'Оставить больше чистого пространства вокруг товара, сохранив естественный студийный свет и одно короткое название.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком в нижних двух третях кадра, просторная нейтральная стена сверху, одно крупное тонкое название и мягкая тень; без перегруженных плашек.","conditions":["Название следует фактическому описанию","Не добавлять скидки, рейтинги или рекламные обещания"],"fallbackComposition":"Товар целиком по центру и короткое нейтральное название в свободной зоне."}'::jsonb),
              ('tpl_fashion_lifestyle_v10', 'tpl_fashion_lifestyle', 10, 'Финальный кадр', 'Завершить серию общим видом товара в уютной нейтральной студии. Добавить одну подтверждённую подпись в стеклянной плашке, если есть подходящий факт.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком слегка смещён влево на интерьерном фоне; короткое название сверху справа; одна широкая стеклянная плашка внизу справа.","conditions":["Подпись не должна перекрывать товар","Не переносить демонстрационные свойства reference"],"fallbackComposition":"Товар целиком на интерьерном фоне и нейтральное название в свободной зоне; плашку убрать."}'::jsonb)
              ON CONFLICT (id) DO UPDATE SET title=EXCLUDED.title, default_idea=EXCLUDED.default_idea,
              generation_recipe=EXCLUDED.generation_recipe
              WHERE template_card_variants.template_id='tpl_fashion_lifestyle'
              AND template_card_variants.position=EXCLUDED.position;
