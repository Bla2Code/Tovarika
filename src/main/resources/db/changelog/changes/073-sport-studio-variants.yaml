databaseChangeLog:
  - changeSet:
      id: 073-sport-studio-variants
      author: codex
      runInTransaction: true
      changes:
        - sql:
            splitStatements: false
            sql: |
              SET LOCAL standard_conforming_strings = on;
              INSERT INTO template_card_variants(id,template_id,position,title,default_idea,generation_recipe) VALUES
              ('tpl_sport_hero_v01', 'tpl_sport_hero', 1, 'Обложка в зале', 'Показать исходный товар целиком и крупно в центре крытого спортзала. Сверху оставить свободное тёмное место для короткого названия, если оно известно.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком в центральной нижней области, тёмная зона над ним для названия; отражающий пол ведёт взгляд к товару.","conditions":["Название брать из описания пользователя","Окружение не должно менять назначение товара"],"fallbackComposition":"Товар целиком в центре зала, свободное тёмное пространство сверху; неподтверждённые подписи опустить."}'::jsonb),
              ('tpl_sport_hero_v02', 'tpl_sport_hero', 2, 'Ракурс и форма', 'Сместить товар вправо и показать его полностью в исходном ракурсе. Слева разместить короткую подпись только о реально видимой форме или конструкции.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком справа на спортивном покрытии, слева тёмная вертикальная зона с коротким заголовком и одной фактической подписью.","conditions":["Сохранять ракурс и пропорции исходного фото","Не делать вывод о скрытой конструкции"],"fallbackComposition":"Товар целиком справа и нейтральное название слева; неподтверждённую подпись опустить."}'::jsonb),
              ('tpl_sport_hero_v03', 'tpl_sport_hero', 3, 'Подтверждённая особенность', 'Поставить товар целиком слева и дать справа одну крупную подтверждённую особенность на тёмном фоне. Если факта нет, использовать название товара.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком слева, справа контрастный заголовок и одна узкая оранжевая линия; остальные блоки свободны.","conditions":["Особенность должна подтверждаться описанием или исходным фото","Не превращать видимый признак в обещание качества"],"fallbackComposition":"Товар целиком слева, нейтральное название справа без дополнительной характеристики."}'::jsonb),
              ('tpl_sport_hero_v04', 'tpl_sport_hero', 4, 'Фактура поверхности', 'При различимой фактуре исходного товара показать её крупным планом на фоне спортзала и подписать только видимое. Иначе показать товар целиком.', '{"schemaVersion":1,"framingMode":"detail","composition":"Крупный план видимой поверхности в центре, размытый зал по краям, небольшая подпись в тёмной верхней зоне.","conditions":["Крупный план допустим лишь при чёткой фактуре в источнике","Не выдумывать состав, покрытие или технологию"],"fallbackComposition":"Показать товар целиком в центре и нейтральное название сверху; не создавать искусственную фактуру."}'::jsonb),
              ('tpl_sport_hero_v05', 'tpl_sport_hero', 5, 'Видимая деталь', 'Выделить одну различимую деталь конструкции, например шов или крепление, и дать короткую фактическую подпись. При отсутствии детали показать весь товар.', '{"schemaVersion":1,"framingMode":"detail","composition":"Деталь исходного товара крупно справа, слева тёмное пространство с тонкой оранжевой выноской и коротким текстом.","conditions":["Показывать только область, различимую на исходном фото","Не создавать невидимую обратную сторону или дополнительные элементы"],"fallbackComposition":"Исходный товар целиком справа, слева одна нейтральная подпись без выноски."}'::jsonb),
              ('tpl_sport_hero_v06', 'tpl_sport_hero', 6, 'На спортивном покрытии', 'Показать товар целиком на покрытии зала с видимым отражением и мягкой тенью. Короткую подпись поместить в свободной верхней части.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Низкая точка съёмки, товар целиком на полу в нижней половине, глубокий фон спортзала и небольшое название сверху.","conditions":["Сохранять реальный контакт товара с поверхностью","Не утверждать пригодность для зала без подтверждения"],"fallbackComposition":"Товар целиком на нейтральном спортивном покрытии; название опустить, если оно не задано."}'::jsonb),
              ('tpl_sport_hero_v07', 'tpl_sport_hero', 7, 'Цвет и отделка', 'Подчеркнуть исходный цвет товара на холодном тёмном фоне и показать его полностью. Сбоку допускается короткая подпись о видимой отделке.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком по центру на тёмном фоне, мягкий боковой свет выделяет настоящие цвета; компактная подпись сбоку.","conditions":["Не перекрашивать товар в цвета референса","Не объявлять другие цвета доступными без данных"],"fallbackComposition":"Товар целиком по центру с естественным цветом и без дополнительной подписи."}'::jsonb),
              ('tpl_sport_hero_v08', 'tpl_sport_hero', 8, 'Маркировка товара', 'Если на исходном товаре различима маркировка, сохранить и показать её крупнее. При неразборчивой маркировке использовать полный вид товара без реконструкции букв.', '{"schemaVersion":1,"framingMode":"detail","composition":"Участок с подлинной видимой маркировкой крупно в центре, тёмный размытый зал вокруг и спокойная подпись внизу.","conditions":["Не менять подлинный бренд и надписи товара","Не восстанавливать неразборчивые символы и не добавлять логотип референса"],"fallbackComposition":"Показать товар целиком в центре; отдельный план маркировки и подпись опустить."}'::jsonb),
              ('tpl_sport_hero_v09', 'tpl_sport_hero', 9, 'Подтверждённые параметры', 'Оставить товар целиком в верхней части и снизу разместить до трёх лаконичных параметров, если значения точно указаны пользователем.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком в верхних двух третях, снизу тёмная горизонтальная полоса с короткими белыми параметрами и оранжевыми разделителями.","conditions":["Размеры, материал и назначение брать только из подтверждённых данных","Не оставлять пустые ячейки и не использовать параметры исходного баннера"],"fallbackComposition":"Товар целиком в центре; нижнюю полосу с параметрами опустить."}'::jsonb),
              ('tpl_sport_hero_v10', 'tpl_sport_hero', 10, 'Финальный кадр', 'Завершить серию крупным полным видом товара на контрастном фоне спортзала, с коротким названием и одной подтверждённой подписью при наличии данных.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком в центре перед размытым залом, выразительное отражение на полу, крупное название сверху и одна короткая подпись снизу.","conditions":["Не добавлять призыв к покупке, телефон или адрес сайта","Подпись должна содержать только подтверждённые сведения"],"fallbackComposition":"Товар целиком по центру на фоне зала; оставить только нейтральное название либо совсем убрать текст."}'::jsonb)
              ON CONFLICT (id) DO UPDATE SET title=EXCLUDED.title, default_idea=EXCLUDED.default_idea,
              generation_recipe=EXCLUDED.generation_recipe
              WHERE template_card_variants.template_id='tpl_sport_hero'
              AND template_card_variants.position=EXCLUDED.position;
