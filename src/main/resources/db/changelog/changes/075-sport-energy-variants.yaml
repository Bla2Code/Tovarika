databaseChangeLog:
  - changeSet:
      id: 075-sport-energy-variants
      author: codex
      runInTransaction: true
      changes:
        - sql:
            splitStatements: false
            sql: |
              SET LOCAL standard_conforming_strings = on;
              INSERT INTO template_card_variants(id,template_id,position,title,default_idea,generation_recipe) VALUES
              ('tpl_sport_accent_v01', 'tpl_sport_accent', 1, 'Обложка', 'Показать исходный товар целиком на переднем плане в контрастной спортивной сцене. Добавить крупное название и короткую подпись только при наличии подтверждённых данных.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком по центру перед светлым проёмом; вокруг тёмная тканевая фактура. Крупный светлый заголовок сверху, короткая фактическая строка снизу.","conditions":["Не переносить руку и бутылку из reference","Подпись строить только на подтверждённых свойствах"],"fallbackComposition":"Товар целиком по центру на контрастном фоне; оставить нейтральное название без неподтверждённой подписи."}'::jsonb),
              ('tpl_sport_accent_v02', 'tpl_sport_accent', 2, 'В движении', 'Подчеркнуть динамику спортивного товара ракурсом и светом, не придумывая условия эксплуатации. Если исходник не показывает использование, оставить предметный кадр.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком под небольшим диагональным углом в центре; тёмное окружение и холодный светлый просвет создают ощущение движения, краткий заголовок расположен сверху справа.","conditions":["Не менять реальную геометрию и ориентацию товара","Человека или сцену использования добавлять только при наличии на исходном фото"],"fallbackComposition":"Статичный товар целиком на тёмном фоне с направленным светом и нейтральным заголовком."}'::jsonb),
              ('tpl_sport_accent_v03', 'tpl_sport_accent', 3, 'Форма и силуэт', 'Показать контур товара целиком и сохранить его реальные пропорции. Одной строкой назвать заметную особенность формы, если она действительно видна.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар крупно и целиком на светлом проёме, тёмное окружение подчёркивает силуэт; короткий светлый заголовок в свободном верхнем поле.","conditions":["Сохранять точный контур и пропорции исходного товара","Не выводить функциональные свойства только из формы"],"fallbackComposition":"Товар целиком в центре, без дополнительной строки о форме."}'::jsonb),
              ('tpl_sport_accent_v04', 'tpl_sport_accent', 4, 'Видимая фактура', 'Крупнее показать реально различимую поверхность товара: покрытие, ткань или рельеф. Материал и его свойства подписывать только при подтверждении.', '{"schemaVersion":1,"framingMode":"detail","composition":"Различимый участок поверхности товара крупно на переднем плане; остальная часть товара остаётся узнаваемой, тёмный фон и холодный свет выделяют фактуру.","conditions":["Крупный план допустим только для различимого участка исходного фото","Не угадывать состав, технологию покрытия или тактильные свойства"],"fallbackComposition":"Показать товар целиком в контрастной спортивной сцене; неподтверждённую фактуру и подпись опустить."}'::jsonb),
              ('tpl_sport_accent_v05', 'tpl_sport_accent', 5, 'Конструктивная деталь', 'Выделить одну действительно видимую деталь конструкции товара. Если её нельзя уверенно различить, показать общий вид без крупного плана.', '{"schemaVersion":1,"framingMode":"detail","composition":"Одна различимая деталь товара крупно в центре, вокруг тёмная фактура и светлый проём; рядом место для короткой подтверждённой подписи.","conditions":["Показывать только деталь, которая видна на исходном фото","Не достраивать скрытые клапаны, швы, крепления или механизмы"],"fallbackComposition":"Товар целиком на переднем плане, без детального кадра и без подписи о конструкции."}'::jsonb),
              ('tpl_sport_accent_v06', 'tpl_sport_accent', 6, 'Цветовой акцент', 'Сделать реальный цвет товара главным акцентом на фоне тёмной экипировки и холодного неба. Название цвета использовать только из подтверждённого описания.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком по центру; его исходный цвет контрастирует с почти чёрной тканью и светлым небом, короткий заголовок вверху.","conditions":["Не перекрашивать товар в цвета reference","Не показывать несуществующие цветовые варианты"],"fallbackComposition":"Товар целиком на тёмном фоне с нейтральным названием без указания цвета."}'::jsonb),
              ('tpl_sport_accent_v07', 'tpl_sport_accent', 7, 'Маркировка и отделка', 'Если на исходном товаре чётко видна маркировка или отделка, сохранить и показать её. Неразличимые буквы не восстанавливать.', '{"schemaVersion":1,"framingMode":"detail","composition":"Реально видимая маркировка или отделка товара выделена светом на тёмном фоне; товар остаётся узнаваемым, подпись короткая и фактическая.","conditions":["Не копировать логотип с reference и не придумывать новый","Буквы и знаки исходного товара сохранять только если они различимы"],"fallbackComposition":"Показать исходный товар целиком без выдуманной маркировки и без детального кадра."}'::jsonb),
              ('tpl_sport_accent_v08', 'tpl_sport_accent', 8, 'Подтверждённые особенности', 'Показать товар целиком и добавить до трёх коротких достоверных особенностей. Не использовать заявления о свойствах, которые не подтверждены описанием.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком в центре; сверху крупное название, сбоку до трёх лаконичных светлых подписей на тёмном поле без перегруженных значков.","conditions":["Каждую характеристику сверять с описанием или видимым исходным фото","Не придумывать водостойкость, температурный режим, ёмкость или размеры"],"fallbackComposition":"Товар целиком и нейтральный заголовок; неподтверждённые подписи убрать."}'::jsonb),
              ('tpl_sport_accent_v09', 'tpl_sport_accent', 9, 'На маршруте', 'Поместить исходный товар в спокойный outdoor-контекст с тёмной экипировкой и просветом неба. Если исходник не показывает человека, не добавлять руку или модель.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком на переднем плане; за ним тёмная фактурная экипировка и холодное небо в проёме, небольшое свободное поле для заголовка сверху.","conditions":["Не утверждать пригодность для конкретного спорта без данных","Руку и человека добавлять только если они видны на исходном фото"],"fallbackComposition":"Товар целиком перед светлым проёмом без человека, с нейтральным названием."}'::jsonb),
              ('tpl_sport_accent_v10', 'tpl_sport_accent', 10, 'Итоговая карточка', 'Завершить серию контрастной карточкой с товаром целиком, ясным названием и одной короткой подтверждённой строкой. Без рекламного слогана и контактов.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком в центре на фоне тёмной спортивной ткани и холодного светлого просвета; крупное название сверху справа, короткая строка внизу.","conditions":["Итоговая строка содержит только подтверждённые сведения","Не добавлять телефон, сайт, рекламные обещания и чужой бренд"],"fallbackComposition":"Товар целиком в центре и нейтральное название сверху; нижнюю строку убрать."}'::jsonb)
              ON CONFLICT (id) DO UPDATE SET title=EXCLUDED.title, default_idea=EXCLUDED.default_idea,
              generation_recipe=EXCLUDED.generation_recipe
              WHERE template_card_variants.template_id='tpl_sport_accent'
              AND template_card_variants.position=EXCLUDED.position;
