databaseChangeLog:
  - changeSet:
      id: 076-sport-outdoor-template
      author: tovarika
      changes:
        - sql:
            splitStatements: false
            sql: |
              -- Upload the WebP to this exact storage key before applying the migration.
              INSERT INTO assets (
                  id, purpose, media_type, size_bytes, width, height,
                  storage_key, url, expires_at, created_at
              ) VALUES (
                  'asset_tpl_sport_lifestyle_ref', 'template_reference', 'image/webp',
                  37670, 384, 512,
                  'templates/tpl_sport_lifestyle/f5169f2e-e223-4869-9c44-8935adfc052f.webp',
                  '', NULL, CURRENT_TIMESTAMP
              );

              UPDATE templates SET
                  name = 'Outdoor sport',
                  category_id = 'cat_sport',
                  sort_order = 30,
                  available = true,
                  reference_asset_id = 'asset_tpl_sport_lifestyle_ref',
                  recipe_json = '{
                    "schemaVersion": 1,
                    "scene": "Light rounded panel on a dark graphite field, with a rugged rocky base below the source product",
                    "composition": "Source product fully visible at center; oversized dark headline above, compact verified specifications to the sides",
                    "lighting": "Even studio light with soft shadows on the product and textured rocks",
                    "style": "Outdoor equipment infographic with bold condensed title, narrow captions and restrained orange fact markers",
                    "palette": ["#272728", "#ECEDEB", "#4E5961", "#A0A4A3", "#DC772C"],
                    "avoid": [
                      "verbatim bicycle text, reference brand or reference accessory",
                      "unverified measurements, capacities or technical features",
                      "invented product views, hidden parts or included accessories",
                      "changes to source product geometry, color, labels or branding",
                      "advertising slogans, phone numbers or website addresses"
                    ]
                  }'::jsonb,
                  updated_at = CURRENT_TIMESTAMP
              WHERE id = 'tpl_sport_lifestyle';
