databaseChangeLog:
  - changeSet:
      id: 077-sport-outdoor-variants
      author: codex
      runInTransaction: true
      changes:
        - sql:
            splitStatements: false
            sql: |
              SET LOCAL standard_conforming_strings = on;
              INSERT INTO template_card_variants(id,template_id,position,title,default_idea,generation_recipe) VALUES
              ('tpl_sport_lifestyle_v01', 'tpl_sport_lifestyle', 1, 'Обложка', 'Показать исходный товар целиком на светлом поле над каменистым основанием. Крупное название разместить сверху, а боковые характеристики — только при наличии подтверждённых данных.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком занимает центр светлой округлой панели; сверху крупный графитовый заголовок, сбоку одна или две компактные фактические выноски, снизу фактурные камни.","conditions":["Заголовок и численные сведения подтверждены исходным материалом","Не копировать параметры демонстрационного велосипеда"],"fallbackComposition":"Товар целиком в центре и нейтральное название сверху; неподтверждённые выноски опустить."}'::jsonb),
              ('tpl_sport_lifestyle_v02', 'tpl_sport_lifestyle', 2, 'Общий вид', 'Сделать спокойную карточку с полным силуэтом исходного спортивного товара на светлом фоне и одной короткой подтверждённой подписью.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком по центру без перекрытия; низкая полоса камней снизу, название в верхней зоне и одна узкая подпись под ним.","conditions":["Сохранять исходные пропорции, ракурс и цвет","Не показывать дополнительные предметы как часть комплекта"],"fallbackComposition":"Полный вид товара и нейтральное название; дополнительную подпись убрать."}'::jsonb),
              ('tpl_sport_lifestyle_v03', 'tpl_sport_lifestyle', 3, 'Главный факт', 'Выделить одну проверенную характеристику крупным числом слева от товара. Если точного числа нет, использовать короткую словесную подпись без обещаний.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком справа на светлой панели; слева крупный графитовый факт с небольшим оранжевым маркером единицы измерения, название сверху.","conditions":["Число и единица измерения должны быть явно подтверждены","Не использовать число из reference"],"fallbackComposition":"Товар справа и нейтральная характеристика слева без чисел и маркера."}'::jsonb),
              ('tpl_sport_lifestyle_v04', 'tpl_sport_lifestyle', 4, 'Видимая деталь', 'Показать крупно деталь, которая ясно различима на исходном фото, и подписать её фактически. Если детали не видно, оставить полный вид товара.', '{"schemaVersion":1,"framingMode":"detail","composition":"Крупный план одной видимой детали в центральной части; короткий заголовок вверху и тонкая выноска сбоку на светлом поле.","conditions":["Деталь должна быть различима на исходном изображении","Не реконструировать скрытые узлы и маркировку"],"fallbackComposition":"Товар целиком на светлой панели и нейтральная подпись сбоку."}'::jsonb),
              ('tpl_sport_lifestyle_v05', 'tpl_sport_lifestyle', 5, 'Фактура и материал', 'Если поверхность товара хорошо видна, показать её ближе и описать лишь очевидный визуальный признак. Состав и технологию не угадывать.', '{"schemaVersion":1,"framingMode":"detail","composition":"Видимая фактура товара крупно справа, слева светлое поле с коротким названием и одной фактической строкой; камни остаются в нижнем крае.","conditions":["Приближение допустимо только для читаемой исходной области","Не делать вывод о составе, прочности или покрытии по виду"],"fallbackComposition":"Товар целиком справа и нейтральная подпись слева без описания материала."}'::jsonb),
              ('tpl_sport_lifestyle_v06', 'tpl_sport_lifestyle', 6, 'Форма', 'Подчеркнуть реальный силуэт товара без изменения конструкции и без выдуманных ракурсов. Подписи поставить рядом с действительно видимыми элементами.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Полный силуэт в центре панели; до двух тонких выносок по бокам, крупный заголовок над ним и спокойный каменистый низ.","conditions":["Выноски относятся только к видимым частям","Не менять форму и комплектацию товара ради композиции"],"fallbackComposition":"Полный силуэт и заголовок; неподтверждённые выноски убрать."}'::jsonb),
              ('tpl_sport_lifestyle_v07', 'tpl_sport_lifestyle', 7, 'Цвет и отделка', 'Показать реальный цвет и видимую отделку товара на нейтральном фоне. Палитру шаблона оставить только для рамки и графики.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком крупно слева; справа небольшая графитовая подпись о подтверждённом цвете или отделке, внизу каменистая фактура.","conditions":["Не перекрашивать исходный товар","Не добавлять неподтверждённые варианты цвета"],"fallbackComposition":"Товар целиком и нейтральное название без сведений о вариантах."}'::jsonb),
              ('tpl_sport_lifestyle_v08', 'tpl_sport_lifestyle', 8, 'Маркировка', 'Если на исходном товаре различима маркировка, сохранить её и показать заметнее. Нечитаемые символы не восстанавливать.', '{"schemaVersion":1,"framingMode":"detail","composition":"Крупный план действительно читаемой маркировки в центре светлой панели, короткое название сверху и одна тонкая подпись слева.","conditions":["Крупный план только при читаемой маркировке в исходнике","Сохранять оригинальное написание и не добавлять чужие логотипы"],"fallbackComposition":"Полный вид товара и нейтральный заголовок вместо выдуманной маркировки."}'::jsonb),
              ('tpl_sport_lifestyle_v09', 'tpl_sport_lifestyle', 9, 'Характеристики', 'Собрать до трёх подтверждённых характеристик в боковые выноски вокруг полного вида товара. Числа и единицы использовать только из описания.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком в центре; с двух сторон компактные типографические блоки с крупными числами и узкими подписями, если фактов достаточно.","conditions":["Не переносить из reference значения 110 кг и 29 дюймов","Пустые информационные блоки не заполнять общими обещаниями"],"fallbackComposition":"Товар целиком, название сверху и одна подтверждённая строка снизу."}'::jsonb),
              ('tpl_sport_lifestyle_v10', 'tpl_sport_lifestyle', 10, 'Итоговая карточка', 'Завершить серию чистым полным видом товара в светлой округлой карточке с кратким названием и одним проверенным фактом.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком над камнями в центре, крупный графитовый заголовок вверху, одна сдержанная выноска сбоку и тёмная внешняя рамка.","conditions":["Итоговая подпись содержит только подтверждённую информацию","Не добавлять рекламные обещания, цену, телефон или адрес сайта"],"fallbackComposition":"Товар целиком и нейтральное название; выноску убрать."}'::jsonb)
              ON CONFLICT (id) DO UPDATE SET title=EXCLUDED.title, default_idea=EXCLUDED.default_idea,
              generation_recipe=EXCLUDED.generation_recipe
              WHERE template_card_variants.template_id='tpl_sport_lifestyle'
              AND template_card_variants.position=EXCLUDED.position;
