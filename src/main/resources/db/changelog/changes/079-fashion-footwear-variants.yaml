databaseChangeLog:
  - changeSet:
      id: 079-fashion-soft-variants
      author: codex
      runInTransaction: true
      changes:
        - sql:
            splitStatements: false
            sql: |
              SET LOCAL standard_conforming_strings = on;
              INSERT INTO template_card_variants(id,template_id,position,title,default_idea,generation_recipe) VALUES
              ('tpl_fashion_soft_v01', 'tpl_fashion_soft', 1, 'Обложка', 'Показать исходный товар крупно по диагонали на тёплом персиковом фоне. Сверху разместить название и подзаголовок, вокруг товара — до трёх полупрозрачных плашек только с подтверждёнными особенностями.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком по диагонали из нижнего левого угла к правой верхней части; название и подзаголовок в верхней левой зоне, полупрозрачные плашки с круглыми значками вдоль свободных краёв.","conditions":["Диагональ не должна искажать геометрию товара","Каждый значок и подпись соответствуют подтверждённому факту, а не обещаниям reference"],"fallbackComposition":"Товар целиком по диагонали, нейтральное название сверху; неподтверждённые плашки и значки убрать."}'::jsonb),
              ('tpl_fashion_soft_v02', 'tpl_fashion_soft', 2, 'Коротко о главном', 'Показать товар целиком справа, а слева собрать до трёх подтверждённых особенностей в вертикальную колонку кремовых плашек. Сохранить мягкий свет и спокойный персиковый фон.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Исходный товар целиком справа; слева заголовок и вертикальная колонка полупрозрачных кремовых плашек с лаконичными подписями и тонкими значками.","conditions":["Не заполнять колонку неподтверждёнными преимуществами","Не закрывать подписями товар"],"fallbackComposition":"Товар справа и одна нейтральная подпись слева; лишние плашки опустить."}'::jsonb),
              ('tpl_fashion_soft_v03', 'tpl_fashion_soft', 3, 'Фактура вблизи', 'Показать крупно действительно различимую фактуру исходного товара и добавить короткую фактическую подпись. Если фото не позволяет рассмотреть фактуру, показать товар целиком.', '{"schemaVersion":1,"framingMode":"detail","composition":"Различимый участок фактуры занимает нижнюю правую часть; сверху слева крупный заголовок, снизу слева одна полупрозрачная плашка без списка характеристик.","conditions":["Крупный план допустим только для действительно различимой области исходного фото","Не придумывать волокна, состав, ворс и свойства материала"],"fallbackComposition":"Товар целиком справа, заголовок и нейтральная подпись слева; крупный план неразличимой фактуры не создавать."}'::jsonb),
              ('tpl_fashion_soft_v04', 'tpl_fashion_soft', 4, 'Линии и силуэт', 'Подчеркнуть узнаваемую форму товара: показать его целиком в центре с мягкой тенью, а короткие подписи расположить вдоль свободных краёв. Сохранить реальные пропорции.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком в центре вертикального кадра с большим свободным полем; крупный заголовок снизу, до двух коротких тонких выносок к видимым линиям силуэта.","conditions":["Сохранять форму и пропорции исходного товара","Не добавлять человека и сведения о посадке, если источник их не показывает"],"fallbackComposition":"Товар целиком в центре и нейтральное название снизу; выноски без фактического содержания убрать."}'::jsonb),
              ('tpl_fashion_soft_v05', 'tpl_fashion_soft', 5, 'Деталь конструкции', 'Выделить один видимый элемент конструкции: шов, край, застёжку или подошву. Подписать только подтверждённый признак. Если элемент неразличим, использовать вид товара целиком.', '{"schemaVersion":1,"framingMode":"detail","composition":"Одна различимая деталь конструкции крупно слева; справа короткий тёмный заголовок и одна кремовая плашка, мягкий персиковый фон остаётся свободным.","conditions":["Выбирать только различимый на исходном фото участок","Не добавлять скрытые швы, застёжки, слои или новые ракурсы"],"fallbackComposition":"Исходный товар целиком слева с одной нейтральной подписью справа; детальный ракурс опустить."}'::jsonb),
              ('tpl_fashion_soft_v06', 'tpl_fashion_soft', 6, 'Подтверждённые размеры', 'Разместить товар целиком в верхней части и аккуратный блок размеров снизу, если точные данные есть в описании. Не выводить размеры демонстрационного товара.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком в верхней центральной зоне; снизу заголовок и компактная сетка полупрозрачных плашек с подтверждёнными размерными данными.","conditions":["Численные размеры и размерный ряд брать только из описания пользователя","Не выводить измерительные линии и значения, которых нет в исходных данных"],"fallbackComposition":"Товар целиком сверху и одна нейтральная подпись снизу; неподтверждённую размерную сетку убрать."}'::jsonb),
              ('tpl_fashion_soft_v07', 'tpl_fashion_soft', 7, 'Цвет и отделка', 'Выделить реальный цвет и видимую отделку товара: разместить его целиком слева, а справа оставить короткие подписи. Тёплая палитра применяется к оформлению.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком слева, справа два разнесённых кремовых текстовых блока о подтверждённых цвете и отделке; компактный заголовок наверху справа.","conditions":["Не перекрашивать товар под фон и не добавлять цветовые варианты","Технологию отделки не определять по внешнему сходству"],"fallbackComposition":"Товар целиком слева и нейтральная подпись справа; неподтверждённые сведения о цвете или отделке опустить."}'::jsonb),
              ('tpl_fashion_soft_v08', 'tpl_fashion_soft', 8, 'Видимая маркировка', 'Если на товаре хорошо различимы надпись, принт или маркировка, показать этот участок крупнее и сохранить его. Если маркировка неразборчива или отсутствует, показать товар целиком.', '{"schemaVersion":1,"framingMode":"detail","composition":"Различимая маркировка или принт крупно в центре; заголовок сверху и одна узкая кремовая подпись снизу на мягком персиковом фоне.","conditions":["Участок должен быть различим на исходном фото","Не восстанавливать неразборчивые символы и не подменять бренд"],"fallbackComposition":"Товар целиком в центре с нейтральным заголовком сверху; недоступную маркировку не создавать."}'::jsonb),
              ('tpl_fashion_soft_v09', 'tpl_fashion_soft', 9, 'Уход по инструкции', 'Показать товар целиком в нижней части, а над ним — короткие рекомендации по уходу, только если они явно указаны пользователем. Сохранить тёплые плашки и тонкие значки.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком в нижней трети на мягкой тени; сверху крупный заголовок и горизонтальный ряд кремовых плашек с подтверждёнными правилами ухода.","conditions":["Уход и допустимые способы очистки брать только из описания пользователя","Значки не должны обещать неподтверждённую машинную стирку, водостойкость или нагрев"],"fallbackComposition":"Товар целиком в нижней части и нейтральный заголовок сверху; неподтверждённые инструкции и значки ухода убрать."}'::jsonb),
              ('tpl_fashion_soft_v10', 'tpl_fashion_soft', 10, 'Спокойный финал', 'Завершить серию лаконичной карточкой: товар целиком по центру, название сверху и одна короткая подтверждённая подпись снизу. Сохранить мягкую тень и много свободного фона.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком по центру на тёплом фоне, мягкая овальная тень снизу; компактное название сверху, одна широкая полупрозрачная плашка под товаром.","conditions":["Итоговая подпись не добавляет новых свойств или рекламных обещаний","Не добавлять скидки, рейтинг, призывы к покупке и дополнительные товары"],"fallbackComposition":"Товар целиком в центре и нейтральное название сверху; неподтверждённую итоговую плашку убрать."}'::jsonb)
              ON CONFLICT (id) DO UPDATE SET title=EXCLUDED.title, default_idea=EXCLUDED.default_idea,
              generation_recipe=EXCLUDED.generation_recipe
              WHERE template_card_variants.template_id='tpl_fashion_soft'
              AND template_card_variants.position=EXCLUDED.position;
  - changeSet:
      id: 079-fashion-collage-variants
      author: codex
      runInTransaction: true
      changes:
        - sql:
            splitStatements: false
            sql: |
              SET LOCAL standard_conforming_strings = on;
              INSERT INTO template_card_variants(id,template_id,position,title,default_idea,generation_recipe) VALUES
              ('tpl_fashion_collage_v01', 'tpl_fashion_collage', 1, 'Обложка-коллаж', 'Показать исходный товар крупно поверх белой сетки на кофейном фоне. В плитках использовать только различимые участки того же исходного фото. Сверху разместить короткое описание, снизу — крупное название и подтверждённый подзаголовок.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком в центре поверх белой прямоугольной сетки, короткий фактический текст сверху слева, крупное кремовое название и разреженный подзаголовок внизу. Плитки показывают только доступные участки того же исходного вида.","conditions":["Не повторять демонстрационную пару, ракурсы, бренд и социальные адреса reference","Для плиток использовать лишь различимые детали исходного фото; при их отсутствии упрощать сетку"],"fallbackComposition":"Товар целиком на одной белой панели, название снизу и короткий подтверждённый текст сверху; дополнительные плитки и неподтверждённый подзаголовок опустить."}'::jsonb),
              ('tpl_fashion_collage_v02', 'tpl_fashion_collage', 2, 'Особенности по пунктам', 'Разместить товар целиком слева, а справа — до трёх коротких подтверждённых особенностей в белых прямоугольных блоках. Оставить кофейный фон и кремовый заголовок.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком на высокой белой плитке слева; справа вертикальный ряд до трёх белых текстовых блоков; кремовый заголовок сверху, без повторения товара в каждой плитке.","conditions":["Каждый пункт должен подтверждаться описанием или фото","Не превращать видимый элемент в обещание комфорта, качества или долговечности"],"fallbackComposition":"Товар целиком слева и одна широкая нейтральная подпись справа; незаполненные блоки убрать."}'::jsonb),
              ('tpl_fashion_collage_v03', 'tpl_fashion_collage', 3, 'Силуэт на светлом', 'Показать исходный товар целиком на широкой белой панели. Сверху дать крупное название, снизу — одну короткую подпись о видимой форме. Не добавлять человека или новый ракурс.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Одна широкая белая панель в центре кофейного поля; товар целиком с сохранением исходного вида; крупное название над панелью и тонкая кремовая подпись под ней.","conditions":["Сохранять видимые очертания и пропорции товара","Посадку и удобство не выводить из одного силуэта"],"fallbackComposition":"Товар целиком на белой панели и нейтральное название сверху; подпись без фактической основы опустить."}'::jsonb),
              ('tpl_fashion_collage_v04', 'tpl_fashion_collage', 4, 'Фактура крупным планом', 'Если на исходном фото различима фактура, показать один её участок в широкой белой плитке и дать короткую фактическую подпись. При недостаточной детализации показать товар целиком.', '{"schemaVersion":1,"framingMode":"detail","composition":"Один действительно различимый участок поверхности крупно в широкой белой плитке сверху; снизу крупный кремовый заголовок и одна короткая подпись на кофейном фоне.","conditions":["Крупный план допустим только для отчётливо различимой области исходного фото","Не выдумывать материал, волокна, состав или технологии изготовления"],"fallbackComposition":"Товар целиком на широкой белой панели сверху, нейтральное название снизу; искусственную фактуру не создавать."}'::jsonb),
              ('tpl_fashion_collage_v05', 'tpl_fashion_collage', 5, 'Деталь конструкции', 'Показать одну реально видимую деталь: край, застёжку или шов. Разместить её в белом квадрате слева, а справа — короткую подпись. Если деталь неразличима, использовать целый товар.', '{"schemaVersion":1,"framingMode":"detail","composition":"Одна видимая конструктивная деталь в белой квадратной плитке слева; справа крупный кремовый заголовок и короткое подтверждённое пояснение; нижняя часть фона затемнена.","conditions":["Деталь должна отчётливо присутствовать на исходном фото","Не добавлять обратный ракурс, скрытую застёжку, подошву или дополнительные детали"],"fallbackComposition":"Товар целиком в белой плитке слева, нейтральное название справа; неподтверждённое пояснение убрать."}'::jsonb),
              ('tpl_fashion_collage_v06', 'tpl_fashion_collage', 6, 'Цвет и отделка', 'Подчеркнуть реальный цвет и видимую отделку исходного товара. Показать его целиком справа, слева оставить один крупный заголовок и короткую подпись. Кофейный оттенок использовать только для фона.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком на белой прямоугольной панели справа; крупный кремовый заголовок и компактная белая подпись слева; минимум декоративных элементов.","conditions":["Цвет товара сохранять по исходному фото","Не создавать палитру доступных расцветок, состав и технологию отделки без данных"],"fallbackComposition":"Товар целиком справа и нейтральное название слева; сведения о цвете или отделке без подтверждения опустить."}'::jsonb),
              ('tpl_fashion_collage_v07', 'tpl_fashion_collage', 7, 'Принт или маркировка', 'Если принт, логотип или надпись отчётливо видны на исходном товаре, показать этот участок в одной белой плитке и сохранить его без изменений. При отсутствии подходящей детали показать целый товар.', '{"schemaVersion":1,"framingMode":"detail","composition":"Одна белая плитка с различимой областью принта или маркировки в центре; компактный заголовок сверху и фактическая подпись снизу на тёмно-кофейном фоне.","conditions":["Не восстанавливать неразборчивые буквы и не придумывать бренд","Сохранять исходную видимую надпись; не переносить маркировку reference"],"fallbackComposition":"Товар целиком на центральной белой панели и нейтральный заголовок сверху; плитку с неизвестной маркировкой не создавать."}'::jsonb),
              ('tpl_fashion_collage_v08', 'tpl_fashion_collage', 8, 'Паспорт товара', 'Разместить товар целиком в верхней части, а ниже — компактную таблицу подтверждённых параметров на белых плитках. Размеры, состав и комплектацию выводить только при наличии точных сведений.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком на широкой белой панели сверху; снизу компактная сетка белых текстовых плиток с названиями параметров и значениями; кремовый заголовок между ними.","conditions":["Численные размеры и состав брать из описания товара","Не переносить комплектацию reference и не заполнять таблицу догадками"],"fallbackComposition":"Товар целиком сверху и одна широкая белая подпись снизу; строки без подтверждённых данных исключить."}'::jsonb),
              ('tpl_fashion_collage_v09', 'tpl_fashion_collage', 9, 'Один главный факт', 'Выбрать одну подтверждённую особенность и оформить её крупным кремовым заголовком слева. Товар показать целиком справа на белой панели, а снизу добавить короткое пояснение только при наличии данных.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Асимметричная композиция: крупный кремовый фактический заголовок слева, товар целиком на смещённой вправо белой панели, одна короткая подпись вдоль нижнего края с полями.","conditions":["Не превращать факт в неподтверждённое превосходство или рекламное обещание","Не добавлять значки сертификации, рейтинги, цены и скидки без данных"],"fallbackComposition":"Нейтральное название слева и товар целиком справа; нижнее пояснение опустить."}'::jsonb),
              ('tpl_fashion_collage_v10', 'tpl_fashion_collage', 10, 'Финальный акцент', 'Завершить серию спокойной карточкой: товар целиком на одной белой панели, крупное название снизу и короткое подтверждённое описание сверху. Сохранить кофейный градиент и кремовую типографику.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком на одной белой панели в верхней центральной части, короткий текст над панелью, крупное кремовое название внизу; свободное пространство и минимальный декор.","conditions":["Сохранять исходный набор предметов и ракурс","Не добавлять призывы купить, скидки, отзывы и новые характеристики"],"fallbackComposition":"Товар целиком на белой панели и нейтральное название внизу; верхнее описание без данных опустить."}'::jsonb)
              ON CONFLICT (id) DO UPDATE SET title=EXCLUDED.title, default_idea=EXCLUDED.default_idea,
              generation_recipe=EXCLUDED.generation_recipe
              WHERE template_card_variants.template_id='tpl_fashion_collage'
              AND template_card_variants.position=EXCLUDED.position;
  - changeSet:
      id: 079-fashion-summer-variants
      author: codex
      runInTransaction: true
      changes:
        - sql:
            splitStatements: false
            sql: |
              SET LOCAL standard_conforming_strings = on;
              INSERT INTO template_card_variants(id,template_id,position,title,default_idea,generation_recipe) VALUES
              ('tpl_fashion_summer_v01', 'tpl_fashion_summer', 1, 'Обложка', 'Разместить товар крупно в верхней скруглённой панели, а ниже — большое название, кремовый подзаголовок, до двух подтверждённых сведений с отметками и известные размеры. Модель оставлять только при её наличии на исходном фото.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар крупно в верхней тёмной скруглённой панели; ниже слева широкий белый заголовок, кремовый подзаголовок и две короткие строки с квадратными отметками; справа внизу необязательный блок размеров.","conditions":["Людей не добавлять, если их нет на исходном фото","Размеры и свойства показывать только по подтверждённым данным"],"fallbackComposition":"Товар целиком в верхней панели, нейтральное название ниже слева; список, размерный блок и неподтверждённый подзаголовок убрать."}'::jsonb),
              ('tpl_fashion_summer_v02', 'tpl_fashion_summer', 2, 'Один важный факт', 'Выделить одну подтверждённую особенность кремовой подписью на тёплом фоне. Товар показать целиком справа, крупный белый заголовок — слева.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком справа на тёмном скруглённом поле; слева крупный белый заголовок и одна кремовая строка с квадратной отметкой, сверху небольшой контур солнца.","conditions":["Главный факт должен быть явно подтверждён","Не приписывать комфорт, сезонность или защитные свойства по внешнему виду"],"fallbackComposition":"Товар целиком справа и нейтральное название слева; строку с отметкой без факта опустить."}'::jsonb),
              ('tpl_fashion_summer_v03', 'tpl_fashion_summer', 3, 'Коротко о товаре', 'Показать товар целиком в левой половине и собрать справа до трёх коротких подтверждённых сведений с кремовыми отметками.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Слева товар целиком внутри вертикальной скруглённой панели; справа белый заголовок и спокойный вертикальный список с кремовыми квадратами.","conditions":["Каждая строка содержит отдельный подтверждённый факт","Число отметок соответствует числу фактов"],"fallbackComposition":"Товар слева, нейтральное название справа и одна доступная фактическая строка; пустые отметки убрать."}'::jsonb),
              ('tpl_fashion_summer_v04', 'tpl_fashion_summer', 4, 'Видимая фактура', 'Рассмотреть различимую фактуру товара на исходном фото. Показать крупнее только доступную область и добавить короткую точную подпись; при недостатке детализации оставить товар целиком.', '{"schemaVersion":1,"framingMode":"detail","composition":"Различимая фактура крупно в верхней скруглённой панели; ниже широкий белый заголовок и одна кремовая строка на свободном тёплом фоне.","conditions":["Крупный план допустим только для отчётливо различимой области исходного фото","Не выводить состав и эксплуатационные свойства из вида фактуры"],"fallbackComposition":"Товар целиком в верхней панели и нейтральная подпись снизу; недостоверный крупный план не создавать."}'::jsonb),
              ('tpl_fashion_summer_v05', 'tpl_fashion_summer', 5, 'Деталь конструкции', 'Выделить видимый шов, край, застёжку или элемент подошвы исходного товара. Подписать только то, что действительно различимо; иначе использовать общий вид.', '{"schemaVersion":1,"framingMode":"detail","composition":"Одна видимая конструктивная деталь крупно справа в тёмной скруглённой панели; слева белый заголовок и кремовая подпись с тонким графическим акцентом.","conditions":["Выбирать деталь, которая есть и различима на исходном фото","Не дорисовывать скрытую подошву, швы, застёжки и внутренние элементы"],"fallbackComposition":"Товар целиком справа в панели и нейтральное название слева; крупный план и подпись отсутствующей детали убрать."}'::jsonb),
              ('tpl_fashion_summer_v06', 'tpl_fashion_summer', 6, 'Силуэт', 'Показать товар целиком по центру на спокойном фоне, сохранив исходный ракурс и пропорции. Оставить крупное название внизу и минимум декора.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком по центру внутри широкой тёмной панели; контур солнца в свободном верхнем углу, большое белое название внизу и небольшой кремовый подзаголовок.","conditions":["Не создавать дополнительные ракурсы и предметы","Не добавлять модель и не делать выводы о посадке без исходных данных"],"fallbackComposition":"Товар целиком по центру с нейтральным названием внизу; необоснованный подзаголовок убрать."}'::jsonb),
              ('tpl_fashion_summer_v07', 'tpl_fashion_summer', 7, 'Цвет и отделка', 'Сделать реальный цвет и видимую отделку товара главным акцентом. На свободном тёплом поле разместить только точное подтверждённое описание.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком слева на тёмном скруглённом поле; справа белый заголовок, кремовая строка о реальном цвете или видимой отделке и компактная квадратная отметка.","conditions":["Сохранять реальный цвет исходного товара","Не добавлять неизвестные цветовые варианты или названия технологий отделки"],"fallbackComposition":"Товар целиком слева и нейтральное название справа; строку без подтверждённого содержания убрать."}'::jsonb),
              ('tpl_fashion_summer_v08', 'tpl_fashion_summer', 8, 'Принт или маркировка', 'Если на товаре различимы принт, логотип или маркировка, показать этот участок крупнее с сохранением оригинала. При отсутствии такой детали показать товар целиком.', '{"schemaVersion":1,"framingMode":"detail","composition":"Различимая маркировка или принт крупно в центральной скруглённой панели; белый заголовок сверху слева и короткая кремовая подпись внизу.","conditions":["Использовать только читаемую и видимую область исходного товара","Не восстанавливать неразборчивые буквы, не менять бренд и не копировать бренд reference"],"fallbackComposition":"Товар целиком в центральной панели и нейтральный заголовок сверху; отдельную деталь и неподтверждённую подпись убрать."}'::jsonb),
              ('tpl_fashion_summer_v09', 'tpl_fashion_summer', 9, 'Размеры и параметры', 'Разместить товар целиком сверху, а внизу крупно показать точные размеры или другие числовые параметры из описания пользователя. Если чисел нет, оставить название без значений.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком в верхней скруглённой панели; внизу слева белое название, справа крупное подтверждённое числовое значение с небольшой кремовой поясняющей строкой.","conditions":["Числа и единицы брать только из подтверждённых данных пользователя","Не переносить размерный ряд reference и не измерять товар по изображению"],"fallbackComposition":"Товар целиком сверху и нейтральное название снизу; числовой блок полностью убрать."}'::jsonb),
              ('tpl_fashion_summer_v10', 'tpl_fashion_summer', 10, 'Итоговая карточка', 'Завершить серию спокойной композицией с товаром целиком, крупным названием и одной короткой подтверждённой подписью. Сохранить тёплый фон и кремовые акценты.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком по центру на тёмной скруглённой панели; крупное белое название сверху слева, одна кремовая подпись внизу, небольшой контур солнца в свободном углу.","conditions":["Итоговая подпись содержит только подтверждённое сведение","Не добавлять цены, рейтинги, акции и рекламные обещания без исходных данных"],"fallbackComposition":"Товар целиком по центру и нейтральное название сверху; неподтверждённую подпись опустить."}'::jsonb)
              ON CONFLICT (id) DO UPDATE SET title=EXCLUDED.title, default_idea=EXCLUDED.default_idea,
              generation_recipe=EXCLUDED.generation_recipe
              WHERE template_card_variants.template_id='tpl_fashion_summer'
              AND template_card_variants.position=EXCLUDED.position;
  - changeSet:
      id: 079-fashion-winter-variants
      author: codex
      runInTransaction: true
      changes:
        - sql:
            splitStatements: false
            sql: |
              SET LOCAL standard_conforming_strings = on;
              INSERT INTO template_card_variants(id,template_id,position,title,default_idea,generation_recipe) VALUES
              ('tpl_fashion_winter_v01', 'tpl_fashion_winter', 1, 'Обложка', 'Показать исходный товар крупно и целиком на светло-сером фоне. Сверху разместить крупное название, слева короткие подтверждённые сведения, внизу небольшой фрагмент реально видимой детали.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Крупный тёмный заголовок сверху, товар целиком в центре и справа; короткие фактические подписи слева, небольшой скруглённый блок видимой детали снизу слева.","conditions":["Модель допустима только при её наличии на исходном фото","Вставку формировать только из различимого участка исходного товара; не повторять демонстрационные даты и свойства"],"fallbackComposition":"Товар целиком справа, название сверху и одна нейтральная подпись слева; вставку неизвестной детали убрать."}'::jsonb),
              ('tpl_fashion_winter_v02', 'tpl_fashion_winter', 2, 'Силуэт', 'Выделить силуэт исходного товара на светло-сером поле. Оставить крупное название сверху и одну сдержанную подпись под ним.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком по центру с широкими светлыми полями; тёмный заголовок сверху слева и короткая строка под ним, без детальных вставок.","conditions":["Сохранять исходную форму и видимый ракурс","Не добавлять вторую единицу товара или модель ради композиции"],"fallbackComposition":"Товар целиком по центру и нейтральный заголовок сверху."}'::jsonb),
              ('tpl_fashion_winter_v03', 'tpl_fashion_winter', 3, 'Фактура поверхности', 'Показать крупно различимую фактуру поверхности товара в скруглённой рамке. О материале написать только при наличии подтверждения; если фактура не видна, показать товар целиком.', '{"schemaVersion":1,"framingMode":"detail","composition":"Различимый участок поверхности крупно внутри скруглённой графитовой рамки в центре; слева короткий тёмный заголовок, ниже одна подтверждённая подпись.","conditions":["Не дорисовывать текстуру, блеск, швы или состав материала","Использовать крупный план только при достаточной различимости участка"],"fallbackComposition":"Исходный товар целиком в центре на светлом фоне; рамку детали убрать, оставить нейтральное название."}'::jsonb),
              ('tpl_fashion_winter_v04', 'tpl_fashion_winter', 4, 'Видимая конструкция', 'Сделать акцент на действительно видимом конструктивном элементе: застёжке, шве или соединении. Не добавлять скрытые детали; при недостатке данных показать общий вид.', '{"schemaVersion":1,"framingMode":"detail","composition":"Крупный различимый конструктивный элемент в правой части светлого поля; слева тёмный заголовок и компактная фактическая подпись, тонкая серая линия разделяет блоки.","conditions":["Выбирать только элемент, видимый на исходном фото","Не выдумывать механизм, надёжность или функциональность элемента"],"fallbackComposition":"Товар целиком справа; слева нейтральное название без технических утверждений."}'::jsonb),
              ('tpl_fashion_winter_v05', 'tpl_fashion_winter', 5, 'Внутренняя деталь', 'Если внутренняя часть товара видна на исходном фото, показать её крупно в тёмной скруглённой вставке. Если она скрыта, заменить вставку общим видом без предположений об утеплении и составе.', '{"schemaVersion":1,"framingMode":"detail","composition":"Скруглённая графитовая панель с крупным планом различимой внутренней части слева; название сверху, одна подтверждённая подпись справа на светлом фоне.","conditions":["Внутреннюю часть не раскрывать и не реконструировать, если её нет на исходном фото","Не переносить мех, утепление и температурные обещания из reference"],"fallbackComposition":"Товар целиком на светлом поле справа, название слева; вставку и сведения о скрытой внутренней части опустить."}'::jsonb),
              ('tpl_fashion_winter_v06', 'tpl_fashion_winter', 6, 'Подтверждённые размеры', 'Показать товар целиком и разместить рядом компактный блок только с размерами, явно указанными в описании. При отсутствии данных оставить нейтральную подпись.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком справа; слева крупный заголовок и скруглённый серый блок точных размеров с крупными числами и короткими подписями.","conditions":["Числа, единицы и размерный ряд брать только из подтверждённых данных","Не определять размер по фотографии и не копировать 36–40 из reference"],"fallbackComposition":"Товар целиком справа и нейтральное название слева, размерный блок убрать."}'::jsonb),
              ('tpl_fashion_winter_v07', 'tpl_fashion_winter', 7, 'Особенности', 'Собрать до трёх подтверждённых особенностей рядом с товаром целиком. Сохранить крупный заголовок, светлый фон и короткие тёмные подписи.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком справа, слева вертикальный список до трёх фактических строк с аккуратными треугольными маркерами; тёмный заголовок сверху.","conditions":["Количество строк соответствует числу подтверждённых сведений","Не приписывать тепло, прочность, натуральный состав или сезонность по виду товара"],"fallbackComposition":"Товар справа и одна нейтральная подпись слева; лишние маркеры убрать."}'::jsonb),
              ('tpl_fashion_winter_v08', 'tpl_fashion_winter', 8, 'Уход', 'Разместить товар целиком слева, а справа короткие подтверждённые рекомендации по уходу. Если рекомендаций нет, использовать только нейтральное название товара.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком слева на светлом поле; справа крупный заголовок и компактная скруглённая серая панель с короткими строками ухода.","conditions":["Уход брать только из описания пользователя или читаемой маркировки","Не придумывать допустимую стирку, чистку и температурные режимы"],"fallbackComposition":"Товар целиком слева, нейтральный заголовок справа без панели рекомендаций."}'::jsonb),
              ('tpl_fashion_winter_v09', 'tpl_fashion_winter', 9, 'Маркировка', 'Показать крупно читаемую маркировку исходного товара и сохранить её без изменений. Неразборчивую маркировку не восстанавливать, вместо этого показать товар целиком.', '{"schemaVersion":1,"framingMode":"detail","composition":"Читаемая маркировка крупно в скруглённом тёмно-сером окне по центру; короткий заголовок сверху слева, одна фактическая подпись снизу.","conditions":["Крупный план допустим только для читаемой маркировки на исходном фото","Не менять бренд, символы и буквы; не добавлять знаки сертификации"],"fallbackComposition":"Товар целиком на светлом поле с нейтральным названием; окно неизвестной маркировки опустить."}'::jsonb),
              ('tpl_fashion_winter_v10', 'tpl_fashion_winter', 10, 'Итоговая карточка', 'Завершить серию чистой карточкой: товар целиком по центру, крупное название сверху и одно краткое подтверждённое сведение в серой плашке внизу.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком в центре на светло-сером фоне; крупный тёмный заголовок сверху, одна широкая скруглённая фактическая плашка внизу.","conditions":["Сохранять товар и надписи с безопасными полями не менее 5%","Не добавлять скидки, рейтинги, даты сезона или новые обещания"],"fallbackComposition":"Товар целиком по центру и нейтральное название сверху; неподтверждённую нижнюю плашку убрать."}'::jsonb)
              ON CONFLICT (id) DO UPDATE SET title=EXCLUDED.title, default_idea=EXCLUDED.default_idea,
              generation_recipe=EXCLUDED.generation_recipe
              WHERE template_card_variants.template_id='tpl_fashion_winter'
              AND template_card_variants.position=EXCLUDED.position;
