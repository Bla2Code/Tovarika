databaseChangeLog:
  - changeSet:
      id: 084-hidden-universal-variants
      author: codex
      runInTransaction: true
      changes:
        - sql:
            splitStatements: false
            sql: |
              SET LOCAL standard_conforming_strings = on;
              INSERT INTO template_card_variants(id,template_id,position,title,default_idea,generation_recipe) VALUES
              ('tpl_universal_auto_v01', 'tpl_universal_auto', 1, 'Обложка', 'Показать товар целиком, подобрав фон, цвет и композицию по идее анализа. Оставить место для короткого подтверждённого названия.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком как главный объект; фон, цвет и информационные зоны определяются итоговой идеей анализа.","conditions":["Сохранять идентичность, цвет и видимые надписи исходного товара","Использовать только факты описания и различимые детали исходного фото; не придумывать ракурсы и свойства","Сохранять оформление серии; цвет и фон reference не являются обязательными"],"fallbackComposition":"Товар целиком в исходном ракурсе на фоне серии, без неподтверждённых деталей и подписей."}'::jsonb),
              ('tpl_universal_auto_v02', 'tpl_universal_auto', 2, 'Форма товара', 'Выделить форму товара целиком, сохранив фон, палитру и свет первой карточки.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком с акцентом на контуре; оставить свободное пространство вокруг него.","conditions":["Сохранять идентичность, цвет и видимые надписи исходного товара","Использовать только факты описания и различимые детали исходного фото; не придумывать ракурсы и свойства","Сохранять оформление серии; цвет и фон reference не являются обязательными"],"fallbackComposition":"Товар целиком в исходном ракурсе на фоне серии, без неподтверждённых деталей и подписей."}'::jsonb),
              ('tpl_universal_auto_v03', 'tpl_universal_auto', 3, 'Главная особенность', 'Подчеркнуть одну подтверждённую особенность товара короткой подписью в оформлении серии.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком с одной короткой подтверждённой подписью в свободной зоне.","conditions":["Сохранять идентичность, цвет и видимые надписи исходного товара","Использовать только факты описания и различимые детали исходного фото; не придумывать ракурсы и свойства","Сохранять оформление серии; цвет и фон reference не являются обязательными"],"fallbackComposition":"Товар целиком в исходном ракурсе на фоне серии, без неподтверждённых деталей и подписей."}'::jsonb),
              ('tpl_universal_auto_v04', 'tpl_universal_auto', 4, 'Видимая фактура', 'Показать различимую на исходном фото фактуру крупнее; если она не видна, оставить товар целиком.', '{"schemaVersion":1,"framingMode":"detail","composition":"Один действительно различимый фрагмент поверхности в мягком свете, с фоном и палитрой серии.","conditions":["Сохранять идентичность, цвет и видимые надписи исходного товара","Использовать только факты описания и различимые детали исходного фото; не придумывать ракурсы и свойства","Сохранять оформление серии; цвет и фон reference не являются обязательными"],"fallbackComposition":"Товар целиком в исходном ракурсе на фоне серии, без неподтверждённых деталей и подписей."}'::jsonb),
              ('tpl_universal_auto_v05', 'tpl_universal_auto', 5, 'Видимая деталь', 'Выделить одну видимую деталь изделия. Если деталь неразличима, показать товар целиком.', '{"schemaVersion":1,"framingMode":"detail","composition":"Крупный план подтверждённой конструктивной детали без дорисовки скрытых элементов.","conditions":["Сохранять идентичность, цвет и видимые надписи исходного товара","Использовать только факты описания и различимые детали исходного фото; не придумывать ракурсы и свойства","Сохранять оформление серии; цвет и фон reference не являются обязательными"],"fallbackComposition":"Товар целиком в исходном ракурсе на фоне серии, без неподтверждённых деталей и подписей."}'::jsonb),
              ('tpl_universal_auto_v06', 'tpl_universal_auto', 6, 'Маркировка', 'Подчеркнуть читаемую маркировку или логотип исходного товара без изменений; иначе показать общий вид.', '{"schemaVersion":1,"framingMode":"detail","composition":"Видимый фрагмент с настоящей читаемой маркировкой; свободное пространство без выдуманных надписей.","conditions":["Сохранять идентичность, цвет и видимые надписи исходного товара","Использовать только факты описания и различимые детали исходного фото; не придумывать ракурсы и свойства","Сохранять оформление серии; цвет и фон reference не являются обязательными"],"fallbackComposition":"Товар целиком в исходном ракурсе на фоне серии, без неподтверждённых деталей и подписей."}'::jsonb),
              ('tpl_universal_auto_v07', 'tpl_universal_auto', 7, 'Реальный цвет', 'Показать настоящий цвет товара в мягком свете на согласованном с серией фоне.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком; фон отделяет его контур и не меняет восприятие реального цвета.","conditions":["Сохранять идентичность, цвет и видимые надписи исходного товара","Использовать только факты описания и различимые детали исходного фото; не придумывать ракурсы и свойства","Сохранять оформление серии; цвет и фон reference не являются обязательными"],"fallbackComposition":"Товар целиком в исходном ракурсе на фоне серии, без неподтверждённых деталей и подписей."}'::jsonb),
              ('tpl_universal_auto_v08', 'tpl_universal_auto', 8, 'Подтверждённые сведения', 'Разместить рядом с товаром до двух кратких подтверждённых фактов, сохраняя оформление серии.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком сбоку, до двух коротких достоверных подписей в свободной зоне.","conditions":["Сохранять идентичность, цвет и видимые надписи исходного товара","Использовать только факты описания и различимые детали исходного фото; не придумывать ракурсы и свойства","Сохранять оформление серии; цвет и фон reference не являются обязательными"],"fallbackComposition":"Товар целиком в исходном ракурсе на фоне серии, без неподтверждённых деталей и подписей."}'::jsonb),
              ('tpl_universal_auto_v09', 'tpl_universal_auto', 9, 'Исходный ракурс', 'Показать товар целиком в ракурсе исходного фото, изменив размещение в рамках оформления серии.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Смещённый от центра товар целиком; использовать только исходный ракурс без реконструкции невидимых сторон.","conditions":["Сохранять идентичность, цвет и видимые надписи исходного товара","Использовать только факты описания и различимые детали исходного фото; не придумывать ракурсы и свойства","Сохранять оформление серии; цвет и фон reference не являются обязательными"],"fallbackComposition":"Товар целиком в исходном ракурсе на фоне серии, без неподтверждённых деталей и подписей."}'::jsonb),
              ('tpl_universal_auto_v10', 'tpl_universal_auto', 10, 'Итоговая карточка', 'Завершить серию чистой карточкой с товаром целиком и при необходимости подтверждённым названием.', '{"schemaVersion":1,"framingMode":"full_product","composition":"Товар целиком с достаточным свободным пространством; короткое подтверждённое название при наличии данных.","conditions":["Сохранять идентичность, цвет и видимые надписи исходного товара","Использовать только факты описания и различимые детали исходного фото; не придумывать ракурсы и свойства","Сохранять оформление серии; цвет и фон reference не являются обязательными"],"fallbackComposition":"Товар целиком в исходном ракурсе на фоне серии, без неподтверждённых деталей и подписей."}'::jsonb)
              ON CONFLICT (id) DO UPDATE SET title=EXCLUDED.title, default_idea=EXCLUDED.default_idea,
              generation_recipe=EXCLUDED.generation_recipe
              WHERE template_card_variants.template_id='tpl_universal_auto'
              AND template_card_variants.position=EXCLUDED.position;
